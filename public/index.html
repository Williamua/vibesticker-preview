<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeSticker</title><meta name="color-scheme" content="light dark">
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
<style>
:root{--bg:#f6f5ff;--fg:#1b1b2f;--card:#fff;--ac:#7c4dff}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f1f;--fg:#ecebff;--card:#1b1c33}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:560px;margin:auto;padding:16px 16px 100px}h1{text-align:center;margin:8px 0}
.lang{text-align:right}.lang button{background:none;border:1px solid var(--ac);color:var(--fg);border-radius:8px;margin-left:4px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
.styles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.styles label{border:2px solid transparent;border-radius:10px;padding:8px;background:var(--bg);cursor:pointer;transition:transform .2s}
.styles label:hover{transform:scale(1.05)}.styles input{display:none}.styles label:has(input:checked){border-color:var(--ac);font-weight:700}
#gen{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(90%,520px);padding:16px;border:0;border-radius:30px;background:var(--ac);color:#fff;font-size:18px;animation:breathe 2s infinite}
@keyframes breathe{50%{box-shadow:0 0 24px var(--ac)}}
#out img{width:48%;border-radius:12px;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0/20px 20px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row a,.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ac);background:none;color:var(--fg);text-align:center;text-decoration:none}
small{opacity:.7}
</style></head><body><main>
<div class="lang"><button data-l="en">EN</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div>
<h1>VibeSticker</h1><p style="text-align:center" data-i="tag"></p>
<div class="card"><input type="file" id="file" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif"><img id="src" style="max-width:100%;display:none;margin-top:8px;border-radius:10px"></div>
<div class="card"><b data-i="style"></b><div class="styles" id="styles"></div></div>
<div class="card" id="quota"></div>
<div class="card" id="out" style="display:none"><div class="row"><img id="png"><img id="gif"></div><div class="row" style="margin-top:8px">
<a id="dpng" data-i="dpng"></a><a id="dgif" data-i="dgif"></a></div><div class="row" style="margin-top:8px">
<a id="sx" target="_blank">X</a><button onclick="share()">Instagram / TikTok</button><button onclick="again()" data-i="again"></button></div></div>
<div class="card" id="buy"><b data-i="buy"></b><div class="row" id="tiers" style="margin-top:8px"></div></div>
<div class="card"><small><b data-i="noticeT"></b><br><span data-i="notice"></span><br><br>Powered by AI</small></div>
</main><button id="gen" data-i="gen"></button>
<script src="/app.js"></script></body></html>
