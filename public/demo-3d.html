<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VibeSticker · 3D 房间 · 果冻海</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1210;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:14px 18px;text-align:center;
    color:#fff8f0;font-size:15px;letter-spacing:.04em;
    background:linear-gradient(180deg,rgba(26,18,16,.72),rgba(26,18,16,0));
    pointer-events:none;user-select:none;
  }
  #phase{
    position:fixed;bottom:16px;left:0;right:0;z-index:10;
    text-align:center;color:rgba(255,248,240,.7);font-size:12px;
    pointer-events:none;user-select:none;letter-spacing:.08em;
  }
  #c{display:block;width:100%;height:100%;touch-action:none}
  #err{
    display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    padding:24px;background:rgba(26,18,16,.92);color:#fff8f0;font-size:15px;line-height:1.6;
    text-align:center;white-space:pre-wrap;
  }
  #err.show{display:flex}
</style>
</head>
<body>
<div id="hud">拖动环视 · 滚轮缩放 · 点击显示器靠近</div>
<div id="phase">昼夜循环 · 约 75 秒一轮</div>
<div id="err" role="alert"></div>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CYCLE_MS = 75000;
const phaseEl = document.getElementById('phase');
const errEl = document.getElementById('err');
function showErr(msg) {
  console.error(msg);
  errEl.textContent = '3D 加载失败\n' + msg + '\n\n可刷新重试；若仍黑屏，请换浏览器或更新系统。';
  errEl.classList.add('show');
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: !isMobile, alpha: false,
    powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false,
  });
} catch (e1) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'default' });
}
if (!renderer.getContext()) throw new Error('WebGL 不可用（当前设备/浏览器不支持）');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.35 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x161210, 1);
// 移动端也开软阴影（降分辨率），避免塑料平光
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isMobile ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// —— 房间再 ×2（相对上一版），全程室内 ——
const ROOM_W = 24, ROOM_D = 20, WALL_H = 10;
const WALL_Z = -ROOM_D / 2;
const CAM_MARGIN = 1.4;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161210);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.15, 120);
camera.position.set(0, 5.2, 6.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.target.set(0, 3.4, -8.5);
controls.minDistance = 2.0;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minPolarAngle = 0.32;
// 软限位：可越过「电脑边对齐拐角」一点，松手回弹；硬顶防穿帮
const AZ_SOFT = 0.85;
const AZ_HARD = 1.08;
controls.minAzimuthAngle = -AZ_HARD;
controls.maxAzimuthAngle =  AZ_HARD;
controls.update();

let orbitDragging = false;
controls.addEventListener('start', () => { orbitDragging = true; });
controls.addEventListener('end', () => { orbitDragging = false; });

const _sph = new THREE.Spherical();
const _offset = new THREE.Vector3();
function setAzimuth(theta) {
  _offset.subVectors(camera.position, controls.target);
  _sph.setFromVector3(_offset);
  _sph.theta = theta;
  _sph.makeSafe();
  camera.position.copy(controls.target).add(_offset.setFromSpherical(_sph));
}
function softAzimuth(dt) {
  const az = controls.getAzimuthalAngle();
  if (az > AZ_SOFT) {
    const goal = orbitDragging ? (AZ_SOFT + (az - AZ_SOFT) * 0.42) : AZ_SOFT;
    const lambda = orbitDragging ? 10 : 7.2;
    setAzimuth(THREE.MathUtils.damp(az, goal, lambda, dt));
  } else if (az < -AZ_SOFT) {
    const goal = orbitDragging ? (-AZ_SOFT + (az + AZ_SOFT) * 0.42) : -AZ_SOFT;
    const lambda = orbitDragging ? 10 : 7.2;
    setAzimuth(THREE.MathUtils.damp(az, goal, lambda, dt));
  }
}

function clampIndoor() {
  const hx = ROOM_W / 2 - CAM_MARGIN;
  const hz = ROOM_D / 2 - CAM_MARGIN;
  const p = camera.position;
  p.x = THREE.MathUtils.clamp(p.x, -hx, hx);
  p.y = THREE.MathUtils.clamp(p.y, 2.4, WALL_H - 1.0);
  p.z = THREE.MathUtils.clamp(p.z, -hz + 0.6, hz);
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -ROOM_W / 2 + 2.2, ROOM_W / 2 - 2.2);
  t.y = THREE.MathUtils.clamp(t.y, 1.6, WALL_H - 1.4);
  // 允许注视点落到窗洞附近（窗外景色），但相机本身仍锁室内
  t.z = THREE.MathUtils.clamp(t.z, -ROOM_D / 2 - 4.0, ROOM_D / 2 - 1.8);
  if (p.distanceTo(t) < 1.2) {
    const dir = new THREE.Vector3().subVectors(t, p);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
    else dir.normalize();
    t.copy(p).addScaledVector(dir, 1.4);
  }
}

// —— 灯光：窗外阳光为主 + 室内间接光（无假光柱）——
const ambient = new THREE.AmbientLight(0xc8b8a8, 0.045);
scene.add(ambient);

// 天空半球：冷天光 / 暖地面回弹
const hemi = new THREE.HemisphereLight(0xb8d4f0, 0x3a2a1c, 0.22);
scene.add(hemi);

// 主阳光：从窗外射入（方向光 + 柔和阴影）
const sun = new THREE.DirectionalLight(0xffe2c0, 2.05);
sun.castShadow = true;
const shadowRes = isMobile ? 512 : 2048;
sun.shadow.mapSize.set(shadowRes, shadowRes);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -16;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.035;
sun.shadow.radius = isMobile ? 2.5 : 4.5;
sun.target.position.set(0, 2.8, 1.6);
scene.add(sun);
scene.add(sun.target);

// 窗洞聚光：模拟窗框约束的光束（大 penumbra 更自然）
const windowSpot = new THREE.SpotLight(0xfff0d8, 1.55, 36, Math.PI / 3.6, 0.72, 1.25);
windowSpot.position.set(0, 5.6, WALL_Z + 0.15);
windowSpot.target.position.set(0, 2.2, 2.4);
windowSpot.castShadow = !isMobile;
if (!isMobile) {
  windowSpot.shadow.mapSize.set(1024, 1024);
  windowSpot.shadow.bias = -0.00015;
  windowSpot.shadow.normalBias = 0.03;
  windowSpot.shadow.radius = 3;
}
scene.add(windowSpot);
scene.add(windowSpot.target);

// 窗边暖色弹射（照亮窗前地面/桌面）
const windowBounce = new THREE.PointLight(0xffe6c8, 0.85, 22, 1.75);
windowBounce.position.set(0, 4.6, WALL_Z + 2.0);
scene.add(windowBounce);

// 地板冷色弱回弹，减轻死黑角
const floorBounce = new THREE.PointLight(0xd8c8b0, 0.28, 18, 2);
floorBounce.position.set(0, 0.6, 1.5);
scene.add(floorBounce);

// 前墙方向极弱补光（反弹）
const fill = new THREE.DirectionalLight(0xa8c0d8, 0.08);
fill.position.set(0, 6, 10);
scene.add(fill);

const lamp = new THREE.PointLight(0xffcc88, 0.18, 16, 2);
lamp.position.set(2.0, 5.2, 0.4);
scene.add(lamp);

const mat = {
  floor: new THREE.MeshStandardMaterial({ color: 0x5a3c2c, roughness: 0.92, metalness: 0.02 }),
  wall:  new THREE.MeshStandardMaterial({ color: 0xd6c8b4, roughness: 0.9, metalness: 0.0 }),
  wallBack: new THREE.MeshStandardMaterial({ color: 0xcec0ac, roughness: 0.88, metalness: 0.0 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0xebe3d6, roughness: 0.96, metalness: 0.0 }),
  wood:  new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.78, metalness: 0.04 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x4f3424, roughness: 0.82, metalness: 0.04 }),
  black: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.55, metalness: 0.25 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x1e3a55, emissive: 0x163850, emissiveIntensity: 0.45, roughness: 0.4 }),
  skin:  new THREE.MeshStandardMaterial({ color: 0xe8b896, roughness: 0.7 }),
  cloth: new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.8 }),
  hair:  new THREE.MeshStandardMaterial({ color: 0x2a1f18, roughness: 0.9 }),
  cup:   new THREE.MeshStandardMaterial({ color: 0xf0e6d8, roughness: 0.4 }),
  trash: new THREE.MeshStandardMaterial({ color: 0x4a4a48, roughness: 0.65, metalness: 0.15 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xf7f2ea, roughness: 0.42, metalness: 0.05 }),
  frameDark: new THREE.MeshStandardMaterial({ color: 0xd8d0c4, roughness: 0.55, metalness: 0.04 }),
  sill:  new THREE.MeshStandardMaterial({ color: 0xefe8dc, roughness: 0.48, metalness: 0.03 }),
};

function box(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cyl(rTop, rBot, h, material, x, y, z, segs = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, segs), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

const room = new THREE.Group();
scene.add(room);

// 围合六面（开窗洞的后墙除外）
room.add(box(ROOM_W, 0.08, ROOM_D, mat.floor, 0, 0, 0));
room.add(box(ROOM_W, 0.08, ROOM_D, mat.ceiling, 0, WALL_H, 0));
room.add(box(0.1, WALL_H, ROOM_D, mat.wall, -ROOM_W / 2, WALL_H / 2, 0));
room.add(box(0.1, WALL_H, ROOM_D, mat.wall, ROOM_W / 2, WALL_H / 2, 0));
room.add(box(ROOM_W, WALL_H, 0.1, mat.wall, 0, WALL_H / 2, ROOM_D / 2)); // 前墙

// —— 后墙开窗 ——
const winW = 9.0, winH = 5.4, winY = 5.7;
const winBottom = winY - winH / 2;
const winTop = winY + winH / 2;
const wallT = 0.28;
const leftW = (ROOM_W - winW) / 2;
room.add(box(leftW, WALL_H, wallT, mat.wallBack, -ROOM_W / 2 + leftW / 2, WALL_H / 2, WALL_Z));
room.add(box(leftW, WALL_H, wallT, mat.wallBack, ROOM_W / 2 - leftW / 2, WALL_H / 2, WALL_Z));
room.add(box(winW, winBottom, wallT, mat.wallBack, 0, winBottom / 2, WALL_Z));
room.add(box(winW, WALL_H - winTop, wallT, mat.wallBack, 0, winTop + (WALL_H - winTop) / 2, WALL_Z));

// —— 精致窗框（外框 + 内凹止口 + 分格）——
const casingD = 0.42, casingT = 0.22, casingZ = WALL_Z + 0.14;
// 外框
room.add(box(winW + casingT * 2, casingT, casingD, mat.frame, 0, winTop + casingT / 2, casingZ));
room.add(box(winW + casingT * 2, casingT, casingD, mat.frame, 0, winBottom - casingT / 2, casingZ));
room.add(box(casingT, winH + casingT * 2, casingD, mat.frame, -winW / 2 - casingT / 2, winY, casingZ));
room.add(box(casingT, winH + casingT * 2, casingD, mat.frame, winW / 2 + casingT / 2, winY, casingZ));
// 内凹止口（略深、略窄）
const innerT = 0.1, innerD = 0.28, innerZ = WALL_Z + 0.02;
room.add(box(winW - 0.04, innerT, innerD, mat.frameDark, 0, winTop - innerT / 2 - 0.02, innerZ));
room.add(box(winW - 0.04, innerT, innerD, mat.frameDark, 0, winBottom + innerT / 2 + 0.02, innerZ));
room.add(box(innerT, winH - 0.04, innerD, mat.frameDark, -winW / 2 + innerT / 2 + 0.02, winY, innerZ));
room.add(box(innerT, winH - 0.04, innerD, mat.frameDark, winW / 2 - innerT / 2 - 0.02, winY, innerZ));

// 窗台：厚板 + 滴水沿 + 侧耳
const sillDepth = 0.7, sillThick = 0.14, sillOverhang = 0.28;
room.add(box(winW + casingT * 2 + sillOverhang * 2, sillThick, sillDepth, mat.sill,
  0, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));
room.add(box(winW + casingT * 2 + sillOverhang * 2, 0.06, 0.05, mat.frameDark,
  0, winBottom - sillThick - 0.03, WALL_Z + 0.12));
room.add(box(0.08, sillThick + 0.04, sillDepth * 0.92, mat.sill,
  -winW / 2 - casingT - sillOverhang + 0.04, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));
room.add(box(0.08, sillThick + 0.04, sillDepth * 0.92, mat.sill,
  winW / 2 + casingT + sillOverhang - 0.04, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));

// 分格：中梃 + 横档（带前后两层厚度感）
const mullT = 0.12, mullD = 0.3, mullZ = WALL_Z + 0.1;
function addMullion(w, h, d, x, y, z) {
  room.add(box(w, h, d, mat.frame, x, y, z));
  room.add(box(Math.max(0.04, w * 0.55), Math.max(0.04, h * 0.55), d * 0.55, mat.frameDark, x, y, z + 0.04));
}
addMullion(mullT, winH - 0.08, mullD, 0, winY, mullZ);
addMullion(winW - 0.08, mullT, mullD, 0, winY, mullZ);
// 外圈窄压条
const lip = 0.07;
addMullion(winW - 0.06, lip, mullD * 0.85, 0, winTop - lip / 2 - 0.01, mullZ);
addMullion(winW - 0.06, lip, mullD * 0.85, 0, winBottom + lip / 2 + 0.01, mullZ);
addMullion(lip, winH - 0.06, mullD * 0.85, -winW / 2 + lip / 2 + 0.01, winY, mullZ);
addMullion(lip, winH - 0.06, mullD * 0.85, winW / 2 - lip / 2 - 0.01, winY, mullZ);

// 天空纹理（兼作玻璃 envMap，无 transmission）
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 512; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
// 玻璃 env 用克隆，避免改 mapping 搞坏天空 mesh 的 UV 采样
const skyEnv = skyTex.clone();
skyEnv.mapping = THREE.EquirectangularReflectionMapping;
skyEnv.colorSpace = THREE.SRGBColorSpace;

function drawSky(topHex, midHex, botHex, disc) {
  const g = skyCtx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, topHex);
  g.addColorStop(0.42, midHex);
  g.addColorStop(0.72, botHex);
  g.addColorStop(1, botHex);
  skyCtx.fillStyle = g;
  skyCtx.fillRect(0, 0, 512, 512);
  if (disc && disc.r > 0) {
    const grd = skyCtx.createRadialGradient(disc.x, disc.y, 2, disc.x, disc.y, disc.r);
    grd.addColorStop(0, disc.color);
    grd.addColorStop(0.4, disc.color + 'aa');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    skyCtx.fillStyle = grd;
    skyCtx.beginPath();
    skyCtx.arc(disc.x, disc.y, disc.r, 0, Math.PI * 2);
    skyCtx.fill();
  }
  skyTex.needsUpdate = true;
  skyEnv.needsUpdate = true;
}

// 玻璃：双层薄片 + env 反光（iOS 安全）
const glassMat = new THREE.MeshStandardMaterial({
  color: 0xe8f2fa, transparent: true, opacity: 0.14,
  roughness: 0.06, metalness: 0.15, envMap: skyEnv, envMapIntensity: 1.15,
  side: THREE.DoubleSide, depthWrite: false,
});
const glassTint = new THREE.MeshStandardMaterial({
  color: 0xcfe4f4, transparent: true, opacity: 0.07,
  roughness: 0.2, metalness: 0.05, envMap: skyEnv, envMapIntensity: 0.55,
  side: THREE.DoubleSide, depthWrite: false,
});
const paneGap = 0.04;
const paneW = (winW - mullT) / 2 - paneGap;
const paneH = (winH - mullT) / 2 - paneGap;
const panePositions = [
  [-paneW / 2 - mullT / 2, winY + paneH / 2 + mullT / 2],
  [ paneW / 2 + mullT / 2, winY + paneH / 2 + mullT / 2],
  [-paneW / 2 - mullT / 2, winY - paneH / 2 - mullT / 2],
  [ paneW / 2 + mullT / 2, winY - paneH / 2 - mullT / 2],
];
for (const [px, py] of panePositions) {
  const outer = box(paneW, paneH, 0.012, glassMat, px, py, WALL_Z + 0.06);
  outer.castShadow = false; outer.receiveShadow = false;
  room.add(outer);
  const inner = box(paneW * 0.985, paneH * 0.985, 0.01, glassTint, px, py, WALL_Z - 0.02);
  inner.castShadow = false; inner.receiveShadow = false;
  room.add(inner);
}

// —— 窗外：天空 + 果冻海（几何体严格在窗墙外侧，永不进室内）——
// 窗外世界放在独立组；海面近边世界 Z 必须 < WALL_Z - SEA_GAP
const SEA_GAP = 2.5;
const SEA_CLIP_Z = WALL_Z - SEA_GAP; // 着色器再 discard 一道保险
const outside = new THREE.Group();
outside.position.set(0, 0, 0); // 用世界坐标摆窗外物体，避免局部偏移算错
scene.add(outside);

const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, color: 0x87c8e8, depthWrite: true, fog: false });
const skyMesh = new THREE.Mesh(new THREE.PlaneGeometry(120, 70), skyMat);
// 天空板严格在海更远处，不包裹房间
skyMesh.position.set(0, 8, SEA_CLIP_Z - 36);
outside.add(skyMesh);

// 窗外遮挡环（窗墙外侧四块板），确保透明海不会“贴”到内墙前面
(function addWindowOccluders() {
  const mats = new THREE.MeshBasicMaterial({ color: 0x161410, side: THREE.DoubleSide });
  const z = WALL_Z - 0.4;
  const gapX = (ROOM_W - winW) / 2;
  const panels = [
    [-ROOM_W / 2 + gapX / 2, WALL_H / 2, gapX, WALL_H],
    [ ROOM_W / 2 - gapX / 2, WALL_H / 2, gapX, WALL_H],
    [0, winBottom / 2, winW + 0.05, Math.max(0.2, winBottom)],
    [0, winTop + (WALL_H - winTop) / 2, winW + 0.05, Math.max(0.2, WALL_H - winTop)],
  ];
  for (const [x, y, w, h] of panels) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), mats);
    m.position.set(x, y, z);
    outside.add(m);
  }
})();

// 水底（沙/石 + 动态焦散）——主体「果冻海」观感来自看清水底
const bedSeg = isMobile ? 32 : 64;
const bedW = 56, bedD = 24; // X × Z
// 中心放在窗外足够远：近边 = centerZ + bedD/2 <= SEA_CLIP_Z
const bedCenterZ = SEA_CLIP_Z - bedD / 2 - 1.2;
const bedY = 2.2; // 固定高度：窗洞下半可见水面与水底
const bedGeo = new THREE.PlaneGeometry(bedW, bedD, bedSeg, Math.floor(bedSeg * 0.75));
bedGeo.rotateX(-Math.PI / 2);

const seaUniforms = {
  uTime: { value: 0 },
  uDeep: { value: new THREE.Color(0x06939a) },
  uShallow: { value: new THREE.Color(0x5aefe4) },
  uSand: { value: new THREE.Color(0xc9b896) },
  uRock: { value: new THREE.Color(0x8a8578) },
  uSky: { value: new THREE.Color(0x8ec8e8) },
  uSunDir: { value: new THREE.Vector3(0.25, 0.85, 0.35).normalize() },
  uSunCol: { value: new THREE.Color(0xfff5e0) },
  uSparkle: { value: 1.0 },
  uOpacity: { value: 0.55 },
  uClipZ: { value: SEA_CLIP_Z },
};

const bedMat = new THREE.ShaderMaterial({
  uniforms: seaUniforms,
  transparent: false,
  depthWrite: true,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime, uSparkle, uClipZ;
    uniform vec3 uDeep, uShallow, uSand, uRock, uSunCol, uSunDir;
    varying vec3 vWorld;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a = hash(i), b = hash(i+vec2(1.,0.)), c = hash(i+vec2(0.,1.)), d = hash(i+vec2(1.,1.));
      vec2 u = f*f*(3.-2.*f);
      return mix(a,b,u.x) + (c-a)*u.y*(1.-u.x) + (d-b)*u.x*u.y;
    }
    // 焦散：两层扭曲域的锐利亮网
    float caustic(vec2 p, float t) {
      vec2 q = p * 1.15;
      q += 0.25 * vec2(noise(q*2.0 + t*0.4), noise(q*2.3 - t*0.32));
      q += 0.15 * vec2(sin(q.y*4.0 + t*1.2), cos(q.x*3.6 - t*1.0));
      float c1 = pow(max(0.0, 1.0 - abs(sin(q.x*7.5) * sin(q.y*6.8))), 5.5);
      float c2 = pow(max(0.0, 1.0 - abs(sin((q.x+q.y)*5.5 + t*0.7) * sin((q.x-q.y)*6.2 - t*0.5))), 6.5);
      float c3 = pow(max(0.0, 1.0 - abs(sin(q.x*3.2 - q.y*2.8 + t))), 4.0) * 0.45;
      return clamp(c1 * 0.75 + c2 * 0.7 + c3, 0.0, 1.5);
    }
    void main() {
      if (vWorld.z > uClipZ) discard;
      vec2 wp = vWorld.xz * 0.35;
      float n = noise(wp * 2.2) * 0.55 + noise(wp * 5.5) * 0.3 + noise(wp * 11.0) * 0.15;
      float rockMask = smoothstep(0.55, 0.78, n + noise(wp * 1.1) * 0.2);
      vec3 bed = mix(uSand, uRock, rockMask);
      bed *= 0.75 + 0.35 * n;
      // 水深染色（越远/越「深」更青绿）
      float distFade = smoothstep(0.0, 1.0, length(vWorld.xz - vec2(0.0, uClipZ - 18.0)) / 28.0);
      vec3 waterTint = mix(uShallow, uDeep, distFade * 0.65 + 0.15);
      bed = mix(bed, waterTint, 0.45 + distFade * 0.25);
      float cau = caustic(wp * 1.4, uTime) * uSparkle;
      bed += mix(uSunCol, vec3(1.0), 0.35) * cau * (0.85 + 0.4 * max(dot(normalize(uSunDir), vec3(0.,1.,0.)), 0.0));
      bed = mix(bed, uShallow, 0.18 + cau * 0.12);
      // 浅处更亮的果冻感
      bed = mix(bed, uShallow * 1.2, 0.12 * (1.0 - distFade));
      gl_FragColor = vec4(bed, 1.0);
    }
  `,
});

  vertexShader: /* glsl */`
    uniform float uTime;
    varying vec3 vWorld;
    varying vec3 vN;
    float wave(vec2 p, float t) {
      float w = 0.0;
      w += sin(p.x * 0.55 + t * 0.9) * cos(p.y * 0.48 - t * 0.7) * 0.11;
      w += sin(p.x * 1.1 - t * 1.3 + p.y * 0.4) * 0.06;
      w += sin((p.x + p.y) * 1.6 + t * 1.7) * 0.025;
      return w;
    }
    void main() {
      vec3 pos = position;
      float h = wave(pos.xz, uTime);
      pos.y += h;
      float e = 0.25;
      float hx = wave(pos.xz + vec2(e,0.), uTime) - wave(pos.xz - vec2(e,0.), uTime);
      float hz = wave(pos.xz + vec2(0.,e), uTime) - wave(pos.xz - vec2(0.,e), uTime);
      vec3 n = normalize(vec3(-hx, 2.0 * e, -hz));
      vN = normalize(mat3(modelMatrix) * n);
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uDeep, uShallow, uSky, uSunCol, uSunDir;
    uniform float uSparkle, uOpacity, uClipZ;
    varying vec3 vWorld;
    varying vec3 vN;
    void main() {
      if (vWorld.z > uClipZ) discard;
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 2.4);

      jelly = mix(jelly, uSky, fres * 0.28);
      vec3 L = normalize(uSunDir);
      vec3 R = reflect(-L, N);
      float spec = pow(max(dot(R, V), 0.0), 96.0) * uSparkle;
      float soft = pow(max(dot(R, V), 0.0), 16.0) * 0.25 * uSparkle;
      jelly += uSunCol * (spec * 0.9 + soft);
      float alpha = mix(uOpacity * 0.42, min(0.78, uOpacity + 0.18), fres);
      gl_FragColor = vec4(jelly, alpha);
    }
  `,
});

const _cA = new THREE.Color(), _cB = new THREE.Color(), _cOut = new THREE.Color();
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3();

function lerpKeys(t) {
  let i = 0;
  while (i < KEYS.length - 1 && KEYS[i + 1].t < t) i++;
  const a = KEYS[i], b = KEYS[Math.min(i + 1, KEYS.length - 1)];
  const span = b.t - a.t || 1;
  const u = Math.min(1, Math.max(0, (t - a.t) / span));
  const e = u * u * (3 - 2 * u);
  return { a, b, e, name: e < 0.5 ? a.name : b.name };
}

function mixColor(out, ca, cb, e) {
  _cA.set(ca); _cB.set(cb);
  out.copy(_cA).lerp(_cB, e);
  return out;
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixHex(ha, hb, e) {
  const a = hexToRgb(ha), b = hexToRgb(hb);
  const r = Math.round(a[0] + (b[0] - a[0]) * e);
  const g = Math.round(a[1] + (b[1] - a[1]) * e);
  const bl = Math.round(a[2] + (b[2] - a[2]) * e);
  return `#${((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1)}`;
}

function applyDayCycle(t) {
  const { a, b, e, name } = lerpKeys(t);

  ambient.color.set(a.amb[0]).lerp(_cA.set(b.amb[0]), e);
  ambient.intensity = a.amb[1] + (b.amb[1] - a.amb[1]) * e;

  sun.color.set(a.sunCol).lerp(_cA.set(b.sunCol), e);
  sun.intensity = a.sunInt + (b.sunInt - a.sunInt) * e;
  _vA.set(...a.sunPos); _vB.set(...b.sunPos);
  sun.position.copy(_vA).lerp(_vB, e);
  sun.target.position.set(0, 2.8, 1.6);
  sun.target.updateMatrixWorld();

  windowSpot.color.set(a.spotCol).lerp(_cA.set(b.spotCol), e);
  windowSpot.intensity = a.spotInt + (b.spotInt - a.spotInt) * e;
  // 窗光跟随太阳方位，轻微偏斜
  windowSpot.position.x = sun.position.x * 0.12;
  windowSpot.target.position.set(-sun.position.x * 0.05, 2.2, 2.4);
  windowSpot.target.updateMatrixWorld();

  windowBounce.color.copy(windowSpot.color);
  windowBounce.intensity = (a.spotInt + (b.spotInt - a.spotInt) * e) * 0.48;
  floorBounce.color.copy(windowSpot.color).multiplyScalar(0.75);
  floorBounce.intensity = 0.12 + (a.spotInt + (b.spotInt - a.spotInt) * e) * 0.08;

  fill.intensity = a.fillInt + (b.fillInt - a.fillInt) * e;
  hemi.intensity = a.hemiInt + (b.hemiInt - a.hemiInt) * e;
  lamp.intensity = a.lampInt + (b.lampInt - a.lampInt) * e;

  const skyTop = mixHex(a.sky[0], b.sky[0], e);
  const skyMid = mixHex(a.sky[1], b.sky[1], e);
  const skyBot = mixHex(a.sky[2], b.sky[2], e);
  const disc = {
    x: a.disc.x + (b.disc.x - a.disc.x) * e,
    y: a.disc.y + (b.disc.y - a.disc.y) * e,
    r: a.disc.r + (b.disc.r - a.disc.r) * e,
    color: mixHex(a.disc.color, b.disc.color, e),
  };
  drawSky(skyTop, skyMid, skyBot, disc);
  hemi.color.set(skyMid);
  hemi.groundColor.set(a.wallTint).lerp(_cA.set(b.wallTint), e).multiplyScalar(0.35);

  scene.background.set(0x161210);
  renderer.toneMappingExposure = a.exposure + (b.exposure - a.exposure) * e;

  // 果冻海昼夜色 / 波光
  mixColor(seaUniforms.uDeep.value, a.seaDeep, b.seaDeep, e);
  mixColor(seaUniforms.uShallow.value, a.seaShallow, b.seaShallow, e);
  seaUniforms.uSky.value.set(skyMid);
  seaUniforms.uSunCol.value.copy(sun.color);
  seaUniforms.uSunDir.value.copy(sun.position).normalize();
  seaUniforms.uSparkle.value = a.seaSparkle + (b.seaSparkle - a.seaSparkle) * e;
  seaUniforms.uOpacity.value = 0.48 + (a.seaSparkle + (b.seaSparkle - a.seaSparkle) * e) * 0.1;
  seaUniforms.uClipZ.value = SEA_CLIP_Z;
  seaHaze.material.color.set(skyMid);
  seaHaze.material.opacity = 0.12 + (1 - seaUniforms.uSparkle.value) * 0.12;
  glassMat.envMapIntensity = 0.85 + seaUniforms.uSparkle.value * 0.4;
  glassTint.envMapIntensity = 0.4 + seaUniforms.uSparkle.value * 0.25;

  mixColor(_cOut, a.wallTint, b.wallTint, e);
  mat.wall.color.copy(_cOut);
  mat.wallBack.color.copy(_cOut).multiplyScalar(0.95);
  mat.ceiling.color.copy(_cOut).lerp(_cA.set(0xe8e0d4), 0.55);

  phaseEl.textContent = `昼夜循环 · ${name} · 约 75 秒一轮`;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let anim = null;

function startDock() {
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const toPos = new THREE.Vector3(0, 4.8, 3.4);
  const toTarget = new THREE.Vector3(0, 4.6, -2.8);
  anim = { t0: performance.now(), dur: 900, fromPos, toPos, fromTarget, toTarget };
  controls.enabled = false;
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

canvas.addEventListener('pointerdown', (e) => {
  if (anim) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([monitor], true);
  if (hits.length) {
    const startX = e.clientX, startY = e.clientY;
    const up = (ev) => {
      canvas.removeEventListener('pointerup', up);
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) startDock();
    };
    canvas.addEventListener('pointerup', up);
  }
});

addEventListener('resize', fit);
if (visualViewport) visualViewport.addEventListener('resize', fit);

const START_T = 0.2;
const t0 = performance.now() - START_T * CYCLE_MS;
let lastNow = performance.now();
function fit() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
fit();
clampIndoor();
applyDayCycle(START_T);
renderer.render(scene, camera);

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  const cycleT = ((now - t0) % CYCLE_MS) / CYCLE_MS;
  seaUniforms.uTime.value = now * 0.001;
  applyDayCycle(cycleT);

  if (anim) {
    const u = Math.min(1, (now - anim.t0) / anim.dur);
    const ee = easeInOut(u);
    camera.position.lerpVectors(anim.fromPos, anim.toPos, ee);
    controls.target.lerpVectors(anim.fromTarget, anim.toTarget, ee);
    clampIndoor();
    controls.update();
    if (u >= 1) {
      anim = null;
      controls.enabled = true;
      controls.minDistance = 1.8;
    }
  } else {
    controls.update();
    softAzimuth(dt);
    clampIndoor();
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

} catch (err) {
  showErr((err && (err.message || String(err))) || '未知错误');
}
</script>
