<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VibeSticker · 3D 房间 · 类写实·真实窗光</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1210;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:14px 18px;text-align:center;
    color:#fff8f0;font-size:15px;letter-spacing:.04em;
    background:linear-gradient(180deg,rgba(26,18,16,.72),rgba(26,18,16,0));
    pointer-events:none;user-select:none;
  }
  #phase{
    position:fixed;bottom:16px;left:0;right:0;z-index:10;

  }

    display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;

  }

</style>
</head>
<body>
<div id="hud">拖动环视 · 滚轮缩放 · 点击显示器靠近</div>
<div id="phase">昼夜循环 · 约 75 秒一轮</div>
<div id="err" role="alert"></div>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const CYCLE_MS = 75000;
const phaseEl = document.getElementById('phase');
const errEl = document.getElementById('err');
function showErr(msg) {
  console.error(msg);
  errEl.textContent = '3D 加载失败\n' + msg + '\n\n可刷新重试；若仍黑屏，请换浏览器或更新系统。';
  errEl.classList.add('show');
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: !isMobile, alpha: false,
    powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false,
  });
} catch (e1) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'default' });
}
if (!renderer.getContext()) throw new Error('WebGL 不可用（当前设备/浏览器不支持）');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.35 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x161210, 1);
// 移动端也开软阴影（降分辨率），避免塑料平光
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
let composer = null;
let bloomPass = null;

// —— 房间再 ×2（相对上一版），全程室内 ——
const ROOM_W = 24, ROOM_D = 20, WALL_H = 10;
const WALL_Z = -ROOM_D / 2;
const CAM_MARGIN = 1.4;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161210);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.15, 120);
camera.position.set(0, 5.2, 7.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.target.set(0, 4.5, -6.0);
controls.minDistance = 2.0;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minPolarAngle = 0.32;
// 软限位：可越过「电脑边对齐拐角」一点，松手回弹；硬顶防穿帮
const AZ_SOFT = 0.85;
const AZ_HARD = 1.08;
controls.minAzimuthAngle = -AZ_HARD;
controls.maxAzimuthAngle =  AZ_HARD;
controls.update();

let orbitDragging = false;
controls.addEventListener('start', () => { orbitDragging = true; });
controls.addEventListener('end', () => { orbitDragging = false; });

const _sph = new THREE.Spherical();
const _offset = new THREE.Vector3();
function setAzimuth(theta) {
  _offset.subVectors(camera.position, controls.target);
  _sph.setFromVector3(_offset);
  _sph.theta = theta;
  _sph.makeSafe();
  camera.position.copy(controls.target).add(_offset.setFromSpherical(_sph));
}
function softAzimuth(dt) {
  const az = controls.getAzimuthalAngle();
  if (az > AZ_SOFT) {
    const goal = orbitDragging ? (AZ_SOFT + (az - AZ_SOFT) * 0.42) : AZ_SOFT;
    const lambda = orbitDragging ? 10 : 7.2;
    setAzimuth(THREE.MathUtils.damp(az, goal, lambda, dt));
  } else if (az < -AZ_SOFT) {
    const goal = orbitDragging ? (-AZ_SOFT + (az + AZ_SOFT) * 0.42) : -AZ_SOFT;
    const lambda = orbitDragging ? 10 : 7.2;
    setAzimuth(THREE.MathUtils.damp(az, goal, lambda, dt));
  }
}

function clampIndoor() {
  const hx = ROOM_W / 2 - CAM_MARGIN;
  const hz = ROOM_D / 2 - CAM_MARGIN;
  const p = camera.position;
  p.x = THREE.MathUtils.clamp(p.x, -hx, hx);
  p.y = THREE.MathUtils.clamp(p.y, 2.4, WALL_H - 1.0);
  p.z = THREE.MathUtils.clamp(p.z, -hz + 0.6, hz);
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -ROOM_W / 2 + 2.2, ROOM_W / 2 - 2.2);
  t.y = THREE.MathUtils.clamp(t.y, 1.6, WALL_H - 1.4);
  // 允许注视点落到窗洞附近（窗外景色），但相机本身仍锁室内
  t.z = THREE.MathUtils.clamp(t.z, -ROOM_D / 2 - 4.0, ROOM_D / 2 - 1.8);
  if (p.distanceTo(t) < 1.2) {
    const dir = new THREE.Vector3().subVectors(t, p);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
    else dir.normalize();
    t.copy(p).addScaledVector(dir, 1.4);
  }
}

// —— 灯光：窗外阳光为主 + 室内间接光（无假光柱）——
const ambient = new THREE.AmbientLight(0xc8b8a8, 0.045);
scene.add(ambient);

// 天空半球：冷天光 / 暖地面回弹
const hemi = new THREE.HemisphereLight(0xb8d4f0, 0x3a2a1c, 0.22);
scene.add(hemi);

// 主阳光：从窗外射入（方向光 + 柔和阴影）
const sun = new THREE.DirectionalLight(0xffe2c0, 2.05);
sun.castShadow = true;
const shadowRes = isMobile ? 1024 : 2048;
sun.shadow.mapSize.set(shadowRes, shadowRes);
sun.shadow.camera.near = 4;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.04;
sun.shadow.radius = isMobile ? 6.5 : 10;
sun.shadow.camera.updateProjectionMatrix();
sun.target.position.set(0, 2.8, 1.6);
scene.add(sun);
scene.add(sun.target);

// 窗洞聚光：模拟窗框约束的光束（大 penumbra 更自然）
const windowSpot = new THREE.SpotLight(0xfff0d8, 1.55, 36, Math.PI / 3.6, 0.72, 1.25);
windowSpot.position.set(0, 5.6, WALL_Z + 0.15);
windowSpot.target.position.set(0, 2.2, 2.4);
windowSpot.castShadow = true;
windowSpot.shadow.mapSize.set(isMobile ? 512 : 1024, isMobile ? 512 : 1024);
windowSpot.shadow.bias = -0.00012;
windowSpot.shadow.normalBias = 0.035;
windowSpot.shadow.radius = isMobile ? 5 : 8;
scene.add(windowSpot);
scene.add(windowSpot.target);

// 窗边暖色弹射（照亮窗前地面/桌面）
const windowBounce = new THREE.PointLight(0xffe6c8, 0.85, 22, 1.75);
windowBounce.position.set(0, 4.6, WALL_Z + 2.0);
scene.add(windowBounce);

// 地板冷色弱回弹，减轻死黑角
const floorBounce = new THREE.PointLight(0xd8c8b0, 0.28, 18, 2);
floorBounce.position.set(0, 0.6, 1.5);
scene.add(floorBounce);

// 前墙方向极弱补光（反弹）
const fill = new THREE.DirectionalLight(0x9eb6d8, 0.12);
fill.position.set(0, 6, 10);
scene.add(fill);

// 电影感冷补光（逆光侧）
const rimFill = new THREE.DirectionalLight(0x6a90c8, 0.06);
rimFill.position.set(-8, 5, 4);
scene.add(rimFill);

// 城市夜光回灌（夜晚从窗外渗入的冷暖混合）
const cityGlow = new THREE.PointLight(0xffaa66, 0.0, 28, 1.6);
cityGlow.position.set(0, 4.8, WALL_Z + 1.2);
scene.add(cityGlow);

const lamp = new THREE.PointLight(0xffcc88, 0.18, 16, 2);
lamp.position.set(2.0, 5.2, 0.4);
scene.add(lamp);


// —— 程序贴图（木纹 / 石膏 / 地板）——
function makeProcTex(draw, w = 512, h = 512, repeatX = 1, repeatY = 1, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = isMobile ? 2 : 8;
  tex.needsUpdate = true;
  return tex;
}
function addNoise(ctx, w, h, amt) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amt;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);
}
const woodMap = makeProcTex((ctx, w, h) => {
  ctx.fillStyle = '#8b5a3c';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y++) {
    const v = 0.85 + 0.15 * Math.sin(y * 0.07) + 0.08 * Math.sin(y * 0.31);
    ctx.fillStyle = `rgba(${90 * v|0},${55 * v|0},${30 * v|0},${0.15 + (y % 7) * 0.01})`;
    ctx.fillRect(0, y, w, 1);
  }
  for (let i = 0; i < 40; i++) {
    const y = Math.random() * h;
    ctx.strokeStyle = `rgba(60,30,15,${0.08 + Math.random() * 0.12})`;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x < w; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.04 + i) * 3);
    ctx.stroke();
  }
  addNoise(ctx, w, h, 12);
}, 512, 512, 2, 2);

const woodRough = makeProcTex((ctx, w, h) => {
  ctx.fillStyle = '#a0a0a0';
  ctx.fillRect(0, 0, w, h);
  addNoise(ctx, w, h, 50);
}, 256, 256, 2, 2, false);

const plasterMap = makeProcTex((ctx, w, h) => {
  ctx.fillStyle = '#e8dcc8';
  ctx.fillRect(0, 0, w, h);
  addNoise(ctx, w, h, 28);
  for (let i = 0; i < 2800; i++) {
    ctx.fillStyle = `rgba(${160+Math.random()*40|0},${140+Math.random()*30|0},${120|0},${0.03+Math.random()*0.06})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
}, 512, 512, 2.2, 1.6);

const floorMap = makeProcTex((ctx, w, h) => {
  const plank = 48;
  for (let y = 0; y < h; y += plank) {
    const base = 95 + Math.random() * 25;
    for (let x = 0; x < w; x += 160) {
      const shade = base + (Math.random() - 0.5) * 18;
      ctx.fillStyle = `rgb(${shade|0},${(shade * 0.68)|0},${(shade * 0.42)|0})`;
      ctx.fillRect(x, y, 158, plank - 1);
      // soft seam only
      ctx.fillStyle = 'rgba(40,20,10,0.12)';
      ctx.fillRect(x, y + plank - 2, 158, 1);
      ctx.fillRect(x + 157, y, 1, plank);
    }
    // grain lines
    ctx.strokeStyle = 'rgba(60,30,15,0.08)';
    for (let gy = y + 4; gy < y + plank - 4; gy += 3) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      for (let gx = 0; gx < w; gx += 10) ctx.lineTo(gx, gy + Math.sin(gx * 0.05 + y) * 1.2);
      ctx.stroke();
    }
  }
  addNoise(ctx, w, h, 16);
}, 512, 512, 3, 3);

const mat = {
  floor: new THREE.MeshStandardMaterial({ map: floorMap, color: 0xffffff, roughness: 0.78, metalness: 0.04 }),
  wall:  new THREE.MeshStandardMaterial({ map: plasterMap, color: 0xffffff, roughness: 0.9, metalness: 0.0 }),
  wallBack: new THREE.MeshStandardMaterial({ map: plasterMap, color: 0xf2ebe0, roughness: 0.88, metalness: 0.0 }),
  ceiling: new THREE.MeshStandardMaterial({ map: plasterMap, color: 0xfff8f0, roughness: 0.95, metalness: 0.0 }),
  wood:  new THREE.MeshStandardMaterial({ map: woodMap, roughnessMap: woodRough, color: 0xffffff, roughness: 0.55, metalness: 0.08 }),
  woodDark: new THREE.MeshStandardMaterial({ map: woodMap, color: 0x6a4530, roughness: 0.7, metalness: 0.05 }),
  black: new THREE.MeshPhysicalMaterial({ color: 0x1a1a1c, roughness: 0.35, metalness: 0.55, clearcoat: 0.4, clearcoatRoughness: 0.3 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x0e2438, emissive: 0x1a4060, emissiveIntensity: 0.55, roughness: 0.25, metalness: 0.2 }),
  skin:  new THREE.MeshStandardMaterial({ color: 0xe6b898, roughness: 0.62, metalness: 0.0 }),
  cloth: new THREE.MeshStandardMaterial({ color: 0x3a5678, roughness: 0.85, metalness: 0.0 }),
  hair:  new THREE.MeshStandardMaterial({ color: 0x1e1612, roughness: 0.92 }),
  cup:   new THREE.MeshPhysicalMaterial({ color: 0xf5efe6, roughness: 0.25, metalness: 0.05, clearcoat: 0.5, clearcoatRoughness: 0.2 }),
  trash: new THREE.MeshStandardMaterial({ color: 0x3e3e3c, roughness: 0.55, metalness: 0.25 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xf4efe6, roughness: 0.48, metalness: 0.04 }),
  frameDark: new THREE.MeshStandardMaterial({ color: 0xd4ccc0, roughness: 0.58, metalness: 0.03 }),
  sill:  new THREE.MeshStandardMaterial({ color: 0xeee6da, roughness: 0.5, metalness: 0.03 }),
};

function box(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function rbox(w, h, d, material, x, y, z, r = 0.06, seg = 2) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, Math.min(w, h, d) * 0.45)), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cyl(rTop, rBot, h, material, x, y, z, segs = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, segs), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

const room = new THREE.Group();
scene.add(room);

// 围合六面（开窗洞的后墙除外）
room.add(box(ROOM_W, 0.08, ROOM_D, mat.floor, 0, 0, 0));
room.add(box(ROOM_W, 0.08, ROOM_D, mat.ceiling, 0, WALL_H, 0));
room.add(box(0.1, WALL_H, ROOM_D, mat.wall, -ROOM_W / 2, WALL_H / 2, 0));
room.add(box(0.1, WALL_H, ROOM_D, mat.wall, ROOM_W / 2, WALL_H / 2, 0));
room.add(box(ROOM_W, WALL_H, 0.1, mat.wall, 0, WALL_H / 2, ROOM_D / 2)); // 前墙

// —— 后墙开窗 ——
const winW = 9.0, winH = 5.4, winY = 5.7;
const winBottom = winY - winH / 2;
const winTop = winY + winH / 2;
const wallT = 0.28;
const leftW = (ROOM_W - winW) / 2;
room.add(box(leftW, WALL_H, wallT, mat.wallBack, -ROOM_W / 2 + leftW / 2, WALL_H / 2, WALL_Z));
room.add(box(leftW, WALL_H, wallT, mat.wallBack, ROOM_W / 2 - leftW / 2, WALL_H / 2, WALL_Z));
room.add(box(winW, winBottom, wallT, mat.wallBack, 0, winBottom / 2, WALL_Z));
room.add(box(winW, WALL_H - winTop, wallT, mat.wallBack, 0, winTop + (WALL_H - winTop) / 2, WALL_Z));

// —— 精致窗框（外框 + 内凹止口 + 分格）——
const casingD = 0.42, casingT = 0.22, casingZ = WALL_Z + 0.14;
// 外框
room.add(box(winW + casingT * 2, casingT, casingD, mat.frame, 0, winTop + casingT / 2, casingZ));
room.add(box(winW + casingT * 2, casingT, casingD, mat.frame, 0, winBottom - casingT / 2, casingZ));
room.add(box(casingT, winH + casingT * 2, casingD, mat.frame, -winW / 2 - casingT / 2, winY, casingZ));
room.add(box(casingT, winH + casingT * 2, casingD, mat.frame, winW / 2 + casingT / 2, winY, casingZ));
// 内凹止口（略深、略窄）
const innerT = 0.1, innerD = 0.28, innerZ = WALL_Z + 0.02;
room.add(box(winW - 0.04, innerT, innerD, mat.frameDark, 0, winTop - innerT / 2 - 0.02, innerZ));
room.add(box(winW - 0.04, innerT, innerD, mat.frameDark, 0, winBottom + innerT / 2 + 0.02, innerZ));
room.add(box(innerT, winH - 0.04, innerD, mat.frameDark, -winW / 2 + innerT / 2 + 0.02, winY, innerZ));
room.add(box(innerT, winH - 0.04, innerD, mat.frameDark, winW / 2 - innerT / 2 - 0.02, winY, innerZ));

// 窗台：厚板 + 滴水沿 + 侧耳
const sillDepth = 0.7, sillThick = 0.14, sillOverhang = 0.28;
room.add(box(winW + casingT * 2 + sillOverhang * 2, sillThick, sillDepth, mat.sill,
  0, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));
room.add(box(winW + casingT * 2 + sillOverhang * 2, 0.06, 0.05, mat.frameDark,
  0, winBottom - sillThick - 0.03, WALL_Z + 0.12));
room.add(box(0.08, sillThick + 0.04, sillDepth * 0.92, mat.sill,
  -winW / 2 - casingT - sillOverhang + 0.04, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));
room.add(box(0.08, sillThick + 0.04, sillDepth * 0.92, mat.sill,
  winW / 2 + casingT + sillOverhang - 0.04, winBottom - sillThick / 2 - 0.02, WALL_Z + sillDepth / 2 - 0.04));

// 分格：中梃 + 横档（带前后两层厚度感）
const mullT = 0.12, mullD = 0.3, mullZ = WALL_Z + 0.1;
function addMullion(w, h, d, x, y, z) {
  room.add(box(w, h, d, mat.frame, x, y, z));
  room.add(box(Math.max(0.04, w * 0.55), Math.max(0.04, h * 0.55), d * 0.55, mat.frameDark, x, y, z + 0.04));
}
addMullion(mullT, winH - 0.08, mullD, 0, winY, mullZ);
addMullion(winW - 0.08, mullT, mullD, 0, winY, mullZ);
// 外圈窄压条
const lip = 0.07;
addMullion(winW - 0.06, lip, mullD * 0.85, 0, winTop - lip / 2 - 0.01, mullZ);
addMullion(winW - 0.06, lip, mullD * 0.85, 0, winBottom + lip / 2 + 0.01, mullZ);
addMullion(lip, winH - 0.06, mullD * 0.85, -winW / 2 + lip / 2 + 0.01, winY, mullZ);
addMullion(lip, winH - 0.06, mullD * 0.85, winW / 2 - lip / 2 - 0.01, winY, mullZ);

// 天空纹理（兼作玻璃 envMap，无 transmission）
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 512; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
// 玻璃 env 用克隆，避免改 mapping 搞坏天空 mesh 的 UV 采样
const skyEnv = skyTex.clone();
skyEnv.mapping = THREE.EquirectangularReflectionMapping;
skyEnv.colorSpace = THREE.SRGBColorSpace;
scene.environment = skyEnv;

function drawSky(topHex, midHex, botHex, disc) {
  const g = skyCtx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, topHex);
  g.addColorStop(0.42, midHex);
  g.addColorStop(0.72, botHex);
  g.addColorStop(1, botHex);
  skyCtx.fillStyle = g;
  skyCtx.fillRect(0, 0, 512, 512);

    grd.addColorStop(0.4, disc.color + 'aa');

    skyCtx.fillStyle = grd;
    skyCtx.beginPath();
    skyCtx.arc(disc.x, disc.y, disc.r, 0, Math.PI * 2);
    skyCtx.fill();
  }
  skyTex.needsUpdate = true;

}

function makeCanvasTex(draw, w = 256, h = 256, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = opts.srgb === false ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = isMobile ? 2 : 8;
  tex.needsUpdate = true;
  return tex;
}
function n2(ctx, w, h, a = 14) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * a;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);
}

function makeFacadePair(seed, base) {
  const W = 256, H = 512;
  let rng = seed;
  const rnd = () => { rng = (rng * 16807) % 2147483647; return (rng & 0xffff) / 0xffff; };
  const map = makeCanvasTex((ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, w * 0.2, h);
    g.addColorStop(0, `rgb(${base[0] + 18},${base[1] + 16},${base[2] + 14})`);
    g.addColorStop(1, `rgb(${base[0] - 8},${base[1] - 8},${base[2] - 6})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // 楼层线（细、低对比）
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    for (let y = 10; y < h; y += 22 + (rnd() * 6 | 0)) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    // 窗：不规则、低饱和暗玻璃（非霓虹方块）
    for (let y = 16; y < h - 20; y += 22 + (rnd() * 8 | 0)) {
      let x = 10 + rnd() * 8;
      while (x < w - 14) {
        const ww = 12 + rnd() * 16, hh = 9 + rnd() * 9;
        if (rnd() > 0.1) {
          const gl = 18 + rnd() * 40;
          ctx.fillStyle = `rgb(${gl|0},${gl + 6|0},${gl + 14|0})`;
          ctx.fillRect(x, y, ww, hh);
          ctx.fillStyle = 'rgba(200,220,240,0.12)';
          ctx.fillRect(x + 1, y + 1, ww * 0.35, hh * 0.4);
        }
        x += ww + 6 + rnd() * 10;
      }
    }
    n2(ctx, w, h, 10);
  }, W, H);
  rng = seed + 17;
  const emissiveMap = makeCanvasTex((ctx, w, h) => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    for (let y = 16; y < h - 20; y += 22 + (rnd() * 8 | 0)) {
      let x = 10 + rnd() * 8;
      while (x < w - 14) {
        const ww = 10 + rnd() * 14, hh = 8 + rnd() * 8;
        if (rnd() > 0.55) {
          // 柔和暖窗光，避免霓虹黄格
          const warm = rnd();
          const r = 180 + warm * 60, g = 130 + warm * 40, b = 70 + warm * 30;
          ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
          ctx.globalAlpha = 0.55 + rnd() * 0.4;
          ctx.fillRect(x, y, ww, hh);
          ctx.globalAlpha = 1;
        }
        x += ww + 6 + rnd() * 10;
      }
    }
  }, W, H, { srgb: false });
  return { map, emissiveMap };
}

function makeCar(colorHex, kind = 0) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: colorHex, roughness: 0.22, metalness: 0.78,
    clearcoat: 0.9, clearcoatRoughness: 0.1, envMapIntensity: 1.15,
  });
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.18, 1.02), cityMats.carDark);
  chassis.position.y = 0.26; g.add(chassis);
  const body = new THREE.Mesh(new RoundedBoxGeometry(2.15, 0.4, 1.05, 2, 0.08), bodyMat);
  body.position.y = 0.52; g.add(body);
  const hood = new THREE.Mesh(new RoundedBoxGeometry(0.65, 0.1, 0.98, 1, 0.04), bodyMat);
  hood.position.set(0.7, 0.7, 0); hood.rotation.z = -0.14; g.add(hood);
  const cabinW = kind === 1 ? 1.3 : 1.05;
  const cabin = new THREE.Mesh(new RoundedBoxGeometry(cabinW, 0.45, 0.95, 1, 0.06), cityMats.carGlass);
  cabin.position.set(kind === 1 ? -0.05 : -0.18, 0.95, 0); g.add(cabin);
  const roof = new THREE.Mesh(new RoundedBoxGeometry(cabinW * 0.9, 0.07, 0.9, 1, 0.03), bodyMat);
  roof.position.set(cabin.position.x, 1.2, 0); g.add(roof);
  const wheelGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.16, 14);
  for (const [sx, sz] of [[0.7, 0.5], [0.7, -0.5], [-0.7, 0.5], [-0.7, -0.5]]) {
    const wh = new THREE.Mesh(wheelGeo, cityMats.carDark);
    wh.rotation.z = Math.PI / 2; wh.position.set(sx, 0.2, sz); g.add(wh);
  }
  const headMat = cityMats.head.clone(), tailMat = cityMats.tail.clone();
  for (const sz of [0.3, -0.3]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.2), headMat);
    hl.position.set(1.1, 0.5, sz); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.24), tailMat);
    tl.position.set(-1.1, 0.5, sz); g.add(tl);
  }
  g.userData.head = headMat; g.userData.tail = tailMat;
  outside.add(g);
  return g;
}

  for (let i = 0; i < 5; i++) {
    const car = makeCar(CAR_COLORS[ci % CAR_COLORS.length], ci % 3 === 0 ? 1 : 0);
    ci++;
    car.userData.lane = lane;
    car.userData.phase = i / 5 + li * 0.11;
    car.rotation.y = lane.dir > 0 ? 0 : Math.PI;
    cars.push(car);
  }
});
const CAR_SPAN = 24;
function tickCity(dt, sunK) {
  const t = performance.now() * 0.001;
  for (const car of cars) {
    const lane = car.userData.lane;
    const u = (car.userData.phase + t * (lane.speed / (CAR_SPAN * 2))) % 1;
    car.position.set((u * 2 - 1) * CAR_SPAN * lane.dir, lane.y, lane.z);
    const night = 1 - sunK;
    car.userData.head.emissiveIntensity = 0.35 + night * 2.0;
    car.userData.tail.emissiveIntensity = 0.25 + night * 1.4;
  }
  if (hazeMat) hazeMat.opacity = 0.1 + sunK * 0.14;
}

    disc: { x: 256, y: 85, r: 50, color: '#fffce8' },
    exposure: 1.22, wallTint: 0xdcccb8,
  },
  {
    t: 0.52, name: '黄金时刻',
    amb: [0xffc090, 0.038],
    sunCol: 0xff9a48, sunInt: 2.35,
    sunPos: [9.8, 7.2, WALL_Z - 15],
    spotCol: 0xffb060, spotInt: 2.0,
    fillInt: 0.07, hemiInt: 0.22, rimInt: 0.12,
    lampInt: 0.15, cityGlow: 0.2, bloom: 0.32,
    sky: ['#3a2858', '#e86838', '#f09858'],
    disc: { x: 370, y: 270, r: 62, color: '#ff8530' },
    exposure: 1.12, wallTint: 0xd8b090,
  },
  {
    t: 0.62, name: '暮蓝',
    amb: [0x6070a0, 0.032],
    sunCol: 0x7090c8, sunInt: 0.45,
    sunPos: [10.5, 4.0, WALL_Z - 14],
    spotCol: 0x8098d0, spotInt: 0.35,
    fillInt: 0.08, hemiInt: 0.2, rimInt: 0.14,
    lampInt: 0.55, cityGlow: 0.85, bloom: 0.4,
    sky: ['#121830', '#2a3868', '#4860a0'],
    disc: { x: 390, y: 300, r: 28, color: '#d0a090' },
    exposure: 0.95, wallTint: 0xa09088,
  },
  {
    t: 0.78, name: '夜晚',
    amb: [0x1c2838, 0.025],
    sunCol: 0x405878, sunInt: 0.04,
    sunPos: [-3.0, 14.0, WALL_Z - 14],
    spotCol: 0x506888, spotInt: 0.04,
    fillInt: 0.05, hemiInt: 0.12, rimInt: 0.06,
    lampInt: 1.25, cityGlow: 1.35, bloom: 0.5,
    sky: ['#060a14', '#101828', '#1c2840'],
    disc: { x: 340, y: 90, r: 18, color: '#c8d0e0' },
    exposure: 0.9, wallTint: 0x7a7068,
  },
  {
    t: 1.0, name: '黎明',
    amb: [0xff9a78, 0.028],
    sunCol: 0xff8a5a, sunInt: 1.35,
    sunPos: [-11, 5.5, WALL_Z - 16],
    spotCol: 0xffa878, spotInt: 1.15,
    fillInt: 0.06, hemiInt: 0.16, rimInt: 0.04,
    lampInt: 0.18, cityGlow: 0.12, bloom: 0.28,
    sky: ['#4a3568', '#e89070', '#f0b898'],
    disc: { x: 150, y: 310, r: 58, color: '#ffb080' },
    exposure: 0.98, wallTint: 0xd2b8a4,
  },
];

const _cA = new THREE.Color(), _cB = new THREE.Color(), _cOut = new THREE.Color();
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3();

function lerpKeys(t) {
  let i = 0;
  while (i < KEYS.length - 1 && KEYS[i + 1].t < t) i++;
  const a = KEYS[i], b = KEYS[Math.min(i + 1, KEYS.length - 1)];
  const span = b.t - a.t || 1;
  const u = Math.min(1, Math.max(0, (t - a.t) / span));
  const e = u * u * (3 - 2 * u);
  return { a, b, e, name: e < 0.5 ? a.name : b.name };
}

function mixColor(out, ca, cb, e) {
  _cA.set(ca); _cB.set(cb);
  out.copy(_cA).lerp(_cB, e);
  return out;
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixHex(ha, hb, e) {
  const a = hexToRgb(ha), b = hexToRgb(hb);
  const r = Math.round(a[0] + (b[0] - a[0]) * e);
  const g = Math.round(a[1] + (b[1] - a[1]) * e);
  const bl = Math.round(a[2] + (b[2] - a[2]) * e);
  return `#${((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1)}`;
}

const SUN_PEAK = Math.max(...KEYS.map((k) => k.sunInt)) || 1;
function applyDayCycle(t) {
  const { a, b, e, name } = lerpKeys(t);

  ambient.color.set(a.amb[0]).lerp(_cA.set(b.amb[0]), e);
  ambient.intensity = a.amb[1] + (b.amb[1] - a.amb[1]) * e;

  sun.color.set(a.sunCol).lerp(_cA.set(b.sunCol), e);
  sun.intensity = a.sunInt + (b.sunInt - a.sunInt) * e;
  _vA.set(...a.sunPos); _vB.set(...b.sunPos);
  sun.position.copy(_vA).lerp(_vB, e);
  sun.target.position.set(0, 2.8, 1.6);
  sun.target.updateMatrixWorld();

  windowSpot.color.set(a.spotCol).lerp(_cA.set(b.spotCol), e);
  windowSpot.intensity = a.spotInt + (b.spotInt - a.spotInt) * e;
  // 窗光跟随太阳方位，轻微偏斜
  windowSpot.position.x = sun.position.x * 0.12;
  windowSpot.target.position.set(-sun.position.x * 0.05, 2.2, 2.4);
  windowSpot.target.updateMatrixWorld();

  windowBounce.color.copy(windowSpot.color);
  windowBounce.intensity = (a.spotInt + (b.spotInt - a.spotInt) * e) * 0.48;
  floorBounce.color.copy(windowSpot.color).multiplyScalar(0.75);
  floorBounce.intensity = 0.12 + (a.spotInt + (b.spotInt - a.spotInt) * e) * 0.08;

  fill.intensity = a.fillInt + (b.fillInt - a.fillInt) * e;
  hemi.intensity = a.hemiInt + (b.hemiInt - a.hemiInt) * e;
  lamp.intensity = a.lampInt + (b.lampInt - a.lampInt) * e;
  rimFill.intensity = (a.rimInt ?? 0.05) + ((b.rimInt ?? 0.05) - (a.rimInt ?? 0.05)) * e;
  cityGlow.intensity = (a.cityGlow ?? 0) + ((b.cityGlow ?? 0) - (a.cityGlow ?? 0)) * e;
  cityGlow.color.set(a.spotCol).lerp(_cA.set(b.spotCol), e).lerp(_cB.set(0xff9955), 0.35);

  const skyTop = mixHex(a.sky[0], b.sky[0], e);
  const skyMid = mixHex(a.sky[1], b.sky[1], e);
  const skyBot = mixHex(a.sky[2], b.sky[2], e);
  const disc = {
    x: a.disc.x + (b.disc.x - a.disc.x) * e,
    y: a.disc.y + (b.disc.y - a.disc.y) * e,
    r: a.disc.r + (b.disc.r - a.disc.r) * e,
    color: mixHex(a.disc.color, b.disc.color, e),
  };
  drawSky(skyTop, skyMid, skyBot, disc);
  hemi.color.set(skyMid);
  hemi.groundColor.set(a.wallTint).lerp(_cA.set(b.wallTint), e).multiplyScalar(0.35);

  scene.background.set(0x161210);
  renderer.toneMappingExposure = a.exposure + (b.exposure - a.exposure) * e;

  // 真实窗光：靠平行光/聚光阴影投射到地板桌面；无假光柱几何体
  const sunK = Math.min(1, Math.max(0, sun.intensity / SUN_PEAK));
  cityMats.sky.color.set(skyMid);
  hazeMat.color.set(skyMid);
  // 照片底板随昼夜：白天提亮偏冷，黄金/夜晚偏暖保留窗光
  const photoK = 0.55 + sunK * 0.55;
  cityPhotoMat.color.setRGB(
    photoK * (0.75 + 0.25 * sunK),
    photoK * (0.78 + 0.18 * sunK),
    photoK * (0.95 - 0.15 * (1 - sunK))
  );
  const nightK = Math.pow(1 - sunK, 1.4);
  // 窗灯光：柔和暖色，避免霓虹格
  for (const fm of facadeMats) fm.emissiveIntensity = nightK * 0.55;
  for (const lm of lampMats) lm.emissiveIntensity = 0.1 + nightK * 1.8;
  for (const pl of streetLamps) pl.intensity = nightK * 1.4;
  const spotNow = a.spotInt + (b.spotInt - a.spotInt) * e;
  // 阳光进屋时室内明显变亮（暖回弹）
  windowBounce.intensity = spotNow * (0.7 + 0.45 * sunK);
  windowBounce.position.x = sun.position.x * 0.06;
  floorBounce.intensity = 0.18 + spotNow * (0.16 + 0.14 * sunK);
  floorBounce.color.copy(windowSpot.color).lerp(_cA.set(0xd8e4f0), 0.25);
  glassMat.envMapIntensity = 1.2;
  glassTint.envMapIntensity = 0.6;
  const bloomT = (a.bloom ?? 0.22) + ((b.bloom ?? 0.22) - (a.bloom ?? 0.22)) * e;
  if (bloomPass) bloomPass.strength = isMobile ? bloomT * 0.4 : bloomT * 0.75;

  mixColor(_cOut, a.wallTint, b.wallTint, e);
  // 保留贴图细节：用浅色相乘，避免压成纯色塑料墙
  mat.wall.color.copy(_cOut).lerp(_cA.set(0xffffff), 0.35);
  mat.wallBack.color.copy(_cOut).lerp(_cA.set(0xffffff), 0.3).multiplyScalar(0.96);
  mat.ceiling.color.copy(_cOut).lerp(_cA.set(0xfff8f0), 0.55);

  phaseEl.textContent = `昼夜循环 · ${name} · 约 75 秒一轮`;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let anim = null;

function startDock() {
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const toPos = new THREE.Vector3(0, 4.8, 3.4);
  const toTarget = new THREE.Vector3(0, 4.6, -2.8);
  anim = { t0: performance.now(), dur: 900, fromPos, toPos, fromTarget, toTarget };
  controls.enabled = false;
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

canvas.addEventListener('pointerdown', (e) => {
  if (anim) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([monitor], true);
  if (hits.length) {
    const startX = e.clientX, startY = e.clientY;
    const up = (ev) => {
      canvas.removeEventListener('pointerup', up);
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) startDock();
    };
    canvas.addEventListener('pointerup', up);
  }
});

addEventListener('resize', fit);
if (visualViewport) visualViewport.addEventListener('resize', fit);

const START_T = 0.2;
const t0 = performance.now() - START_T * CYCLE_MS;
let lastNow = performance.now();

try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    isMobile ? 0.12 : 0.22,
    isMobile ? 0.4 : 0.55,
    0.88
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  composer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.15 : 1.75));
} catch (eBloom) {
  console.warn('bloom disabled', eBloom);
  composer = null;
  bloomPass = null;
}

function fit() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  if (composer) {
    composer.setSize(w, h);
    if (bloomPass) bloomPass.resolution.set(w, h);
  }
}
fit();
clampIndoor();
applyDayCycle(START_T);
if (composer) composer.render();
else renderer.render(scene, camera);

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  const cycleT = ((now - t0) % CYCLE_MS) / CYCLE_MS;
  applyDayCycle(cycleT);
  const sunKTick = Math.min(1, Math.max(0, sun.intensity / SUN_PEAK));
  tickCity(dt, sunKTick);

  if (anim) {
    const u = Math.min(1, (now - anim.t0) / anim.dur);
    const ee = easeInOut(u);
    camera.position.lerpVectors(anim.fromPos, anim.toPos, ee);
    controls.target.lerpVectors(anim.fromTarget, anim.toTarget, ee);
    clampIndoor();
    controls.update();
    if (u >= 1) {
      anim = null;
      controls.enabled = true;
      controls.minDistance = 1.8;
    }
  } else {
    controls.update();
    softAzimuth(dt);
    clampIndoor();
  }
  if (composer) composer.render();
  else renderer.render(scene, camera);
}
requestAnimationFrame(tick);

} catch (err) {
  showErr((err && (err.message || String(err))) || '未知错误');
}
</script>
