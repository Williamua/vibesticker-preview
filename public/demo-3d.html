<canvas id="c"></canvas>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const CYCLE_MS = 150000;
const phaseEl = document.getElementById('phase');
const errEl = document.getElementById('err');
function showErr(msg) {
  console.error(msg);
  errEl.textContent = '3D 加载失败\n' + msg + '\n\n可刷新重试；若仍黑屏，请换浏览器或更新系统。';
  errEl.classList.add('show');
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: !isMobile, alpha: false,
    powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false,
  });
} catch (e1) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'default' });
}
if (!renderer.getContext()) throw new Error('WebGL 不可用（当前设备/浏览器不支持）');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x12101a, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const ROOM_W = 22, ROOM_D = 18, WALL_H = 9.5;
const WALL_Z = -ROOM_D / 2;
const CAM_MARGIN = 1.4;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12101a);
scene.fog = new THREE.FogExp2(0x1a1520, 0.011);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.15, 140);
camera.position.set(1.2, 5.0, 6.8);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.target.set(0, 4.2, -5.2);
controls.minDistance = 2.0;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minPolarAngle = 0.35;
const AZ_SOFT = 0.85, AZ_HARD = 1.08;
controls.minAzimuthAngle = -AZ_HARD;
controls.maxAzimuthAngle = AZ_HARD;
controls.update();

let orbitDragging = false;
controls.addEventListener('start', () => { orbitDragging = true; });
controls.addEventListener('end', () => { orbitDragging = false; });

const _sph = new THREE.Spherical();
const _offset = new THREE.Vector3();
function setAzimuth(theta) {
  _offset.subVectors(camera.position, controls.target);
  _sph.setFromVector3(_offset);
  _sph.theta = theta;
  _sph.makeSafe();
  camera.position.copy(controls.target).add(_offset.setFromSpherical(_sph));
}
function softAzimuth(dt) {
  const az = controls.getAzimuthalAngle();
  if (az > AZ_SOFT) {
    const goal = orbitDragging ? (AZ_SOFT + (az - AZ_SOFT) * 0.42) : AZ_SOFT;
    setAzimuth(THREE.MathUtils.damp(az, goal, orbitDragging ? 10 : 7.2, dt));
  } else if (az < -AZ_SOFT) {
    const goal = orbitDragging ? (-AZ_SOFT + (az + AZ_SOFT) * 0.42) : -AZ_SOFT;
    setAzimuth(THREE.MathUtils.damp(az, goal, orbitDragging ? 10 : 7.2, dt));
  }
}
function clampIndoor() {
  const hx = ROOM_W / 2 - CAM_MARGIN, hz = ROOM_D / 2 - CAM_MARGIN;
  const p = camera.position;
  p.x = THREE.MathUtils.clamp(p.x, -hx, hx);
  p.y = THREE.MathUtils.clamp(p.y, 2.2, WALL_H - 1.0);
  p.z = THREE.MathUtils.clamp(p.z, -hz + 0.6, hz);
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -ROOM_W / 2 + 2.2, ROOM_W / 2 - 2.2);
  t.y = THREE.MathUtils.clamp(t.y, 1.6, WALL_H - 1.4);
  t.z = THREE.MathUtils.clamp(t.z, -ROOM_D / 2 - 4.0, ROOM_D / 2 - 1.8);
  if (p.distanceTo(t) < 1.2) {
    const dir = new THREE.Vector3().subVectors(t, p);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1); else dir.normalize();
    t.copy(p).addScaledVector(dir, 1.4);
  }
}

// —— Cel gradient + helpers ——
function makeGradientMap() {
  const data = new Uint8Array([48, 130, 255]);
  const tex = new THREE.DataTexture(data, 3, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const toonGrad = makeGradientMap();
function toon(color, opts = {}) {
  return new THREE.MeshToonMaterial({
    color, gradientMap: toonGrad,
    emissive: opts.emissive || 0x000000,
    emissiveIntensity: opts.emissiveIntensity || 0,
  });
}
const PAL = {
  peach: 0xe8c4a8, cream: 0xf5ede4, teal: 0x3aa6a1, magenta: 0xe85a8c,
  ink: 0x1a1520, wood: 0x8b5a3c, woodDark: 0x5a3a28, navy: 0x1e2a44,
  hoodie: 0x1a2238, screen: 0x2a1848,
};
let outlineCount = 0;
function addOutline(mesh, scale = 1.034) {
  if (isMobile && outlineCount > 55) return;
  const om = new THREE.MeshBasicMaterial({ color: 0x0d0a12, side: THREE.BackSide });
  const o = new THREE.Mesh(mesh.geometry, om);
  o.scale.setScalar(scale);
  o.castShadow = false; o.receiveShadow = false;
  mesh.add(o);
  outlineCount++;
}
function M(geo, mat, x, y, z, ol = true, os = 1.034) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (ol) addOutline(m, os);
  return m;
}

scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x7ec8e3, 0x3a2a28, 0.32);

const casingT = 0.2, casingD = 0.38, casingZ = WALL_Z + 0.12;

[[0, 0.28, -0.05], [-0.28, 0.18, 0.05], [0.28, 0.18, 0.05], [-0.18, 0.12, 0.22], [0.18, 0.12, 0.22], [0, 0.2, 0.28]].forEach(([x, y, z]) => {

  [8.8, 4.0, 4.0, 24, STREET_Z - 10, 1],

  [14, 4.8, 4.5, 38, STREET_Z - 19, 1],
  [-9.2, 2.6, 2.5, 11, WALL_Z - 2.6, 2],
  [9.2, 2.6, 2.5, 12, WALL_Z - 2.5, 3],
];
buildingDefs.forEach(([bx, bw, bd, bh, bz, fi]) => {
  const body = M(new THREE.BoxGeometry(bw, bh, bd), matBldg[fi % matBldg.length], bx, STREET_Y + bh / 2, bz, true, 1.02);
  outside.add(body);
  outside.add(M(new THREE.BoxGeometry(bw * 1.04, 0.35, bd * 1.04), matRoof, bx, STREET_Y + bh + 0.1, bz, true, 1.02));
  const cols = Math.max(2, Math.floor(bw / 0.85));
  const rows = Math.max(3, Math.floor(bh / 1.35));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.2) continue;
      const wx = bx - bw / 2 + 0.45 + c * ((bw - 0.7) / Math.max(1, cols - 1));
      const wy = STREET_Y + 1.1 + r * ((bh - 2.0) / Math.max(1, rows - 1));
      const wz = bz + bd / 2 + 0.05;
      const lit = Math.random() > 0.45;
      const wm = lit ? matWinLit.clone() : toon(0x2a3048);
      if (lit) cityWinMats.push(wm);
      outside.add(M(new THREE.BoxGeometry(0.38, 0.48, 0.06), wm, wx, wy, wz, false));
    }
  }
});

// Street lamps
const streetLamps = [];
for (let i = -3; i <= 3; i++) {
  if (i === 0) continue;
  for (const side of [1, -1]) {
    const px = i * 7.2, pz = STREET_Z + side * 3.4;
    outside.add(M(new THREE.CylinderGeometry(0.07, 0.1, 4.0, 8), matInk, px, STREET_Y + 2.0, pz, true, 1.06));
    const lampMat = toon(0xffe0a0, { emissive: 0xffc878, emissiveIntensity: 0 });
    outside.add(M(new THREE.SphereGeometry(0.18, 8, 6), lampMat, px + side * -0.7, STREET_Y + 3.9, pz, false));
    if (!isMobile || streetLamps.length < 4) {
      const pl = new THREE.PointLight(0xffc878, 0, 9, 2);
      pl.position.set(px + side * -0.7, STREET_Y + 3.85, pz);
      outside.add(pl);
      streetLamps.push({ light: pl, mat: lampMat });
    }
  }
}

function makeCar(hex) {
  const g = new THREE.Group();
  const bodyMat = toon(hex);
  const body = M(new THREE.BoxGeometry(2.1, 0.45, 1.0), bodyMat, 0, 0.48, 0, true, 1.04);
  g.add(body);
  g.add(M(new THREE.BoxGeometry(1.0, 0.42, 0.92), toon(0x1a2030), -0.15, 0.9, 0, true, 1.05));
  const headMat = toon(0xfff0c0, { emissive: 0xffe080, emissiveIntensity: 0.4 });
  const tailMat = toon(0xff3030, { emissive: 0xff1010, emissiveIntensity: 0.35 });
  g.add(M(new THREE.BoxGeometry(0.08, 0.14, 0.7), headMat, 1.05, 0.48, 0, false));
  g.add(M(new THREE.BoxGeometry(0.08, 0.12, 0.7), tailMat, -1.05, 0.48, 0, false));
  for (const [sx, sz] of [[0.65, 0.48], [0.65, -0.48], [-0.65, 0.48], [-0.65, -0.48]]) {
    g.add(M(new THREE.CylinderGeometry(0.2, 0.2, 0.16, 10), matInk, sx, 0.2, sz, true, 1.1));
    g.children[g.children.length - 1].rotation.z = Math.PI / 2;
  }
  g.userData.head = headMat;
  g.userData.tail = tailMat;
  outside.add(g);
  return g;
}
const CAR_COLORS = [0xe8c84a, 0x7b4aa8, 0x3aa6a1, 0xe85a8c, 0xf5ede4, 0x4a90d9];
const cars = [];
const lanes = [
  { z: STREET_Z + 1.5, dir: 1, y: STREET_Y, speed: 5.2 },
  { z: STREET_Z - 1.4, dir: -1, y: STREET_Y, speed: 6.0 },
];
let ci = 0;
lanes.forEach((lane, li) => {
  for (let i = 0; i < 4; i++) {
    const car = makeCar(CAR_COLORS[ci++ % CAR_COLORS.length]);
    car.userData.lane = lane;
    car.userData.phase = i / 4 + li * 0.12;
    car.rotation.y = lane.dir > 0 ? 0 : Math.PI;
    cars.push(car);
  }
});
const CAR_SPAN = 24;
function tickCity(sunK) {
  const t = performance.now() * 0.001;
  for (const car of cars) {
    const lane = car.userData.lane;
    const u = (car.userData.phase + t * (lane.speed / (CAR_SPAN * 2))) % 1;
    car.position.set((u * 2 - 1) * CAR_SPAN * lane.dir, lane.y, lane.z);
    const night = 1 - sunK;
    car.userData.head.emissiveIntensity = 0.25 + night * 1.8;
    car.userData.tail.emissiveIntensity = 0.2 + night * 1.4;
  }
  // character idle breath
  character.position.y = 1.55 + Math.sin(t * 1.6) * 0.012;
  armL.rotation.x = 1.05 + Math.sin(t * 8) * 0.04;
  armR.rotation.x = 1.05 + Math.sin(t * 8 + 1) * 0.04;
}

// —— Day cycle (Spider-Verse script) ——
const KEYS = [
  { t: 0, name: '黎明', amb: [0xffb08a, 0.18], sunCol: 0xffb08a, sunInt: 1.1,
    sunPos: [-12, 5.5, WALL_Z - 14], spotCol: 0xffb08a, spotInt: 0.9,
    fillInt: 0.08, hemiInt: 0.22, lampInt: 0.1, screenInt: 0.15, bloom: 0.2,
    sky: 0xc8a0d0, fog: 0x2a2038, exposure: 1.0, wall: PAL.cream },
  { t: 0.18, name: '正午', amb: [0xfff2dd, 0.28], sunCol: 0xfff2dd, sunInt: 2.1,
    sunPos: [1, 16, WALL_Z - 12], spotCol: 0xfff0d8, spotInt: 1.7,
    fillInt: 0.14, hemiInt: 0.4, lampInt: 0, screenInt: 0.05, bloom: 0.12,
    sky: 0x7ec8e3, fog: 0x6a90a8, exposure: 1.12, wall: PAL.cream },
  { t: 0.48, name: '黄昏', amb: [0xff8a4c, 0.22], sunCol: 0xff8a4c, sunInt: 2.35,
    sunPos: [11, 6.5, WALL_Z - 14], spotCol: 0xff9a5c, spotInt: 2.0,
    fillInt: 0.1, hemiInt: 0.28, lampInt: 0.2, screenInt: 0.2, bloom: 0.28,
    sky: 0xe89bb5, fog: 0x6b4c7a, exposure: 1.08, wall: 0xf0d8c4 },
  { t: 0.72, name: '夜晚', amb: [0x8ba3c7, 0.12], sunCol: 0x8ba3c7, sunInt: 0.05,
    sunPos: [-4, 14, WALL_Z - 12], spotCol: 0x607898, spotInt: 0.08,
    fillInt: 0.06, hemiInt: 0.14, lampInt: 0.85, screenInt: 0.7, bloom: 0.35,
    sky: 0x12182a, fog: 0x0c101c, exposure: 0.92, wall: 0xc8b8b0 },
  { t: 1.0, name: '黎明', amb: [0xffb08a, 0.18], sunCol: 0xffb08a, sunInt: 1.1,
    sunPos: [-12, 5.5, WALL_Z - 14], spotCol: 0xffb08a, spotInt: 0.9,
    fillInt: 0.08, hemiInt: 0.22, lampInt: 0.1, screenInt: 0.15, bloom: 0.2,
    sky: 0xc8a0d0, fog: 0x2a2038, exposure: 1.0, wall: PAL.cream },
];

const _cA = new THREE.Color(), _cB = new THREE.Color(), _cOut = new THREE.Color();
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3();
function lerpKeys(t) {
  let i = 0;
  while (i < KEYS.length - 1 && KEYS[i + 1].t < t) i++;
  const a = KEYS[i], b = KEYS[Math.min(i + 1, KEYS.length - 1)];
  const span = b.t - a.t || 1;
  const u = Math.min(1, Math.max(0, (t - a.t) / span));
  const e = u * u * (3 - 2 * u);
  return { a, b, e, name: e < 0.5 ? a.name : b.name };
}
const SUN_PEAK = Math.max(...KEYS.map((k) => k.sunInt)) || 1;

function applyDayCycle(t) {
  const { a, b, e, name } = lerpKeys(t);
  ambient.color.set(a.amb[0]).lerp(_cA.set(b.amb[0]), e);
  ambient.intensity = a.amb[1] + (b.amb[1] - a.amb[1]) * e;
  sun.color.set(a.sunCol).lerp(_cA.set(b.sunCol), e);
  sun.intensity = a.sunInt + (b.sunInt - a.sunInt) * e;
  _vA.set(...a.sunPos); _vB.set(...b.sunPos);
  sun.position.copy(_vA).lerp(_vB, e);
  sun.target.updateMatrixWorld();
  windowSpot.color.set(a.spotCol).lerp(_cA.set(b.spotCol), e);
  windowSpot.intensity = a.spotInt + (b.spotInt - a.spotInt) * e;
  windowSpot.position.x = sun.position.x * 0.1;
  bounce.color.copy(windowSpot.color);
  bounce.intensity = windowSpot.intensity * 0.4;
  fill.intensity = a.fillInt + (b.fillInt - a.fillInt) * e;
  hemi.intensity = a.hemiInt + (b.hemiInt - a.hemiInt) * e;
  deskLamp.intensity = a.lampInt + (b.lampInt - a.lampInt) * e;
  screenLight.intensity = a.screenInt + (b.screenInt - a.screenInt) * e;
  screenMat.emissiveIntensity = 0.35 + screenLight.intensity * 0.5;

  const skyC = _cOut.set(a.sky).lerp(_cA.set(b.sky), e);
  skyMat.color.copy(skyC);
  scene.fog.color.set(a.fog).lerp(_cA.set(b.fog), e);
  scene.background.copy(scene.fog.color).multiplyScalar(0.85);
  hemi.color.copy(skyC);

  const sunK = Math.min(1, Math.max(0, sun.intensity / SUN_PEAK));
  const nightK = Math.pow(1 - sunK, 1.35);
  cityWinMats.forEach((wm, i) => { wm.emissiveIntensity = nightK * (0.55 + 0.7 * Math.abs(Math.sin(performance.now() * 0.0007 + i * 0.37))); });
  for (const sl of streetLamps) {
    sl.mat.emissiveIntensity = nightK * 1.6;
    sl.light.intensity = nightK * 1.5;
  }
  matWall.color.set(a.wall).lerp(_cA.set(b.wall), e);

  if (svPass) {
    svPass.uniforms.uHalftone.value = 0.22 + nightK * 0.12 + (1 - sunK) * 0.05;
    svPass.uniforms.uCA.value = isMobile ? 0.0009 : 0.0016;
    svPass.uniforms.uBoil.value = 0.35 + Math.sin(performance.now() * 0.008) * 0.15;
  }
  phaseEl.textContent = `昼夜循环 · ${name} · 约 150 秒一轮 · Spider-Verse`;
  return sunK;
}

// —— Post: Ben-Day halftone + chromatic aberration ——
const SVShader = {
  uniforms: {
    tDiffuse: { value: null },
    uHalftone: { value: 0.28 },
    uCA: { value: 0.0014 },
    uBoil: { value: 0.4 },
    uRes: { value: new THREE.Vector2(1, 1) },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uHalftone, uCA, uBoil;
    uniform vec2 uRes;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      float boil = (hash(floor(uv*uRes*0.15)+uBoil)-0.5)*0.0012*uBoil;
      vec2 dir = vec2(uCA + boil, -uCA * 0.65);
      float r = texture2D(tDiffuse, uv + dir).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, uv - dir).b;
      vec3 col = vec3(r,g,b);
      float lum = dot(col, vec3(0.299,0.587,0.114));
      // Ben-Day in darker regions
      float ang = 0.785398; // 45deg
      vec2 p = uv * uRes;
      vec2 pr = mat2(cos(ang),-sin(ang),sin(ang),cos(ang)) * p;
      float cell = 7.5;
      vec2 grid = fract(pr / cell) - 0.5;
      float d = length(grid);
      float shadow = smoothstep(0.55, 0.18, lum);
      float dotR = mix(0.42, 0.12, lum);
      float dots = smoothstep(dotR, dotR - 0.08, d) * shadow * uHalftone;
      col = mix(col, col * 0.72, dots);
      // slight ink crush
      col = pow(col, vec3(1.02));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};

let composer = null, svPass = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  svPass = new ShaderPass(SVShader);
  composer.addPass(svPass);
  composer.addPass(new OutputPass());
  composer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.1 : 1.5));
} catch (e) {
  console.warn('post disabled', e);
  composer = null; svPass = null;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let anim = null;
function startDock() {
  anim = {
    t0: performance.now(), dur: 900,
    fromPos: camera.position.clone(), toPos: new THREE.Vector3(0, 4.6, 3.2),
    fromTarget: controls.target.clone(), toTarget: new THREE.Vector3(0, 4.4, -2.5),
  };
  controls.enabled = false;
}
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

canvas.addEventListener('pointerdown', (e) => {
  if (anim) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([monitor], true);
  if (hits.length) {
    const sx = e.clientX, sy = e.clientY;
    const up = (ev) => {
      canvas.removeEventListener('pointerup', up);
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) startDock();
    };
    canvas.addEventListener('pointerup', up);
  }
});

addEventListener('resize', fit);
if (visualViewport) visualViewport.addEventListener('resize', fit);

const START_T = 0.42; // dusk hero look
const t0 = performance.now() - START_T * CYCLE_MS;
let lastNow = performance.now();
function fit() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  if (svPass) svPass.uniforms.uRes.value.set(w, h);
}
fit();
clampIndoor();
applyDayCycle(START_T);
if (composer) composer.render(); else renderer.render(scene, camera);

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  const cycleT = ((now - t0) % CYCLE_MS) / CYCLE_MS;
  const sunK = applyDayCycle(cycleT);
  tickCity(sunK);

  // subtle line boil via outline scale jitter (cheap)
  if (!isMobile && (now | 0) % 3 === 0) {
    const boil = 1.032 + Math.sin(now * 0.01) * 0.003;
    // skip heavy traverse every frame — only occasional
  }

  if (anim) {
    const u = Math.min(1, (now - anim.t0) / anim.dur);
    const ee = easeInOut(u);
    camera.position.lerpVectors(anim.fromPos, anim.toPos, ee);
    controls.target.lerpVectors(anim.fromTarget, anim.toTarget, ee);
    clampIndoor();
    controls.update();
    if (u >= 1) { anim = null; controls.enabled = true; controls.minDistance = 1.8; }
  } else {
    controls.update();
    softAzimuth(dt);
    clampIndoor();
  }
  if (composer) composer.render();
  else renderer.render(scene, camera);
}
requestAnimationFrame(tick);

} catch (err) {
  showErr((err && (err.message || String(err))) || '未知错误');
}
</script>
