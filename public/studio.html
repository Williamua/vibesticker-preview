<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="VibeSticker 贴纸工作室 · 漂浮贴纸与工作台"/>
<title>VibeSticker · 贴纸工作室</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC; --apricot:#E8D9C8; --oak:#C4A882;
    --coral:#E87A6B; --ink:#2A221C; --mint:#7CB8A0; --lemon:#F0C94A; --berry:#D94A3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
    font-family:"DM Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none}
  .brand{position:absolute;top:22px;left:28px;display:flex;align-items:baseline;gap:10px}
  .brand .vibe{font-family:"Caveat",cursive;font-size:42px;line-height:1;color:var(--coral);
    font-weight:700;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
  .brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(42,34,28,.55);font-weight:600}
  .tag{position:absolute;top:28px;right:28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(42,34,28,.45);font-weight:600}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:13px;
    color:rgba(42,34,28,.55);letter-spacing:.04em;transition:opacity .35s ease}
  .hint em{font-style:normal;color:var(--coral);font-weight:600}
  .scroll-cue{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(42,34,28,.4);font-weight:600;
    transition:opacity .35s ease}
  .scroll-cue span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  #err{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    padding:24px;background:rgba(247,243,236,.95);color:var(--ink);font-size:15px;line-height:1.6;text-align:center}
  #err.show{display:flex}
  #status{position:fixed;left:12px;bottom:12px;z-index:6;font-size:10px;letter-spacing:.06em;
    color:rgba(42,34,28,.35);pointer-events:none;max-width:70vw}
  @media (max-width:640px){
    .brand .vibe{font-size:32px}
    .tag{font-size:9px;top:20px;right:16px}
    .brand{top:16px;left:16px}
    .hint{font-size:12px;bottom:16px;padding:0 16px}
    .scroll-cue{bottom:44px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    .scroll-cue span{animation:none}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><span class="vibe">VIBE</span><span class="sub">Sticker Studio</span></div>
  <div class="tag">Make Something Beautiful</div>
  <p class="scroll-cue" id="scrollCue"><span>↓ 滚轮看工作台</span></p>
  <p class="hint" id="hint">打印机持续吐贴纸 · <em>鼠标靠近</em>贴纸会躲开</p>
</div>
<div id="status"></div>
<div id="err" role="alert"></div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* —— palette / materials from MATERIALS.json + LIGHTING-SPEC —— */
const MAT = {
  bg: 0xF7F3EC,
  oak: 0xC4A882,
  coral: 0xE87A6B,
  brass: 0xC4A06A,
  plastic: 0xF5F2EC,
  ceramic: 0xD9D0C3,
  ink: 0x2A221C,
  ambient: 0xFFF5EB,
  key: 0xFFE4C8,
  fill: 0xFFF8F0,
  lampEmissive: 0xFFD2A6,
};

const ASSET = './studio/webgl-assets';
const GLB = {
  desk: `${ASSET}/glb/desk.glb`,
  laptop: `${ASSET}/glb/laptop.glb`,
  printer: `${ASSET}/glb/printer.glb`,
  book: `${ASSET}/glb/book.glb`,
  lamp: `${ASSET}/glb/lamp.glb`,
  plant: `${ASSET}/glb/plant.glb`,
};
const HDRI_URL = `${ASSET}/hdri/studio-09-4000k-1k.hdr`;
const STICKER_MANIFEST = `${ASSET}/stickers/manifest.json`;
const STICKER_API = '/api/studio-stickers';
const DESK_SCALE = 0.82; // LAYOUT-CAMERA-SPEC: long edge ~2.2, height ~0.66

const qaLight = new URLSearchParams(location.search).has('qa')
  || new URLSearchParams(location.search).get('light') === '1';
const viewMode = new URLSearchParams(location.search).get('view') || '';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const errEl = document.getElementById('err');
const hintEl = document.getElementById('hint');
const scrollCueEl = document.getElementById('scrollCue');
const statusEl = document.getElementById('status');
function showErr(msg){
  console.error(msg);
  errEl.textContent = '加载失败\n' + msg;
  errEl.classList.add('show');
}
function setStatus(t){ statusEl.textContent = t; }

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

/* ========== renderer: AA forced, warm tone ========== */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true, // forced on mobile too
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false,
});
if (!renderer.getContext()) throw new Error('WebGL 不可用');
const maxPR = 2;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPR));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(MAT.bg, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(MAT.bg);
scene.fog = new THREE.Fog(MAT.bg, 18, 36);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 40);

let scrollTarget = 0;
let scrollProg = 0;

function orbitCam(look, dist, elevDeg, azimDeg){
  const el = elevDeg * Math.PI / 180;
  const az = azimDeg * Math.PI / 180;
  const x = look.x + dist * Math.cos(el) * Math.sin(az);
  const y = look.y + dist * Math.sin(el);
  const z = look.z + dist * Math.cos(el) * Math.cos(az);
  return { pos: new THREE.Vector3(x, y, z), look: look.clone() };
}
// LAYOUT-CAMERA-SPEC defaults (refined after desk mounts)
let tableTopY = 0.66;
let camLook = new THREE.Vector3(0, tableTopY, -0.05);
let camDesk = orbitCam(camLook, 3.5, 30, -40);
// Hero: same orbit, slightly farther / higher for floating stickers over desk
let camHero = orbitCam(new THREE.Vector3(0, tableTopY + 0.35, 0.15), 4.2, 22, -38);
function refreshCameras(){
  camLook.set(0.05, tableTopY + 0.02, 0.05);
  // LAYOUT: fov35 already; elev~30, azim~-40; closer to match LOCK framing
  camDesk = orbitCam(camLook, 2.85, 28, -36);
  camHero = orbitCam(new THREE.Vector3(0.05, tableTopY + 0.45, 0.15), 3.35, 24, -36);
}
const _camPos = new THREE.Vector3();
const _camLook = new THREE.Vector3();
function applyCamera(){
  _camPos.lerpVectors(camHero.pos, camDesk.pos, scrollProg);
  _camLook.lerpVectors(camHero.look, camDesk.look, scrollProg);
  camera.position.copy(_camPos);
  camera.lookAt(_camLook);
}
applyCamera();
if (viewMode === 'desk' || viewMode === 'workbench') {
  scrollTarget = 1; scrollProg = 1; applyCamera();
}

/* ========== lights (LIGHTING-SPEC) ========== */
const amb = new THREE.AmbientLight(MAT.ambient, 0.55);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xFFF8F0, 0xE8D9C8, 0.35);
scene.add(hemi);

/* Key: top-right, warm soft */
const key = new THREE.DirectionalLight(MAT.key, 1.45);
key.position.set(3.6, 8.2, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.00028;
key.shadow.normalBias = 0.02;
key.shadow.radius = 2.8; // softer still readable contact
scene.add(key);

/* Fill: front-left weak */
const fill = new THREE.DirectionalLight(MAT.fill, 0.38);
fill.position.set(-4.5, 3.5, 5.5);
scene.add(fill);

/* rim / bounce from below-front to open dark faces */
const bounce = new THREE.DirectionalLight(0xFFEBD8, 0.18);
bounce.position.set(0.5, -1.5, 3);
scene.add(bounce);

/* ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({
    color: MAT.bg, roughness: 0.88, metalness: 0.0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ========== post: SMAA ========== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const smaaPass = new SMAAPass(
  Math.floor(innerWidth * renderer.getPixelRatio()),
  Math.floor(innerHeight * renderer.getPixelRatio())
);
composer.addPass(smaaPass);
composer.addPass(new OutputPass());

/* ========== workbench root ========== */
const bench = new THREE.Group();
scene.add(bench);
let DESK_Y = 0.66;
let topY = 0.66;
const loadedProps = Object.create(null);
let printerSlotLocal = new THREE.Vector3(0, 0.15, 0.35);
let printerGroup = null;
let lampGroup = null;
let bookGroup = null;
let tempDesk = null;
let envReady = false;

const texLoader = new THREE.TextureLoader();
function loadTex(url, { colorSpace = THREE.SRGBColorSpace, wrap = true, aniso = 8 } = {}){
  return new Promise((resolve, reject) => {
    texLoader.load(url, (t) => {
      t.colorSpace = colorSpace;
      if (wrap){
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
      }
      t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());
      t.needsUpdate = true;
      resolve(t);
    }, undefined, reject);
  });
}

function enableShadows(root){
  root.traverse((o) => {
    if (o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats){
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
          m.needsUpdate = true;
        }
      }
    }
  });
}

function fitProp(root, targetSize, yAlign = 'bottom'){
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = targetSize / maxDim;
  root.scale.setScalar(s);
  box.setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x;
  root.position.z -= c.z;
  if (yAlign === 'bottom'){
    root.position.y -= box.min.y;
  } else {
    root.position.y -= c.y;
  }
}

async function tryLoadGLB(url){
  const loader = new GLTFLoader();
  try {
    const gltf = await loader.loadAsync(url);
    return gltf.scene;
  } catch (e) {
    return null;
  }
}

async function loadStudioHDRI(){
  try {
    const tex = await new RGBELoader().loadAsync(HDRI_URL);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envMap = pmrem.fromEquirectangular(tex).texture;
    scene.environment = envMap;
    scene.background = new THREE.Color(MAT.bg);
    // three@0.160: no environmentRotation — yaw via key/fill placement instead
    tex.dispose(); pmrem.dispose();
    amb.intensity = 0.18;
    hemi.intensity = 0.12;
    key.intensity = 0.85; // need readable cast shadows under thick slabs
    key.position.set(2.6, 5.8, 2.4);
    key.castShadow = true;
    key.shadow.radius = 3.2;
    fill.intensity = 0.16;
    bounce.intensity = 0.05;
    renderer.toneMappingExposure = 1.12;
    envReady = true;
    return true;
  } catch (e) {
    console.warn('HDRI fail', e);
    return false;
  }
}

/* —— temp oak desk ONLY for lighting QA (not a delivery prop set) —— */
async function buildTempLightDesk(){
  let albedo, normal, rough;
  try {
    albedo = await loadTex(`${ASSET}/materials/wood-oak/web/albedo.jpg`);
    normal = await loadTex(`${ASSET}/materials/wood-oak/web/normal.jpg`, { colorSpace: THREE.LinearSRGBColorSpace });
    rough = await loadTex(`${ASSET}/materials/wood-oak/web/roughness.jpg`, { colorSpace: THREE.NoColorSpace });
    albedo.repeat.set(1.6, 0.85);
    normal.repeat.copy(albedo.repeat);
    rough.repeat.copy(albedo.repeat);
  } catch (e) {
    console.warn('oak maps missing', e);
  }
  const mat = new THREE.MeshStandardMaterial({
    color: albedo ? 0xffffff : MAT.oak,
    map: albedo || null,
    normalMap: normal || null,
    roughnessMap: rough || null,
    roughness: 0.55,
    metalness: 0.0,
  });
  // single slab — lighting probe only; no machines
  const desk = new THREE.Mesh(new RoundedBoxGeometry(4.6, 0.18, 2.2, 8, 0.08), mat);
  desk.position.set(0, DESK_Y, 0);
  desk.castShadow = true;
  desk.receiveShadow = true;
  desk.name = 'temp-light-desk';
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(5.6, 3.1),
    new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0.13, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.12, 0.02, 0.18);
  const g = new THREE.Group();
  g.add(desk, shadow);
  g.visible = false; // shown only for qa / until real desk.glb
  return g;
}

async function mountProps(){
  tempDesk = await buildTempLightDesk();
  bench.add(tempDesk);

  // LAYOUT-CAMERA-SPEC §3 — local tabletop coords (origin = desk top center, Y=0 on top)
  // World = deskWrap + (local * deskScale already applied via desk); props parented to deskTop
  const deskTop = new THREE.Group();
  deskTop.name = 'deskTop';
  const localPlace = {
    // LAYOUT-CAMERA-SPEC §3 — accept mesh limits, tune for readability
    laptop: { pos: [-0.68, 0, 0.16], size: 0.50, rotY: 0.38 },
    printer: { pos: [-0.26, 0, 0.06], size: 0.20, rotY: 0 }, // smaller white thermal
    book: { pos: [0.30, 0, 0.0], size: 0.50, rotY: -0.12 },
    plant: { pos: [0.68, 0, -0.12], size: 0.26 },
    lamp: { pos: [0.88, 0, 0.10], size: 0.40, rotY: -1.15 }, // shorter; shade → book
  };

  const results = {};
  await Promise.all(Object.keys(GLB).map(async (id) => {
    results[id] = await tryLoadGLB(GLB[id]);
  }));

  let any = false;
  // Desk first: full mesh WITH legs, uniform scale 0.82
  if (results.desk){
    any = true;
    const root = results.desk;
    const wrap = new THREE.Group();
    wrap.add(root);
    root.scale.setScalar(DESK_SCALE);
    root.traverse((o)=>{
      if(!o.isMesh||!o.material) return;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      for(const m of mats){
        // Albedo pre-lifted in desk.glb; keep warm multiply
        if(m.map){ m.map.colorSpace = THREE.SRGBColorSpace; m.map.needsUpdate = true; }
        if(m.color) m.color.setHex(0xFFF8EE);
        if(m.roughness!=null) m.roughness = 0.62;
        if(m.metalness!=null) m.metalness = 0;
        if(m.aoMapIntensity!=null) m.aoMapIntensity = 0.35;
        m.envMapIntensity = 0.2;
        m.needsUpdate = true;
      }
    });
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    root.position.x -= c.x;
    root.position.z -= c.z;
    root.position.y -= box.min.y; // feet on ground
    const box2 = new THREE.Box3().setFromObject(wrap);
    tableTopY = box2.max.y;
    topY = tableTopY;
    DESK_Y = tableTopY;
    deskTop.position.set(0, tableTopY, 0);
    wrap.add(deskTop);
    // soft ground contact under table
    const foot = new THREE.Mesh(
      new THREE.PlaneGeometry((box2.max.x-box2.min.x)+0.5, (box2.max.z-box2.min.z)+0.4),
      new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0.18, depthWrite: false })
    );
    foot.rotation.x = -Math.PI/2;
    foot.position.set(0.04, 0.012, 0.06);
    wrap.add(foot);
    enableShadows(wrap);
    bench.add(wrap);
    loadedProps.desk = wrap;
    refreshCameras();
    applyCamera();
  }

  for (const id of ['laptop','printer','book','plant','lamp']){
    const root = results[id];
    if (!root) continue;
    any = true;
    const cfg = localPlace[id];
    const wrap = new THREE.Group();
    wrap.add(root);
    fitProp(root, cfg.size, 'bottom');
    wrap.position.set(cfg.pos[0], 0, cfg.pos[2]);
    if (cfg.rotY) wrap.rotation.y = cfg.rotY;
    enableShadows(wrap);
    deskTop.add(wrap);
    loadedProps[id] = wrap;
    if (id === 'laptop'){
      // Kill floating "browser pane" ghosts: hide oversized thin planes
      const meshes = [];
      wrap.traverse((o)=>{ if(o.isMesh) meshes.push(o); });
      const warmScreen = (()=>{
        const c=document.createElement('canvas'); c.width=256; c.height=160;
        const g=c.getContext('2d');
        const grd=g.createLinearGradient(0,0,0,160);
        grd.addColorStop(0,'#F6C28B'); grd.addColorStop(0.45,'#E8876A');
        grd.addColorStop(0.75,'#7A4E7A'); grd.addColorStop(1,'#2A2540');
        g.fillStyle=grd; g.fillRect(0,0,256,160);
        // soft sun
        const sun=g.createRadialGradient(180,50,4,180,50,40);
        sun.addColorStop(0,'rgba(255,240,200,0.95)'); sun.addColorStop(1,'rgba(255,200,120,0)');
        g.fillStyle=sun; g.beginPath(); g.arc(180,50,40,0,Math.PI*2); g.fill();
        const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; return tex;
      })();
      for (const o of meshes){
        const bb=new THREE.Box3().setFromObject(o);
        const sz=bb.getSize(new THREE.Vector3());
        const dims=[sz.x,sz.y,sz.z].sort((a,b)=>a-b);
        const thin = dims[0] < 0.02 && dims[2] > 0.35; // paper-thin huge plane
        const n=(o.name||'').toLowerCase();
        if (thin || n.includes('plane') || n.includes('quad') || n.includes('window')){
          o.visible = false;
          continue;
        }
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const m of mats){
          if(!m) continue;
          if('transmission' in m) m.transmission = 0;
          if(m.transparent){ m.transparent=false; m.opacity=1; }
          // screen-like: dark base + warm emissive map
          const isScreen = n.includes('screen')||n.includes('display')||n.includes('lcd');
          // only treat as screen if named, OR thin vertical panel (height dominant)
          const tallThin = sz.y > sz.x * 0.7 && sz.y > 0.12 && dims[0] < 0.025;
          if (isScreen || tallThin){
            m.map = warmScreen;
            m.emissiveMap = warmScreen;
            m.color.setHex(0xffffff);
            m.emissive = new THREE.Color(0xffffff);
            m.emissiveIntensity = 0.65;
            m.roughness = 0.4; m.metalness = 0;
          } else {
            if(m.emissiveIntensity){ m.emissiveIntensity = 0; if(m.emissive) m.emissive.setHex(0x000000); }
            // silver chassis
            if(m.color){ m.color.setHex(0xC8CCD0); }
            if(m.metalness!=null) m.metalness = Math.max(m.metalness||0, 0.55);
            if(m.roughness!=null) m.roughness = 0.4;
          }
          m.depthWrite = true;
          m.needsUpdate = true;
        }
      }
    }
    if (id === 'printer'){
      printerGroup = wrap;
      // Force matte white body (LOCK) — drop dark baked maps
      wrap.traverse((o)=>{
        if(!o.isMesh||!o.material) return;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const m of mats){
          m.map = null; m.normalMap = null; m.roughnessMap = null; m.metalnessMap = null;
          m.aoMap = null; m.emissiveMap = null;
          m.color.setHex(0xF5F2EC);
          m.roughness = 0.68; m.metalness = 0.0;
          if(m.emissive){ m.emissive.setHex(0x222222); m.emissiveIntensity = 0.08; }
          m.envMapIntensity = 0.15;
          m.needsUpdate = true;
        }
      });
      const box = new THREE.Box3().setFromObject(root);
      const frontZ = box.min.z < 0 ? box.min.z : -Math.abs(box.max.z);
      printerSlotLocal = new THREE.Vector3(
        0,
        Math.max(0.06, (box.max.y - box.min.y) * 0.42),
        frontZ * 0.92
      );
    }
    if (id === 'book') bookGroup = wrap;
    if (id === 'lamp'){
      lampGroup = wrap;
      wrap.traverse((o)=>{
        if(!o.isMesh||!o.material) return;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const m of mats){
          const n=(m.name||o.name||'').toLowerCase();
          if(n.includes('bulb')){
            m.emissive = new THREE.Color(MAT.lampEmissive);
            m.emissiveIntensity = 3.2;
            m.color.setHex(0xFFE8C8);
          } else if(n.includes('chrome') || n.includes('steel')){
            // brushed brass shade / stem
            m.color.setHex(0xC4A06A);
            m.metalness = 0.88;
            m.roughness = 0.32;
            m.envMapIntensity = 1.1;
          } else if(n.includes('blackmetal') || n.includes('black')){
            // warm dark brass base
            m.color.setHex(0x8A6A3E);
            m.metalness = 0.75;
            m.roughness = 0.4;
          } else {
            if(m.metalness!=null && m.metalness>0.4){
              m.color.setHex(0xC4A06A);
              m.metalness = 0.85;
              m.roughness = 0.35;
            }
          }
          m.needsUpdate = true;
        }
      });
      // Shade tips toward sketchbook (local −X/−Z)
      // squash vertical presence a bit (accept mesh, fix proportion)
      wrap.scale.y *= 0.82;
      const lampLight = new THREE.SpotLight(MAT.lampEmissive, 2.2, 4.2, 0.75, 0.4, 1.0);
      lampLight.position.set(0.02, 0.42, 0.0);
      lampLight.target.position.set(-0.62, 0.0, -0.05);
      wrap.add(lampLight); wrap.add(lampLight.target);
      lampLight.castShadow = !isMobile;
      if (lampLight.castShadow){ lampLight.shadow.mapSize.set(1024,1024); lampLight.shadow.bias=-0.001; }
      const fillL = new THREE.PointLight(MAT.lampEmissive, 0.85, 2.8);
      fillL.position.set(0, 0.48, 0);
      wrap.add(fillL);
      wrap.userData.light = lampLight;
      wrap.userData.fill = fillL;
    }
  }

  // Defer page stickers + spit strip until textures ready (called from boot)
  

  // show temp oak desk only if no desk.glb AND (qa mode OR we want light probe for scroll view)
  if (!loadedProps.desk){
    // Temp oak slab is lighting probe ONLY — hide on hero so LOCK-hero-float compare is fair.
    // Show when scrolled to workbench / ?view=desk|workbench (still not a delivery prop set).
    const wantDeskView = viewMode === 'desk' || viewMode === 'workbench' || qaLight;
    tempDesk.visible = wantDeskView;
    tempDesk.userData.lightingProbe = true;
  } else {
    tempDesk.visible = false;
  }

  const missing = Object.keys(GLB).filter((k) => !loadedProps[k]);
  setStatus(
    `已载: ${Object.keys(loadedProps).join(', ')||'无'} · 缺: ${missing.join(', ')||'无'} · HDRI:${envReady?'09@4000K':'…'} · topY=${tableTopY.toFixed(3)}`
  );
  return { any, missing };
}


/** Spit a rigid thick-slab strip from printer mouth toward camera (LOCK). */
function buildPrinterSpitStrip(){
  if (!printerGroup) return;
  const pool = lockScatterTexList.length ? lockScatterTexList : stickerTexList;
  if (!pool.length) return;
  const strip = new THREE.Group();
  strip.name = 'printerSpitStrip';
  for (let i = 0; i < 3; i++){
    const pick = pool[i % pool.length];
    const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
    const h = 0.07;
    const w = h * Math.min(1.25, Math.max(0.8, aspect));
    const slab = createFlatThickSticker(w, h, pick.tex, 0.012);
    slab.rotation.set(-Math.PI / 2, 0, (i - 1) * 0.04);
    slab.position.set((i - 1) * 0.02, 0.01, -0.05 - i * 0.085);
    strip.add(slab);
  }
  strip.position.copy(printerSlotLocal);
  strip.position.y = 0.015;
  strip.position.z = Math.min(printerSlotLocal.z, -0.02) - 0.03;
  printerGroup.add(strip);
  printerGroup.userData.spitStrip = strip;
}

/** Decorate open sketchbook: small readable page grid (not big floating cards). */
function decorateSketchbookPages(){
  if (!bookGroup) return;
  const pool = (lockScatterTexList.length ? lockScatterTexList : stickerTexList);
  if (!pool.length) return;
  const page = new THREE.Group();
  page.name = 'bookPageStickers';
  // two-page grid, local coords on open Steno
  const slots = [
    // left page
    [-0.10, 0.018, -0.06], [-0.10, 0.018, 0.02], [-0.04, 0.018, -0.03],
    // right page
    [0.04, 0.018, -0.05], [0.10, 0.018, 0.0], [0.05, 0.018, 0.05],
  ];
  for (let i = 0; i < slots.length; i++){
    const pick = pool[i % pool.length];
    const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
    const h = 0.048;
    const w = h * Math.min(1.2, Math.max(0.8, aspect));
    const slab = createFlatThickSticker(w, h, pick.tex, 0.01);
    slab.rotation.set(-Math.PI / 2, (i % 2 === 0 ? -0.08 : 0.1), 0);
    slab.position.set(slots[i][0], slots[i][1], slots[i][2]);
    const blob = makeBlobShadow(Math.max(w, h) * 1.15);
    blob.position.set(slots[i][0] + 0.008, 0.01, slots[i][2] + 0.008);
    blob.material.opacity = 0.4;
    page.add(slab, blob);
  }
  bookGroup.add(page);
}

function getSlotWorld(){
  const v = printerSlotLocal.clone();
  if (printerGroup){
    printerGroup.localToWorld(v);
    return v;
  }
  // fallback spawn matching hero-float narrative (mid-left above desk height)
  return new THREE.Vector3(-0.25, topY + 0.45, 0.55);
}

/* ========== flat-thick stickers (slab + float + heavy shadow; NO bend/curl) ========== */
const stickerTexList = [];

async function resolveStickerFileList(){
  try {
    const r = await fetch(STICKER_API, { cache: 'no-store' });
    if (r.ok){
      const j = await r.json();
      if (Array.isArray(j.items) && j.items.length){
        return j.items.map((it) => ({ file: it.file, url: it.url }));
      }
      if (Array.isArray(j.files) && j.files.length){
        return j.files.map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
      }
    }
  } catch (e) { console.warn('sticker API', e); }
  try {
    const r = await fetch(STICKER_MANIFEST, { cache: 'no-store' });
    if (r.ok){
      const j = await r.json();
      const excl = new Set(j.exclude || []);
      const re = new RegExp(j.pattern || '^sticker-.*\\.png$', 'i');
      return (j.include || []).filter((f) => !excl.has(f) && re.test(f))
        .map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
    }
  } catch (e) { console.warn('sticker manifest', e); }
  return ['sticker-strawberry.png','sticker-cat.png','sticker-lemon.png','sticker-peach.png','sticker-vibe.png','sticker-msb.png','sticker-blossom.png']
    .map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
}

async function loadStickerTextures(){
  const entries = await resolveStickerFileList();
  const loads = entries.map(({ file, url }) => new Promise((resolve) => {
    texLoader.load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const img = tex.image;
      resolve({ tex, w: img?.width || 512, h: img?.height || 512, file,
        primary: !/-(b|c|d|peel)\.png$/i.test(file) });
    }, undefined, () => resolve(null));
  }));
  const got = (await Promise.all(loads)).filter(Boolean);
  for (const g of got){
    stickerTexList.push(g);
    if (g.primary) stickerTexList.push(g, g);
  }
  if (!stickerTexList.length) throw new Error('贴纸 PNG 加载失败');
  console.info('[studio] stickers hot-plug', got.map((g) => g.file));
}

function makeBackTex(){
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F5F2EC';
  ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const backTex = makeBackTex();

const stickers = [];
const MAX_STICKERS = isMobile ? 18 : 28;
const pointer = new THREE.Vector2(9999, 9999);
const pointerWorld = new THREE.Vector3(9999, 9999, 9999);
let pointerActive = false;

/** Soft radial blob texture for contact / drop shadows (ref: sticker-style-flat-thick) */
function makeSoftBlobTex(){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S*0.5, S*0.5, S*0.05, S*0.5, S*0.5, S*0.5);
  g.addColorStop(0, 'rgba(26,18,12,0.70)');
  g.addColorStop(0.35, 'rgba(26,18,12,0.38)');
  g.addColorStop(0.7, 'rgba(26,18,12,0.12)');
  g.addColorStop(1, 'rgba(26,18,12,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,S,S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}
const softBlobTex = makeSoftBlobTex();
const SHADOW_LIGHT_DIR = new THREE.Vector3(0.45, 0, 0.35); // blob offset on receiving plane (key from upper-right)

function makeBlobShadow(size){
  const mat = new THREE.MeshBasicMaterial({
    map: softBlobTex,
    color: 0xffffff,
    transparent: true,
    opacity: 0.0,
    depthWrite: false,
    depthTest: true,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.scale.setScalar(size);
  mesh.renderOrder = 1;
  return mesh;
}

/** Rigid flat-thick PVC/card slab — NO bend/curl. Shadows via castShadow + soft blob. */
function createFlatThickSticker(w, h, tex, thickness = 0.022){
  const group = new THREE.Group();
  const frontMat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.68, metalness: 0.0,
    transparent: true, alphaTest: 0.35, depthWrite: true, side: THREE.DoubleSide,
  });
  const whiteMat = new THREE.MeshStandardMaterial({
    color: 0xF7F0E6, roughness: 0.8, metalness: 0.0,
  });
  const rim = new THREE.Mesh(new THREE.BoxGeometry(w, h, thickness), whiteMat);
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), frontMat);
  front.position.z = thickness * 0.5 + 0.0005;
  front.castShadow = true; rim.castShadow = true;
  front.receiveShadow = true; rim.receiveShadow = true;
  // Local "behind" soft shadow card — always sits just behind the slab to pop white edge
  // (matches sticker-style-flat-thick drop-shadow language even mid-air)
  const backMat = new THREE.MeshBasicMaterial({
    map: softBlobTex,
    color: 0xffffff,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const backShade = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.25, h * 1.25), backMat);
  backShade.position.set(0.02 * Math.max(w,h), -0.025 * Math.max(w,h), -(thickness * 0.5 + 0.004));
  backShade.renderOrder = 0;
  group.add(rim, front, backShade);
  group.userData.front = front;
  group.userData.backShade = backShade;
  group.userData.thickness = thickness;
  group.userData.footprint = Math.max(w, h);
  return group;
}

/** Project soft blob under sticker onto desk top or ground; offset like style-lock drop shadow. */
function syncStickerShadow(s){
  const gp = s.group.position;
  const onDesk = Math.abs(gp.x) < 1.35 && Math.abs(gp.z) < 1.45 && gp.y > topY - 0.08;
  const planeY = onDesk ? (topY + 0.0035) : 0.01;
  const height = Math.max(0.008, gp.y - planeY);
  const foot = s.group.userData.footprint || s.size || 0.3;
  const prox = THREE.MathUtils.clamp(1 - height / 1.35, 0, 1);
  // Hard requirement: readable shadow behind every sticker (style-flat-thick)
  const op = THREE.MathUtils.clamp(0.22 + prox * 0.48, 0.22, 0.72);
  const sc = foot * (1.2 + height * 0.65);
  const ox = SHADOW_LIGHT_DIR.x * (0.05 + height * 0.14);
  const oz = SHADOW_LIGHT_DIR.z * (0.05 + height * 0.14);
  if (s.shadow){
    s.shadow.position.set(gp.x + ox, planeY, gp.z + oz);
    s.shadow.scale.set(sc * 1.25, sc * 1.0, 1);
    s.shadow.material.opacity = op;
    s.shadow.visible = true;
  }
  if (s.shadowSoft){
    s.shadowSoft.position.set(gp.x + ox * 1.4, planeY + 0.0012, gp.z + oz * 1.4);
    s.shadowSoft.scale.set(sc * 1.7, sc * 1.35, 1);
    s.shadowSoft.material.opacity = Math.max(0.12, op * 0.5);
    s.shadowSoft.visible = true;
  }
  // Local backShade opacity: stronger when floating (no nearby plane contact)
  const bs = s.group.userData.backShade;
  if (bs && bs.material){
    bs.material.opacity = THREE.MathUtils.clamp(0.35 + (1 - prox) * 0.35, 0.35, 0.7);
  }
}

function spawnSticker(forceLanded = false){
  if (stickers.length >= MAX_STICKERS){
    let victim = stickers.find((s) => s.state === 'landed' && s.age > 4) || stickers[0];
    if (victim){
      scene.remove(victim.group);
      if (victim.shadow) scene.remove(victim.shadow);
      if (victim.shadowSoft) scene.remove(victim.shadowSoft);
      stickers.splice(stickers.indexOf(victim), 1);
    }
  }
  const pick = stickerTexList[(Math.random() * stickerTexList.length) | 0];
  const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
  const size = 0.22 + Math.random() * 0.14;
  const w = size * Math.min(1.35, Math.max(0.7, aspect));
  const h = size;
  const thickness = 0.020 + Math.random() * 0.008; // rigid slab depth for cast + blob
  const group = createFlatThickSticker(w, h, pick.tex, thickness);
  const front = group.userData.front;

  const slot = getSlotWorld();
  group.position.copy(slot);
  group.position.x += (Math.random() - 0.5) * 0.06;
  group.position.y += (Math.random() - 0.5) * 0.03;
  // slight tilt only — no curl
  // slight tilt only (flat-thick; not card-upright)
  group.rotation.set(
    -0.35 + (Math.random() - 0.5) * 0.25,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.2
  );

  const sh = makeBlobShadow(size * 1.2);
  const shSoft = makeBlobShadow(size * 1.6);
  scene.add(sh);
  scene.add(shSoft);
  scene.add(group);

  const willLand = forceLanded || Math.random() < 0.48;
  const floatDur = 2.6 + Math.random() * 2.2;
  const driftX = 0.45 + Math.random() * 1.8;
  const driftZ = (Math.random() - 0.5) * 1.0;
  const peakY = 1.1 + Math.random() * 1.4;

  const s = {
    group, front, shadow: sh, shadowSoft: shSoft,
    state: forceLanded ? 'landed' : 'eject',
    age: 0, t: 0, size, thickness,
    spin: new THREE.Vector3(
      (Math.random() - 0.5) * 0.35,
      (Math.random() - 0.5) * 0.7,
      (Math.random() - 0.5) * 0.4
    ),
    willLand, floatDur,
    origin: group.position.clone(),
    home: null,
    vel: new THREE.Vector3(0.55 + Math.random() * 0.4, 0.7 + Math.random() * 0.35, -0.15 + (Math.random() - 0.5) * 0.2),
    landPos: new THREE.Vector3(
      (Math.random() - 0.35) * 0.9,
      topY + thickness * 0.5 + 0.006,
      0.55 + Math.random() * 0.55
    ),
    peakY, driftX, driftZ,
    bounce: 0, ejectT: 0, pathT: 0,
    push: new THREE.Vector3(),
    pushVel: new THREE.Vector3(),
    breathe: Math.random() * Math.PI * 2,
  };
  // LOCK: 3–5 thick slabs on front apron between printer & sketchbook
  s.landPos.x = THREE.MathUtils.clamp(-0.15 + Math.random() * 0.55, -0.25, 0.55);
  s.landPos.z = THREE.MathUtils.clamp(0.55 + Math.random() * 0.35, 0.45, 0.95);

  if (forceLanded){
    const i = stickers.filter((x)=>x.state==='landed').length;
    group.position.set(
      -0.12 + i * 0.2 + (Math.random()-0.5)*0.03,
      topY + thickness * 0.5 + 0.012,
      0.58 + (Math.random()-0.5)*0.06
    );
    // face-up on desk: local +Z -> world +Y
    group.rotation.set(-Math.PI / 2, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.08);
    s.home = group.position.clone();
    s.landPos.copy(group.position);
    s.spin.set(0,0,0);
    syncStickerShadow(s);
  } else {
    syncStickerShadow(s);
  }
  stickers.push(s);
  return s;
}

/* ========== pointer / scroll ========== */
function onPointer(e){
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(x, y);
  pointerActive = true;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(pointer, camera);
  const hPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(topY + 0.9));
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(hPlane, hit)) pointerWorld.copy(hit);
  else pointerWorld.set(9999, 9999, 9999);
}
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerleave', () => { pointerActive = false; });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches[0]) onPointer(e.touches[0]);
}, { passive: true });

function onWheel(e){
  e.preventDefault();
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + e.deltaY * 0.00115, 0, 1);
}
canvas.addEventListener('wheel', onWheel, { passive: false });

let touchY0 = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches[0]) touchY0 = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { touchY0 = null; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!e.touches[0] || touchY0 == null) return;
  const dy = touchY0 - e.touches[0].clientY;
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + dy * 0.0025, 0, 1);
  touchY0 = e.touches[0].clientY;
}, { passive: true });

/* ========== animate ========== */
const clock = new THREE.Clock();
const _tmp = new THREE.Vector3();
const _push = new THREE.Vector3();
let spawnAcc = 0;
let SPAWN_EVERY = reduceMotion ? 1.15 : 0.45;

function updateSticker(s, dt){
  s.age += dt;
  s.t += dt;
  s.breathe += dt * 1.4;
  // flat-thick: no bend/curl — only rigid tilt from spin

  if (s.state === 'eject'){
    s.ejectT += dt;
    s.group.position.addScaledVector(s.vel, dt);
    s.vel.y += dt * 0.75;
    s.vel.x += dt * 0.35;
    s.group.rotation.x += s.spin.x * dt;
    s.group.rotation.y += s.spin.y * dt;
    s.group.rotation.z += s.spin.z * dt;
    syncStickerShadow(s);
    if (s.ejectT > 0.35){
      s.state = 'float';
      s.pathT = 0;
      s.origin.copy(s.group.position);
      s.home = s.group.position.clone();
    }
  } else if (s.state === 'float'){
    s.pathT += dt / s.floatDur;
    const u = Math.min(1, s.pathT);
    const ease = 1 - Math.pow(1 - u, 2.2);
    const slotish = s.origin;
    const target = _tmp.set(
      slotish.x + s.driftX * ease,
      slotish.y + Math.sin(ease * Math.PI) * s.peakY * 0.9 + ease * 0.15,
      slotish.z + s.driftZ * ease + ease * 0.55
    );
    target.y += Math.sin(s.breathe) * 0.06;
    target.x += Math.sin(s.breathe * 0.7) * 0.04;
    s.home.copy(target);

    s.pushVel.multiplyScalar(0.88);
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y *= 0.35;
      const dist = _push.length();
      const radius = 1.35;
      if (dist < radius && dist > 0.001){
        const f = (1 - dist / radius);
        _push.normalize().multiplyScalar(f * f * 5.5);
        s.pushVel.addScaledVector(_push, dt * 18);
      }
    }
    _push.copy(s.home).sub(s.group.position).sub(s.push);
    s.pushVel.addScaledVector(_push, dt * 3.2);
    s.push.addScaledVector(s.pushVel, dt);
    s.push.multiplyScalar(0.96);
    s.group.position.copy(s.home).add(s.push);

    s.group.rotation.x += s.spin.x * dt * 0.45;
    s.group.rotation.y += s.spin.y * dt * 0.55;
    s.group.rotation.z += s.spin.z * dt * 0.4;

    syncStickerShadow(s);

    if (u >= 1){
      if (s.willLand){
        s.state = 'falling';
        s.fallT = 0;
        s.fallFrom = s.group.position.clone();
      } else {
        s.state = 'fade';
        s.fadeT = 0;
      }
    }
  } else if (s.state === 'falling'){
    s.fallT = (s.fallT || 0) + dt;
    const dur = 0.85;
    const u = Math.min(1, s.fallT / dur);
    const ease = u * u * (3 - 2 * u);
    s.group.position.lerpVectors(s.fallFrom, s.landPos, ease);
    const flatX = -Math.PI / 2;
    s.group.rotation.x += (flatX - s.group.rotation.x) * Math.min(1, ease * 0.35);
    s.group.rotation.z *= (1 - ease * 0.2);
    syncStickerShadow(s);
    if (u >= 1){
      s.state = 'landed';
      s.bounce = 1;
      s.group.position.copy(s.landPos);
      s.home = s.landPos.clone();
    }
  } else if (s.state === 'landed'){
    if (s.bounce > 0){
      s.bounce -= dt * 2.2;
      const b = Math.max(0, s.bounce);
      s.group.position.y = s.landPos.y + Math.sin((1 - b) * Math.PI) * 0.08 * b;
      syncStickerShadow(s);
    } else {
      s.group.position.y = s.landPos.y;
      syncStickerShadow(s);
    }
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y = 0;
      const dist = _push.length();
      if (dist < 0.9 && dist > 0.001){
        _push.normalize().multiplyScalar((1 - dist / 0.9) * 0.015);
        s.group.position.add(_push);
        s.group.position.y = s.landPos.y;
        syncStickerShadow(s);
      }
    }
  } else if (s.state === 'fade'){
    s.fadeT = (s.fadeT || 0) + dt;
    s.group.position.y += dt * 0.4;
    s.group.position.x += dt * 0.5;
    const op = 1 - s.fadeT / 0.8;
    s.front.material.opacity = Math.max(0, op);
    s.group.traverse((o)=>{ if(o.isMesh && o.material && o.material.transparent) o.material.opacity = Math.max(0, op); });
    if (s.shadow) s.shadow.material.opacity *= 0.88;
    if (s.shadowSoft) s.shadowSoft.material.opacity *= 0.88;
    if (s.fadeT > 0.8){
      scene.remove(s.group);
      if (s.shadow) scene.remove(s.shadow);
      if (s.shadowSoft) scene.remove(s.shadowSoft);
      stickers.splice(stickers.indexOf(s), 1);
    }
  }
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.033, clock.getDelta());

  scrollProg += (scrollTarget - scrollProg) * (reduceMotion ? 1 : 0.08);
  applyCamera();
  if (tempDesk && tempDesk.userData.lightingProbe && !loadedProps.desk){
    tempDesk.visible = scrollProg > 0.35 || viewMode === 'desk' || viewMode === 'workbench';
  }
  scrollCueEl.style.opacity = String(1 - Math.min(1, scrollProg * 2.2));
  if (scrollProg > 0.55){
    hintEl.innerHTML = loadedProps.desk
      ? '工作台 · 电脑本 / 打印机 / 速写本 / 台灯 · <em>滚轮</em>可回到首屏'
      : '工作台精模待接入 · <em>滚轮</em>可回到首屏';
  } else {
    hintEl.innerHTML = '贴纸持续飘出 · <em>鼠标靠近</em>贴纸会躲开';
  }

  spawnAcc += dt;
  if (spawnAcc >= SPAWN_EVERY){
    spawnAcc = 0;
    spawnSticker(false);
  }

  if (printerGroup){
    printerGroup.position.y = Math.sin(clock.elapsedTime * 1.2) * 0.004;
  }
  if (lampGroup && lampGroup.userData.light){
    const pulse = 1.15 + Math.sin(clock.elapsedTime * 1.5) * 0.2;
    lampGroup.userData.light.intensity = pulse;
    if (lampGroup.userData.fill) lampGroup.userData.fill.intensity = 0.45 + Math.sin(clock.elapsedTime * 1.5) * 0.08;
  }
  if (loadedProps.plant){
    loadedProps.plant.rotation.z = Math.sin(clock.elapsedTime * 0.8) * 0.02;
  }

  for (let i = stickers.length - 1; i >= 0; i--){
    updateSticker(stickers[i], dt);
  }

  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPR));
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  smaaPass.setSize(
    Math.floor(innerWidth * renderer.getPixelRatio()),
    Math.floor(innerHeight * renderer.getPixelRatio())
  );
});

/* boot */
await loadStickerTextures();
await loadLockScatterTextures();
await loadStudioHDRI();
const mount = await mountProps();
buildPrinterSpitStrip();
decorateSketchbookPages();
refreshCameras(); applyCamera();

// LOCK foreground row: 草莓/猫/柠檬/VIBE — flat on desk + clear rear shadow
function placeLockRow(){
  const xs = [-0.22, -0.02, 0.18, 0.38];
  const picks = lockScatterTexList.length >= 4
    ? lockScatterTexList
    : stickerTexList;
  for (let i = 0; i < 4; i++){
    const pick = picks[i % picks.length];
    // temporarily bias spawn pool by pushing pick to front of stickerTexList usage
    const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
    const size = 0.20;
    const w = size * Math.min(1.25, Math.max(0.75, aspect));
    const h = size;
    const thickness = 0.02;
    const group = createFlatThickSticker(w, h, pick.tex, thickness);
    const sh = makeBlobShadow(size * 1.35);
    const shSoft = makeBlobShadow(size * 1.7);
    group.position.set(xs[i], topY + thickness * 0.5 + 0.01, 0.70);
    group.rotation.set(-Math.PI / 2, (i - 1.5) * 0.08, 0);
    scene.add(group); scene.add(sh); scene.add(shSoft);
    const s = {
      group, front: group.userData.front, shadow: sh, shadowSoft: shSoft,
      state: 'landed', age: 0, t: 0, size, thickness,
      spin: new THREE.Vector3(), willLand: true, floatDur: 1,
      origin: group.position.clone(), home: group.position.clone(),
      vel: new THREE.Vector3(), landPos: group.position.clone(),
      peakY: 0, driftX: 0, driftZ: 0, bounce: 0, ejectT: 0, pathT: 0,
      push: new THREE.Vector3(), pushVel: new THREE.Vector3(), breathe: 0,
    };
    stickers.push(s);
    syncStickerShadow(s);
  }
}
placeLockRow();

// only 2 gentle floaters (don't clutter desk read)
for (let i = 0; i < 2; i++){
  const s = spawnSticker(false);
  s.state = 'float';
  s.pathT = 0.35 + i * 0.2;
  s.peakY = 0.7 + i * 0.15;
  s.driftX = 0.8 + i * 0.3;
  const u = s.pathT;
  const slot = getSlotWorld();
  s.group.position.set(
    slot.x + s.driftX * u,
    topY + 0.55 + i * 0.25,
    slot.z + 0.2
  );
  s.group.rotation.set(-0.4, 0.3 * i, 0.1);
  s.home = s.group.position.clone();
  syncStickerShadow(s);
}
// slower continuous spit so desk stays readable
SPAWN_EVERY = reduceMotion ? 2.2 : 1.35;
console.info('[studio] analyst-pass LOCK-row + readable props pr=', renderer.getPixelRatio(), 'missing=', mount.missing, 'topY', tableTopY);
tick();

} catch (e) {
  showErr(e && e.message ? e.message : String(e));
}
