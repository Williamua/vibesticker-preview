<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="VibeSticker 贴纸工作室 · 漂浮贴纸与工作台"/>
<title>VibeSticker · 贴纸工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC; --apricot:#E8D9C8; --oak:#C4A882;
    --coral:#E87A6B; --ink:#2A221C; --mint:#7CB8A0; --lemon:#F0C94A; --berry:#D94A3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
    font-family:"DM Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none}
  .brand{position:absolute;top:22px;left:28px;display:flex;align-items:baseline;gap:10px}
  .brand .vibe{font-family:"Caveat",cursive;font-size:42px;line-height:1;color:var(--coral);
    font-weight:700;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
  .brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(42,34,28,.55);font-weight:600}
  .tag{position:absolute;top:28px;right:28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(42,34,28,.45);font-weight:600}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:13px;
    color:rgba(42,34,28,.55);letter-spacing:.04em;transition:opacity .35s ease}
  .hint em{font-style:normal;color:var(--coral);font-weight:600}
  .scroll-cue{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(42,34,28,.4);font-weight:600;
    transition:opacity .35s ease}
  .scroll-cue span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  #err{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    padding:24px;background:rgba(247,243,236,.95);color:var(--ink);font-size:15px;line-height:1.6;text-align:center}
  #err.show{display:flex}
  #status{position:fixed;left:12px;bottom:12px;z-index:6;font-size:10px;letter-spacing:.06em;
    color:rgba(42,34,28,.35);pointer-events:none;max-width:70vw}
  @media (max-width:640px){
    .brand .vibe{font-size:32px}
    .tag{font-size:9px;top:20px;right:16px}
    .brand{top:16px;left:16px}
    .hint{font-size:12px;bottom:16px;padding:0 16px}
    .scroll-cue{bottom:44px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    .scroll-cue span{animation:none}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><span class="vibe">VIBE</span><span class="sub">Sticker Studio</span></div>
  <div class="tag">Make Something Beautiful</div>
  <p class="scroll-cue" id="scrollCue"><span>↓ 滚轮看工作台</span></p>
  <p class="hint" id="hint">打印机持续吐贴纸 · <em>鼠标靠近</em>贴纸会躲开</p>
</div>
<div id="status"></div>
<div id="err" role="alert"></div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* —— palette / materials from MATERIALS.json + LIGHTING-SPEC —— */
const MAT = {
  bg: 0xF7F3EC,
  oak: 0xC4A882,
  coral: 0xE87A6B,
  brass: 0xC4A06A,
  plastic: 0xF5F2EC,
  ceramic: 0xD9D0C3,
  ink: 0x2A221C,
  ambient: 0xFFF5EB,
  key: 0xFFE4C8,
  fill: 0xFFF8F0,
  lampEmissive: 0xFFD2A6,
};

const ASSET = './studio/webgl-assets';
const GLB = {
  desk: `${ASSET}/glb/desk.glb`,
  cutter: `${ASSET}/glb/cutter.glb`,
  printer: `${ASSET}/glb/printer.glb`,
  book: `${ASSET}/glb/book.glb`,
  lamp: `${ASSET}/glb/lamp.glb`,
  plant: `${ASSET}/glb/plant.glb`,
};
const qaLight = new URLSearchParams(location.search).has('qa')
  || new URLSearchParams(location.search).get('light') === '1';
const viewMode = new URLSearchParams(location.search).get('view') || '';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const errEl = document.getElementById('err');
const hintEl = document.getElementById('hint');
const scrollCueEl = document.getElementById('scrollCue');
const statusEl = document.getElementById('status');
function showErr(msg){
  console.error(msg);
  errEl.textContent = '加载失败\n' + msg;
  errEl.classList.add('show');
}
function setStatus(t){ statusEl.textContent = t; }

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

/* ========== renderer: AA forced, warm tone ========== */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true, // forced on mobile too
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false,
});
if (!renderer.getContext()) throw new Error('WebGL 不可用');
const maxPR = 2;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPR));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(MAT.bg, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(MAT.bg);
scene.fog = new THREE.Fog(MAT.bg, 18, 36);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);

let scrollTarget = 0;
let scrollProg = 0;

const camHero = {
  pos: new THREE.Vector3(0.55, 2.35, 5.8),
  look: new THREE.Vector3(-0.8, 1.35, 0.2),
};
const camDesk = {
  pos: new THREE.Vector3(0.15, 3.55, 5.2),
  look: new THREE.Vector3(0.05, 1.15, 0.05),
};
const _camPos = new THREE.Vector3();
const _camLook = new THREE.Vector3();
function applyCamera(){
  _camPos.lerpVectors(camHero.pos, camDesk.pos, scrollProg);
  _camLook.lerpVectors(camHero.look, camDesk.look, scrollProg);
  camera.position.copy(_camPos);
  camera.lookAt(_camLook);
}
applyCamera();
if (viewMode === 'desk' || viewMode === 'workbench') {
  scrollTarget = 1; scrollProg = 1; applyCamera();
}

/* ========== lights (LIGHTING-SPEC) ========== */
const amb = new THREE.AmbientLight(MAT.ambient, 0.55);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xFFF8F0, 0xE8D9C8, 0.35);
scene.add(hemi);

/* Key: top-right, warm soft */
const key = new THREE.DirectionalLight(MAT.key, 1.45);
key.position.set(3.6, 8.2, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.00028;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4.5; // soft
scene.add(key);

/* Fill: front-left weak */
const fill = new THREE.DirectionalLight(MAT.fill, 0.38);
fill.position.set(-4.5, 3.5, 5.5);
scene.add(fill);

/* rim / bounce from below-front to open dark faces */
const bounce = new THREE.DirectionalLight(0xFFEBD8, 0.18);
bounce.position.set(0.5, -1.5, 3);
scene.add(bounce);

/* ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({
    color: MAT.bg, roughness: 0.88, metalness: 0.0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ========== post: SMAA ========== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const smaaPass = new SMAAPass(
  Math.floor(innerWidth * renderer.getPixelRatio()),
  Math.floor(innerHeight * renderer.getPixelRatio())
);
composer.addPass(smaaPass);
composer.addPass(new OutputPass());

/* ========== workbench root ========== */
const bench = new THREE.Group();
scene.add(bench);
const DESK_Y = 0.92;
const topY = DESK_Y + 0.11;
const loadedProps = Object.create(null);
let printerSlotLocal = new THREE.Vector3(0, 0.42, 0.62);
let printerGroup = null;
let lampGroup = null;
let tempDesk = null;

const texLoader = new THREE.TextureLoader();
function loadTex(url, { colorSpace = THREE.SRGBColorSpace, wrap = true, aniso = 8 } = {}){
  return new Promise((resolve, reject) => {
    texLoader.load(url, (t) => {
      t.colorSpace = colorSpace;
      if (wrap){
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
      }
      t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());
      t.needsUpdate = true;
      resolve(t);
    }, undefined, reject);
  });
}

function enableShadows(root){
  root.traverse((o) => {
    if (o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats){
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
          m.needsUpdate = true;
        }
      }
    }
  });
}

function fitProp(root, targetSize, yAlign = 'bottom'){
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = targetSize / maxDim;
  root.scale.setScalar(s);
  box.setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x;
  root.position.z -= c.z;
  if (yAlign === 'bottom'){
    root.position.y -= box.min.y;
  } else {
    root.position.y -= c.y;
  }
}

async function tryLoadGLB(url){
  const loader = new GLTFLoader();
  try {
    const gltf = await loader.loadAsync(url);
    return gltf.scene;
  } catch (e) {
    return null;
  }
}

/* —— temp oak desk ONLY for lighting QA (not a delivery prop set) —— */
async function buildTempLightDesk(){
  let albedo, normal, rough;
  try {
    albedo = await loadTex(`${ASSET}/materials/wood-oak/web/albedo.jpg`);
    normal = await loadTex(`${ASSET}/materials/wood-oak/web/normal.jpg`, { colorSpace: THREE.LinearSRGBColorSpace });
    rough = await loadTex(`${ASSET}/materials/wood-oak/web/roughness.jpg`, { colorSpace: THREE.NoColorSpace });
    albedo.repeat.set(1.6, 0.85);
    normal.repeat.copy(albedo.repeat);
    rough.repeat.copy(albedo.repeat);
  } catch (e) {
    console.warn('oak maps missing', e);
  }
  const mat = new THREE.MeshStandardMaterial({
    color: albedo ? 0xffffff : MAT.oak,
    map: albedo || null,
    normalMap: normal || null,
    roughnessMap: rough || null,
    roughness: 0.55,
    metalness: 0.0,
  });
  // single slab — lighting probe only; no machines
  const desk = new THREE.Mesh(new RoundedBoxGeometry(4.6, 0.18, 2.2, 8, 0.08), mat);
  desk.position.set(0, DESK_Y, 0);
  desk.castShadow = true;
  desk.receiveShadow = true;
  desk.name = 'temp-light-desk';
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(5.6, 3.1),
    new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0.13, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.12, 0.02, 0.18);
  const g = new THREE.Group();
  g.add(desk, shadow);
  g.visible = false; // shown only for qa / until real desk.glb
  return g;
}

async function mountProps(){
  tempDesk = await buildTempLightDesk();
  bench.add(tempDesk);

  const placements = {
    desk: { pos: [0, DESK_Y, 0], size: 4.6, yAlign: 'bottom' },
    cutter: { pos: [-1.55, topY, -0.15], size: 1.35 },
    printer: { pos: [-0.25, topY, -0.05], size: 1.2 },
    book: { pos: [1.15, topY, 0.15], size: 1.55, rotY: -0.18 },
    plant: { pos: [1.55, topY, -0.55], size: 0.55 },
    lamp: { pos: [1.85, topY, 0.55], size: 1.15 },
  };

  const results = {};
  await Promise.all(Object.keys(GLB).map(async (id) => {
    const sceneRoot = await tryLoadGLB(GLB[id]);
    results[id] = sceneRoot;
  }));

  let any = false;
  for (const id of Object.keys(GLB)){
    const root = results[id];
    if (!root) continue;
    any = true;
    const cfg = placements[id];
    const wrap = new THREE.Group();
    wrap.add(root);
    fitProp(root, cfg.size, cfg.yAlign || 'bottom');
    wrap.position.set(...cfg.pos);
    if (cfg.rotY) wrap.rotation.y = cfg.rotY;
    enableShadows(wrap);
    bench.add(wrap);
    loadedProps[id] = wrap;
    if (id === 'printer'){
      printerGroup = wrap;
      // heuristic slot near front of bbox
      const box = new THREE.Box3().setFromObject(root);
      printerSlotLocal = new THREE.Vector3(0, Math.max(0.2, (box.max.y - box.min.y) * 0.45), box.max.z * 0.9);
    }
    if (id === 'lamp'){
      lampGroup = wrap;
      const lampLight = new THREE.SpotLight(MAT.lampEmissive, 1.2, 5.5, 0.55, 0.5, 1.1);
      lampLight.position.set(-0.35, 0.7, 0);
      lampLight.target.position.set(-0.8, 0.05, 0.15);
      wrap.add(lampLight);
      wrap.add(lampLight.target);
      lampLight.castShadow = !isMobile;
      if (lampLight.castShadow){
        lampLight.shadow.mapSize.set(1024, 1024);
        lampLight.shadow.bias = -0.001;
      }
      const fillL = new THREE.PointLight(MAT.lampEmissive, 0.5, 3.0);
      fillL.position.set(-0.3, 0.55, 0.05);
      wrap.add(fillL);
      wrap.userData.light = lampLight;
      wrap.userData.fill = fillL;
    }
  }

  // show temp oak desk only if no desk.glb AND (qa mode OR we want light probe for scroll view)
  if (!loadedProps.desk){
    // Temp oak slab is lighting probe ONLY — hide on hero so LOCK-hero-float compare is fair.
    // Show when scrolled to workbench / ?view=desk|workbench (still not a delivery prop set).
    const wantDeskView = viewMode === 'desk' || viewMode === 'workbench' || qaLight;
    tempDesk.visible = wantDeskView;
    tempDesk.userData.lightingProbe = true;
  } else {
    tempDesk.visible = false;
  }

  const missing = Object.keys(GLB).filter((k) => !loadedProps[k]);
  setStatus(
    missing.length === 6
      ? '精模 GLB 未到齐 · 仅漂浮贴纸 + 暖光空台（临时木纹桌仅自检对光，非交付）'
      : `已载: ${Object.keys(loadedProps).join(', ') || '无'} · 仍缺: ${missing.join(', ')}`
  );
  return { any, missing };
}

function getSlotWorld(){
  const v = printerSlotLocal.clone();
  if (printerGroup){
    printerGroup.localToWorld(v);
    return v;
  }
  // fallback spawn matching hero-float narrative (mid-left above desk height)
  return new THREE.Vector3(-0.25, topY + 0.45, 0.55);
}

/* ========== soft paper stickers (thin box + bend, no billboard) ========== */
const stickerTexList = [];
async function loadStickerTextures(){
  // Official transparent albedo PNGs (STICKERS.md) — not greenscreen slices / canvas fakes
  const files = [
    'sticker-strawberry.png',
    'sticker-cat.png',
    'sticker-lemon.png',
    'sticker-peach.png',
    'sticker-vibe.png',
    'sticker-msb.png',
    'sticker-blossom.png',
    // peel / variant accents (lower weight via duplicates of primaries in spawn)
    'sticker-cat-peel.png',
    'sticker-blossom-peel.png',
    'sticker-strawberry-b.png',
    'sticker-blossom-b.png',
    'sticker-blossom-c.png',
    'sticker-blossom-d.png',
  ];
  const primary = files.slice(0, 7);
  const loads = primary.map((file) => new Promise((resolve) => {
    texLoader.load(`${ASSET}/stickers/${file}`, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const img = tex.image;
      resolve({ tex, w: img?.width || 512, h: img?.height || 512, file, primary: true });
    }, undefined, () => resolve(null));
  }));
  const variants = files.slice(7).map((file) => new Promise((resolve) => {
    texLoader.load(`${ASSET}/stickers/${file}`, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const img = tex.image;
      resolve({ tex, w: img?.width || 512, h: img?.height || 512, file, primary: false });
    }, undefined, () => resolve(null));
  }));
  const got = (await Promise.all([...loads, ...variants])).filter(Boolean);
  // weight primaries ~3x for spawn variety
  for (const g of got){
    stickerTexList.push(g);
    if (g.primary){ stickerTexList.push(g, g); }
  }
  if (!stickerTexList.length) throw new Error('贴纸 PNG 加载失败（STICKERS.md）');
  console.info('[studio] stickers loaded', got.map((g) => g.file));
}

function makeBackTex(){
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F5F2EC';
  ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const backTex = makeBackTex();

const stickers = [];
const MAX_STICKERS = isMobile ? 18 : 28;
const pointer = new THREE.Vector2(9999, 9999);
const pointerWorld = new THREE.Vector3(9999, 9999, 9999);
let pointerActive = false;

/** Thin paper slab: subdivided planes front/back + edge rim; bend via vertex displace */
function createPaperGeo(w, h, segX = 12, segY = 14){
  const geo = new THREE.PlaneGeometry(w, h, segX, segY);
  const pos = geo.attributes.position;
  const rest = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++){
    rest[i * 3] = pos.getX(i);
    rest[i * 3 + 1] = pos.getY(i);
    rest[i * 3 + 2] = pos.getZ(i);
  }
  geo.userData.rest = rest;
  geo.userData.w = w;
  geo.userData.h = h;
  return geo;
}

function bendPaper(geo, curlAmt, rollAmt, twist, time){
  const pos = geo.attributes.position;
  const rest = geo.userData.rest;
  const w = geo.userData.w, h = geo.userData.h;
  for (let i = 0; i < pos.count; i++){
    const x = rest[i * 3], y = rest[i * 3 + 1];
    const u = x / (w * 0.5);
    const v = y / (h * 0.5);
    const wave = Math.sin(v * Math.PI * 0.85 + time) * curlAmt;
    const edgeRoll = (u * u) * rollAmt * (0.55 + 0.45 * Math.sin(time * 0.7 + v));
    const twistZ = twist * u * v * 0.15;
    pos.setXYZ(i, x, y, wave + edgeRoll + twistZ);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

function spawnSticker(forceLanded = false){
  if (stickers.length >= MAX_STICKERS){
    let victim = stickers.find((s) => s.state === 'landed' && s.age > 4);
    if (!victim) victim = stickers[0];
    if (victim){
      scene.remove(victim.group);
      scene.remove(victim.shadow);
      stickers.splice(stickers.indexOf(victim), 1);
    }
  }
  const pick = stickerTexList[(Math.random() * stickerTexList.length) | 0];
  const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
  const size = 0.36 + Math.random() * 0.22;
  const w = size * Math.min(1.35, Math.max(0.7, aspect));
  const h = size;
  const thickness = 0.012; // ~1.2mm paper thickness in scene scale
  const geo = createPaperGeo(w, h, 12, 14);
  const frontMat = new THREE.MeshStandardMaterial({
    map: pick.tex,
    roughness: 0.75,
    metalness: 0.0,
    side: THREE.FrontSide,
    transparent: true,
    alphaTest: 0.35,
    depthWrite: true,
  });
  const backMat = new THREE.MeshStandardMaterial({
    map: backTex,
    color: 0xF5F2EC,
    roughness: 0.85,
    metalness: 0.0,
    side: THREE.BackSide,
  });
  const front = new THREE.Mesh(geo, frontMat);
  const back = new THREE.Mesh(geo.clone(), backMat);
  back.position.z = -thickness;
  front.castShadow = true;
  back.castShadow = true;

  // thickness = front/back separation; white paper edge reads when curling (no rigid rim boxes)
  const group = new THREE.Group();
  group.add(front, back);

  const slot = getSlotWorld();
  group.position.copy(slot);
  group.position.x += (Math.random() - 0.5) * 0.08;
  group.position.y += (Math.random() - 0.5) * 0.04;
  group.rotation.set(
    (Math.random() - 0.5) * 0.3,
    (Math.random() - 0.5) * 0.4,
    (Math.random() - 0.5) * 0.5
  );

  const sh = new THREE.Mesh(
    new THREE.CircleGeometry(size * 0.45, 24),
    new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0, depthWrite: false })
  );
  sh.rotation.x = -Math.PI / 2;
  sh.position.y = topY + 0.014;
  scene.add(sh);
  scene.add(group);

  const willLand = forceLanded || Math.random() < 0.42;
  const floatDur = 2.8 + Math.random() * 2.4;
  const driftX = 0.6 + Math.random() * 2.8;
  const driftZ = (Math.random() - 0.5) * 1.4;
  const peakY = 1.6 + Math.random() * 2.0;

  const s = {
    group, front, back, geo, shadow: sh,
    state: forceLanded ? 'landed' : 'eject',
    age: 0, t: 0, size,
    curl: 0.07 + Math.random() * 0.10,
    roll: 0.035 + Math.random() * 0.06,
    twist: (Math.random() - 0.5) * 0.8,
    spin: new THREE.Vector3(
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 1.2,
      (Math.random() - 0.5) * 0.8
    ),
    willLand, floatDur,
    origin: group.position.clone(),
    home: null,
    vel: new THREE.Vector3(0.7 + Math.random() * 0.55, 0.85 + Math.random() * 0.45, (Math.random() - 0.5) * 0.28),
    landPos: new THREE.Vector3(
      slot.x + driftX * (0.4 + Math.random() * 0.5),
      topY + 0.02,
      slot.z + driftZ + 0.5 + Math.random() * 0.9
    ),
    peakY, driftX, driftZ,
    bounce: 0, ejectT: 0, pathT: 0,
    push: new THREE.Vector3(),
    pushVel: new THREE.Vector3(),
    breathe: Math.random() * Math.PI * 2,
  };
  s.landPos.x = THREE.MathUtils.clamp(s.landPos.x, -2.0, 2.0);
  s.landPos.z = THREE.MathUtils.clamp(s.landPos.z, -0.9, 1.05);

  if (forceLanded){
    group.position.copy(s.landPos);
    group.position.x += (Math.random() - 0.5) * 0.8;
    group.position.z += (Math.random() - 0.5) * 0.5;
    group.position.x = THREE.MathUtils.clamp(group.position.x, -2.0, 1.9);
    group.position.z = THREE.MathUtils.clamp(group.position.z, -0.85, 1.0);
    group.rotation.set(-Math.PI / 2 + (Math.random() - 0.5) * 0.2, Math.random() * Math.PI, (Math.random() - 0.5) * 0.15);
    bendPaper(geo, s.curl * 0.4, s.roll * 0.5, s.twist * 0.3, Math.random() * 10);
    if (back.geometry !== geo) bendPaper(back.geometry, s.curl * 0.4, s.roll * 0.5, s.twist * 0.3, Math.random() * 10);
    sh.position.set(group.position.x, topY + 0.014, group.position.z);
    sh.material.opacity = 0.12;
    s.home = group.position.clone();
    s.landPos.copy(group.position);
  }
  stickers.push(s);
  return s;
}

/* ========== pointer / scroll ========== */
function onPointer(e){
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(x, y);
  pointerActive = true;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(pointer, camera);
  const hPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(topY + 0.9));
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(hPlane, hit)) pointerWorld.copy(hit);
  else pointerWorld.set(9999, 9999, 9999);
}
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerleave', () => { pointerActive = false; });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches[0]) onPointer(e.touches[0]);
}, { passive: true });

function onWheel(e){
  e.preventDefault();
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + e.deltaY * 0.00115, 0, 1);
}
canvas.addEventListener('wheel', onWheel, { passive: false });

let touchY0 = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches[0]) touchY0 = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { touchY0 = null; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!e.touches[0] || touchY0 == null) return;
  const dy = touchY0 - e.touches[0].clientY;
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + dy * 0.0025, 0, 1);
  touchY0 = e.touches[0].clientY;
}, { passive: true });

/* ========== animate ========== */
const clock = new THREE.Clock();
const _tmp = new THREE.Vector3();
const _push = new THREE.Vector3();
let spawnAcc = 0;
const SPAWN_EVERY = reduceMotion ? 1.15 : 0.45;

function updateSticker(s, dt){
  s.age += dt;
  s.t += dt;
  s.breathe += dt * 1.4;

  const curlPulse = s.curl * (0.85 + 0.15 * Math.sin(s.breathe));
  bendPaper(s.geo, curlPulse, s.roll, s.twist, s.t * 1.6);
  if (s.back.geometry !== s.geo){
    bendPaper(s.back.geometry, curlPulse, s.roll, s.twist, s.t * 1.6);
  }

  if (s.state === 'eject'){
    s.ejectT += dt;
    s.group.position.addScaledVector(s.vel, dt);
    s.vel.y += dt * 0.75;
    s.vel.x += dt * 0.35;
    s.group.rotation.x += s.spin.x * dt;
    s.group.rotation.y += s.spin.y * dt;
    s.group.rotation.z += s.spin.z * dt;
    if (s.ejectT > 0.35){
      s.state = 'float';
      s.pathT = 0;
      s.origin.copy(s.group.position);
      s.home = s.group.position.clone();
    }
  } else if (s.state === 'float'){
    s.pathT += dt / s.floatDur;
    const u = Math.min(1, s.pathT);
    const ease = 1 - Math.pow(1 - u, 2.2);
    const slotish = s.origin;
    const target = _tmp.set(
      slotish.x + s.driftX * ease,
      slotish.y + Math.sin(ease * Math.PI) * s.peakY * 0.9 + ease * 0.15,
      slotish.z + s.driftZ * ease + ease * 0.55
    );
    target.y += Math.sin(s.breathe) * 0.06;
    target.x += Math.sin(s.breathe * 0.7) * 0.04;
    s.home.copy(target);

    s.pushVel.multiplyScalar(0.88);
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y *= 0.35;
      const dist = _push.length();
      const radius = 1.35;
      if (dist < radius && dist > 0.001){
        const f = (1 - dist / radius);
        _push.normalize().multiplyScalar(f * f * 5.5);
        s.pushVel.addScaledVector(_push, dt * 18);
      }
    }
    _push.copy(s.home).sub(s.group.position).sub(s.push);
    s.pushVel.addScaledVector(_push, dt * 3.2);
    s.push.addScaledVector(s.pushVel, dt);
    s.push.multiplyScalar(0.96);
    s.group.position.copy(s.home).add(s.push);

    s.group.rotation.x += s.spin.x * dt * 0.45;
    s.group.rotation.y += s.spin.y * dt * 0.55;
    s.group.rotation.z += s.spin.z * dt * 0.4;

    s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
    s.shadow.material.opacity = THREE.MathUtils.clamp(0.04 + (2.2 - (s.group.position.y - topY)) * 0.02, 0.02, 0.08);

    if (u >= 1){
      if (s.willLand){
        s.state = 'falling';
        s.fallT = 0;
        s.fallFrom = s.group.position.clone();
      } else {
        s.state = 'fade';
        s.fadeT = 0;
      }
    }
  } else if (s.state === 'falling'){
    s.fallT = (s.fallT || 0) + dt;
    const dur = 0.85;
    const u = Math.min(1, s.fallT / dur);
    const ease = u * u * (3 - 2 * u);
    s.group.position.lerpVectors(s.fallFrom, s.landPos, ease);
    const flatX = -Math.PI / 2 + Math.sin(s.breathe) * 0.05;
    s.group.rotation.x += (flatX - s.group.rotation.x) * ease * 0.2;
    s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
    s.shadow.material.opacity = 0.04 + ease * 0.1;
    if (u >= 1){
      s.state = 'landed';
      s.bounce = 1;
      s.group.position.copy(s.landPos);
      s.home = s.landPos.clone();
    }
  } else if (s.state === 'landed'){
    if (s.bounce > 0){
      s.bounce -= dt * 2.2;
      const b = Math.max(0, s.bounce);
      s.group.position.y = s.landPos.y + Math.sin((1 - b) * Math.PI) * 0.08 * b;
      s.shadow.material.opacity = 0.14 - b * 0.04;
      s.shadow.scale.setScalar(1 + (1 - b) * 0.15);
    } else {
      s.group.position.y = s.landPos.y;
      s.shadow.material.opacity = 0.12;
    }
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y = 0;
      const dist = _push.length();
      if (dist < 0.9 && dist > 0.001){
        _push.normalize().multiplyScalar((1 - dist / 0.9) * 0.015);
        s.group.position.add(_push);
        s.group.position.y = s.landPos.y;
        s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
      }
    }
  } else if (s.state === 'fade'){
    s.fadeT = (s.fadeT || 0) + dt;
    s.group.position.y += dt * 0.4;
    s.group.position.x += dt * 0.5;
    const op = 1 - s.fadeT / 0.8;
    s.front.material.opacity = Math.max(0, op);
    s.back.material.opacity = Math.max(0, op);
    s.shadow.material.opacity *= 0.9;
    if (s.fadeT > 0.8){
      scene.remove(s.group);
      scene.remove(s.shadow);
      stickers.splice(stickers.indexOf(s), 1);
    }
  }
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.033, clock.getDelta());

  scrollProg += (scrollTarget - scrollProg) * (reduceMotion ? 1 : 0.08);
  applyCamera();
  if (tempDesk && tempDesk.userData.lightingProbe && !loadedProps.desk){
    tempDesk.visible = scrollProg > 0.35 || viewMode === 'desk' || viewMode === 'workbench';
  }
  scrollCueEl.style.opacity = String(1 - Math.min(1, scrollProg * 2.2));
  if (scrollProg > 0.55){
    hintEl.innerHTML = loadedProps.desk
      ? '工作台 · 切割机 / 打印机 / 贴纸本 / 台灯 · <em>滚轮</em>可回到首屏'
      : '工作台精模待接入 · <em>滚轮</em>可回到首屏（当前仅对光用临时木纹桌）';
  } else {
    hintEl.innerHTML = '贴纸持续飘出 · <em>鼠标靠近</em>贴纸会躲开';
  }

  spawnAcc += dt;
  if (spawnAcc >= SPAWN_EVERY){
    spawnAcc = 0;
    spawnSticker(false);
  }

  if (printerGroup){
    printerGroup.position.y = topY + Math.sin(clock.elapsedTime * 1.2) * 0.006;
  }
  if (lampGroup && lampGroup.userData.light){
    const pulse = 1.15 + Math.sin(clock.elapsedTime * 1.5) * 0.2;
    lampGroup.userData.light.intensity = pulse;
    if (lampGroup.userData.fill) lampGroup.userData.fill.intensity = 0.45 + Math.sin(clock.elapsedTime * 1.5) * 0.08;
  }
  if (loadedProps.plant){
    loadedProps.plant.rotation.z = Math.sin(clock.elapsedTime * 0.8) * 0.02;
  }

  for (let i = stickers.length - 1; i >= 0; i--){
    updateSticker(stickers[i], dt);
  }

  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPR));
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  smaaPass.setSize(
    Math.floor(innerWidth * renderer.getPixelRatio()),
    Math.floor(innerHeight * renderer.getPixelRatio())
  );
});

/* boot */
await loadStickerTextures();
const mount = await mountProps();
for (let i = 0; i < 6; i++) spawnSticker(true);
for (let i = 0; i < 5; i++){
  const s = spawnSticker(false);
  s.state = 'float';
  s.pathT = 0.2 + Math.random() * 0.55;
  s.age = s.pathT * s.floatDur;
  const u = s.pathT;
  const slot = getSlotWorld();
  s.group.position.set(
    slot.x + s.driftX * u,
    slot.y + Math.sin(u * Math.PI) * s.peakY * 0.85 + u * 0.2,
    slot.z + s.driftZ * u + u * 0.45
  );
  s.home = s.group.position.clone();
}
console.info('[studio] AA=MSAA+SMAA pr=', renderer.getPixelRatio(), 'missing=', mount.missing);
tick();

} catch (e) {
  showErr(e && e.message ? e.message : String(e));
}
</script>
</body>
