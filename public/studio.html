<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="VibeSticker 贴纸工作室 · 漂浮贴纸与工作台"/>
<title>VibeSticker · 贴纸工作室</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC; --apricot:#E8D9C8; --oak:#C4A882;
    --coral:#E87A6B; --ink:#2A221C; --mint:#7CB8A0; --lemon:#F0C94A; --berry:#D94A3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
    font-family:"DM Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none}
  .brand{position:absolute;top:22px;left:28px;display:flex;align-items:baseline;gap:10px}
  .brand .vibe{font-family:"Caveat",cursive;font-size:42px;line-height:1;color:var(--coral);
    font-weight:700;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
  .brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(42,34,28,.55);font-weight:600}
  .tag{position:absolute;top:28px;right:28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(42,34,28,.45);font-weight:600}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:13px;
    color:rgba(42,34,28,.55);letter-spacing:.04em;transition:opacity .35s ease}
  .hint em{font-style:normal;color:var(--coral);font-weight:600}
  .scroll-cue{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(42,34,28,.4);font-weight:600;
    transition:opacity .35s ease}
  .scroll-cue span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  #err{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    padding:24px;background:rgba(247,243,236,.95);color:var(--ink);font-size:15px;line-height:1.6;text-align:center}
  #err.show{display:flex}
  #status{position:fixed;left:12px;bottom:12px;z-index:6;font-size:10px;letter-spacing:.06em;
    color:rgba(42,34,28,.35);pointer-events:none;max-width:70vw}
  @media (max-width:640px){
    .brand .vibe{font-size:32px}
    .tag{font-size:9px;top:20px;right:16px}
    .brand{top:16px;left:16px}
    .hint{font-size:12px;bottom:16px;padding:0 16px}
    .scroll-cue{bottom:44px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    .scroll-cue span{animation:none}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><span class="vibe">VIBE</span><span class="sub">Sticker Studio</span></div>
  <div class="tag">Make Something Beautiful</div>
  <p class="scroll-cue" id="scrollCue"><span>↓ 滚轮看工作台</span></p>
  <p class="hint" id="hint">打印机持续吐贴纸 · <em>鼠标靠近</em>贴纸会躲开</p>
</div>
<div id="status"></div>
<div id="err" role="alert"></div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* —— palette / materials from MATERIALS.json + LIGHTING-SPEC —— */
const MAT = {
  bg: 0xF7F3EC,
  oak: 0xC4A882,
  coral: 0xE87A6B,
  brass: 0xC4A06A,
  plastic: 0xF5F2EC,
  ceramic: 0xD9D0C3,
  ink: 0x2A221C,
  ambient: 0xFFF5EB,
  key: 0xFFE4C8,
  fill: 0xFFF8F0,
  lampEmissive: 0xFFD2A6,
};

const ASSET = './studio/webgl-assets';
const GLB = {
  desk: `${ASSET}/glb/desk.glb`,
  laptop: `${ASSET}/glb/laptop.glb`,
  printer: `${ASSET}/glb/printer.glb`,
  book: `${ASSET}/glb/book.glb`,
  lamp: `${ASSET}/glb/lamp.glb`,
  plant: `${ASSET}/glb/plant.glb`,
};
const HDRI_URL = `${ASSET}/hdri/studio-09-4000k-1k.hdr`;
const STICKER_MANIFEST = `${ASSET}/stickers/manifest.json`;
const STICKER_API = '/api/studio-stickers';
const DESK_SCALE = 0.82; // LAYOUT-CAMERA-SPEC: long edge ~2.2, height ~0.66

const qaLight = new URLSearchParams(location.search).has('qa')
  || new URLSearchParams(location.search).get('light') === '1';
const viewMode = new URLSearchParams(location.search).get('view') || '';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const errEl = document.getElementById('err');
const hintEl = document.getElementById('hint');
const scrollCueEl = document.getElementById('scrollCue');
const statusEl = document.getElementById('status');
function showErr(msg){
  console.error(msg);
  errEl.textContent = '加载失败\n' + msg;
  errEl.classList.add('show');
}
function setStatus(t){ statusEl.textContent = t; }
// Soften/hide debug HUD for review captures (keep logs in console)
const hideHud = viewMode === 'desk' || viewMode === 'workbench' || qaLight || new URLSearchParams(location.search).has('clean');
if (hideHud){
  statusEl.style.opacity = '0';
  statusEl.style.pointerEvents = 'none';
  hintEl.style.opacity = '0';
  hintEl.style.pointerEvents = 'none';
  scrollCueEl.style.opacity = '0';
  scrollCueEl.style.pointerEvents = 'none';
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

/* ========== renderer: AA forced, warm tone ========== */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true, // forced on mobile too
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false,
});
if (!renderer.getContext()) throw new Error('WebGL 不可用');
const maxPR = 2;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPR));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(MAT.bg, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(MAT.bg);
scene.fog = null; // LOCK infinite warm cream #F7F3EC — no gray horizon

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 40);

let scrollTarget = 0;
let scrollProg = 0;

function orbitCam(look, dist, elevDeg, azimDeg){
  const el = elevDeg * Math.PI / 180;
  const az = azimDeg * Math.PI / 180;
  const x = look.x + dist * Math.cos(el) * Math.sin(az);
  const y = look.y + dist * Math.sin(el);
  const z = look.z + dist * Math.cos(el) * Math.cos(az);
  return { pos: new THREE.Vector3(x, y, z), look: look.clone() };
}
// LAYOUT-CAMERA-SPEC defaults (refined after desk mounts)
let tableTopY = 0.66;
let camLook = new THREE.Vector3(0, tableTopY, -0.05);
let camDesk = orbitCam(camLook, 1.9, 14, -40);
// Hero: same orbit, slightly farther / higher for floating stickers over desk
let camHero = orbitCam(new THREE.Vector3(0, tableTopY + 0.35, 0.15), 4.2, 22, -38);
function refreshCameras(){
  // LOCK: across-the-desk intimacy — elev 12–15°, push in (not shelf top-down)
  camLook.set(0.08, tableTopY + 0.05, 0.06);
  camDesk = orbitCam(camLook, 1.72, 13, -40);
  camHero = orbitCam(new THREE.Vector3(0.08, tableTopY + 0.30, 0.08), 2.65, 13, -40);
}
const _camPos = new THREE.Vector3();
const _camLook = new THREE.Vector3();
function applyCamera(){
  _camPos.lerpVectors(camHero.pos, camDesk.pos, scrollProg);
  _camLook.lerpVectors(camHero.look, camDesk.look, scrollProg);
  camera.position.copy(_camPos);
  camera.lookAt(_camLook);
}
applyCamera();
if (viewMode === 'desk' || viewMode === 'workbench') {
  scrollTarget = 1; scrollProg = 1; applyCamera();
}

/* ========== lights (LIGHTING-SPEC) ========== */
const amb = new THREE.AmbientLight(MAT.ambient, 0.78);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xFFF6EC, 0xEADCC8, 0.48);
scene.add(hemi);

/* Key: top-right, warm soft */
const key = new THREE.DirectionalLight(0xFFDFC0, 0.48);
key.position.set(2.4, 7.5, 1.8); // upper-right 4000K
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.camera.left = -2.4;
key.shadow.camera.right = 2.4;
key.shadow.camera.top = 2.4;
key.shadow.camera.bottom = -2.4;
key.shadow.bias = -0.00012;
key.shadow.normalBias = 0.025;
key.shadow.radius = 6.5; // soft warm contact
scene.add(key);
key.target.position.set(0, 0.6, 0.1);
scene.add(key.target);

/* Fill: front-left warm */
const fill = new THREE.DirectionalLight(0xFFE8D2, 0.42);
fill.position.set(-3.2, 4.0, 4.5);
scene.add(fill);

/* rim / bounce */
const bounce = new THREE.DirectionalLight(0xFFE6CC, 0.22);
bounce.position.set(0.2, -0.8, 2.5);
scene.add(bounce);

/* ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshBasicMaterial({ color: 0xF7F3EC }) // seamless warm cream, no lit horizon split
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.receiveShadow = false;
ground.castShadow = false;
ground.visible = false; // pure cream void — no wall/floor split
scene.add(ground);

/* ========== post: SMAA ========== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const smaaPass = new SMAAPass(
  Math.floor(innerWidth * renderer.getPixelRatio()),
  Math.floor(innerHeight * renderer.getPixelRatio())
);
composer.addPass(smaaPass);
composer.addPass(new OutputPass());

/* ========== workbench root ========== */
const bench = new THREE.Group();
scene.add(bench);
let DESK_Y = 0.66;
let topY = 0.66;
const loadedProps = Object.create(null);
let printerSlotLocal = new THREE.Vector3(0, 0.15, 0.35);
let printerGroup = null;
let lampGroup = null;
let bookGroup = null;
let tempDesk = null;
let envReady = false;

const texLoader = new THREE.TextureLoader();
function loadTex(url, { colorSpace = THREE.SRGBColorSpace, wrap = true, aniso = 8 } = {}){
  return new Promise((resolve, reject) => {
    texLoader.load(url, (t) => {
      t.colorSpace = colorSpace;
      if (wrap){
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
      }
      t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());
      t.needsUpdate = true;
      resolve(t);
    }, undefined, reject);
  });
}

function enableShadows(root){
  root.traverse((o) => {
    if (o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats){
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
          m.needsUpdate = true;
        }
      }
    }
  });
}

function fitProp(root, targetSize, yAlign = 'bottom'){
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = targetSize / maxDim;
  root.scale.setScalar(s);
  box.setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x;
  root.position.z -= c.z;
  if (yAlign === 'bottom'){
    root.position.y -= box.min.y;
  } else {
    root.position.y -= c.y;
  }
}

async function tryLoadGLB(url){
  const loader = new GLTFLoader();
  try {
    const gltf = await loader.loadAsync(url);
    return gltf.scene;
  } catch (e) {
    return null;
  }
}

async function loadStudioHDRI(){
  try {
    const tex = await new RGBELoader().loadAsync(HDRI_URL);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envMap = pmrem.fromEquirectangular(tex).texture;
    scene.environment = envMap;
    if ('environmentIntensity' in scene) scene.environmentIntensity = 1.0; // IBL 0.9–1.1
    scene.background = new THREE.Color(0xF7F3EC); // infinite warm cream
    // three@0.160: no environmentRotation — key/fill place main bright upper-right (~4000K amber)
    tex.dispose(); pmrem.dispose();
    amb.intensity = 0.32;
    amb.color.setHex(0xFFF2E4);
    hemi.intensity = 0.28;
    hemi.color.setHex(0xFFE8D0);
    hemi.groundColor.setHex(0xE8D5C0);
    key.color.setHex(0xFFDFC0); // ~4000K micro-amber
    key.intensity = 0.55;
    key.position.set(2.4, 7.5, 1.8); // upper-right bright zone
    key.target.position.set(0.15, tableTopY, 0.05);
    key.castShadow = true;
    key.shadow.radius = 5.5; // soft but readable desk contact
    key.shadow.camera.left = -2.8;
    key.shadow.camera.right = 2.8;
    key.shadow.camera.top = 2.8;
    key.shadow.camera.bottom = -2.8;
    key.shadow.bias = -0.0001;
    fill.color.setHex(0xFFE6CC);
    fill.intensity = 0.28;
    fill.position.set(-2.0, 4.5, 3.5);
    bounce.color.setHex(0xFFD8B0);
    bounce.intensity = 0.14;
    renderer.toneMappingExposure = 1.05; // within 0.9–1.1
    envReady = true;
    return true;
  } catch (e) {
    console.warn('HDRI fail', e);
    return false;
  }
}

/* —— temp oak desk ONLY for lighting QA (not a delivery prop set) —— */
async function buildTempLightDesk(){
  let albedo, normal, rough;
  try {
    albedo = await loadTex(`${ASSET}/materials/wood-oak/web/albedo.jpg`);
    normal = await loadTex(`${ASSET}/materials/wood-oak/web/normal.jpg`, { colorSpace: THREE.LinearSRGBColorSpace });
    rough = await loadTex(`${ASSET}/materials/wood-oak/web/roughness.jpg`, { colorSpace: THREE.NoColorSpace });
    albedo.repeat.set(1.6, 0.85);
    normal.repeat.copy(albedo.repeat);
    rough.repeat.copy(albedo.repeat);
  } catch (e) {
    console.warn('oak maps missing', e);
  }
  const mat = new THREE.MeshStandardMaterial({
    color: albedo ? 0xffffff : MAT.oak,
    map: albedo || null,
    normalMap: normal || null,
    roughnessMap: rough || null,
    roughness: 0.55,
    metalness: 0.0,
  });
  // single slab — lighting probe only; no machines
  const desk = new THREE.Mesh(new RoundedBoxGeometry(4.6, 0.18, 2.2, 8, 0.08), mat);
  desk.position.set(0, DESK_Y, 0);
  desk.castShadow = true;
  desk.receiveShadow = true;
  desk.name = 'temp-light-desk';
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(5.6, 3.1),
    new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0.13, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.12, 0.02, 0.18);
  const g = new THREE.Group();
  g.add(desk, shadow);
  g.visible = false; // shown only for qa / until real desk.glb
  return g;
}

async function mountProps(){
  tempDesk = await buildTempLightDesk();
  bench.add(tempDesk);

  // LAYOUT-CAMERA-SPEC §3 — local tabletop coords (origin = desk top center, Y=0 on top)
  // World = deskWrap + (local * deskScale already applied via desk); props parented to deskTop
  const deskTop = new THREE.Group();
  deskTop.name = 'deskTop';
  const localPlace = {
    // LAYOUT-CAMERA-SPEC §3 — accept mesh limits, tune for readability
    laptop: { pos: [-0.55, 0, 0.10], size: 0.32, rotY: 0.18 },
    printer: { pos: [-0.22, 0, 0.08], size: 0.15, rotY: 0 }, // LOCK small thermal
    book: { pos: [0.30, 0, 0.0], size: 0.50, rotY: -0.12 },
    plant: { pos: [0.68, 0, -0.12], size: 0.26 },
    lamp: { pos: [0.88, 0, 0.10], size: 0.40, rotY: -1.15 }, // shorter; shade → book
  };

  const results = {};
  await Promise.all(Object.keys(GLB).map(async (id) => {
    results[id] = await tryLoadGLB(GLB[id]);
  }));

  let any = false;
  // Desk first: full mesh WITH legs, uniform scale 0.82
  if (results.desk){
    any = true;
    const root = results.desk;
    const wrap = new THREE.Group();
    wrap.add(root);
    root.rotation.y = Math.PI / 2; // long oval along +X (LAYOUT)
    root.scale.setScalar(DESK_SCALE);
    root.traverse((o)=>{
      if(!o.isMesh||!o.material) return;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      const rebuilt=[];
      for(const m of mats){
        const map = m.map || null;
        if (map){ map.colorSpace = THREE.SRGBColorSpace; map.needsUpdate = true; }
        const nm = new THREE.MeshStandardMaterial({
          map, color: 0xE8D2B0, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.0,
        });
        if (m.normalMap){ nm.normalMap = m.normalMap; nm.normalScale = new THREE.Vector2(0.1, 0.1); }
        if (m.aoMap){ nm.aoMap = m.aoMap; nm.aoMapIntensity = 0.15; }
        nm.needsUpdate = true;
        rebuilt.push(nm);
      }
      o.material = rebuilt.length===1 ? rebuilt[0] : rebuilt;
    });
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    root.position.x -= c.x;
    root.position.z -= c.z;
    root.position.y -= box.min.y; // feet on ground
    const box2 = new THREE.Box3().setFromObject(wrap);
    tableTopY = box2.max.y;
    topY = tableTopY;
    DESK_Y = tableTopY;
    deskTop.position.set(0, tableTopY, 0);
    wrap.add(deskTop);
    // soft ground contact under table
    const foot = new THREE.Mesh(
      new THREE.PlaneGeometry((box2.max.x-box2.min.x)+0.25, (box2.max.z-box2.min.z)+0.2),
      new THREE.MeshBasicMaterial({ color: 0x3A2A1C, transparent: true, opacity: 0.10, depthWrite: false })
    );
    foot.rotation.x = -Math.PI/2;
    foot.position.set(0.02, 0.005, 0.03);
    wrap.add(foot);
    // Warm oak multiply + legs cast soft floor contact (not suspended)
    wrap.traverse((o)=>{
      if (!o.isMesh || !o.material) return;
      o.castShadow = false; // foot blob = leg contact; avoid floor/horizon split
      o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats){
        if (!m || !m.color) continue;
        m.color.lerp(new THREE.Color(0xE8C9A0), 0.2);
        m.roughness = 1.0; m.metalness = 0; m.envMapIntensity = 0;
        m.needsUpdate = true;
      }
    });
    bench.add(wrap);
    loadedProps.desk = wrap;
    refreshCameras();
    applyCamera();
  }

  for (const id of ['laptop','printer','book','plant','lamp']){
    const root = results[id];
    if (!root) continue;
    any = true;
    const cfg = localPlace[id];
    const wrap = new THREE.Group();
    wrap.add(root);
    fitProp(root, cfg.size, 'bottom');
    wrap.position.set(cfg.pos[0], 0, cfg.pos[2]);
    if (cfg.rotY) wrap.rotation.y = cfg.rotY;
    enableShadows(wrap);
    deskTop.add(wrap);
    loadedProps[id] = wrap;
    if (id === 'laptop'){
      // Single lid mesh: Box with per-face materials (screen on +Z only). Avoid DoubleSide plane ghosts.
      const screenTex = (()=>{
        const c=document.createElement('canvas'); c.width=768; c.height=480;
        const g=c.getContext('2d');
        g.fillStyle='#2B2D31'; g.fillRect(0,0,768,480);
        const pad=40;
        const grd=g.createLinearGradient(0,pad,0,480-pad);
        grd.addColorStop(0,'#F7D7A4'); grd.addColorStop(0.4,'#E07A5F');
        grd.addColorStop(0.72,'#6A4E7A'); grd.addColorStop(1,'#1C1830');
        g.fillStyle=grd; g.fillRect(pad,pad,768-pad*2,480-pad*2);
        const sun=g.createRadialGradient(520,150,8,520,150,110);
        sun.addColorStop(0,'rgba(255,250,220,1)'); sun.addColorStop(1,'rgba(255,190,120,0)');
        g.fillStyle=sun; g.beginPath(); g.arc(520,150,110,0,Math.PI*2); g.fill();
        g.fillStyle='rgba(35,55,95,0.4)'; g.fillRect(pad,340,768-pad*2,480-pad-340);
        const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; return tex;
      })();
      while (wrap.children.length) wrap.remove(wrap.children[0]);
      wrap.scale.set(1,1,1);
      const silver = new THREE.MeshStandardMaterial({ color: 0xC9CDD2, metalness: 0.7, roughness: 0.36 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x3A3C42, metalness: 0.35, roughness: 0.55 });

/** Open Steno: cream pages/cover edges, dark spine only — no black card frame. */
function decorateSketchbookPages(){
  if (!bookGroup) return;
  const pool = (lockScatterTexList.length ? lockScatterTexList : stickerTexList);
  if (!pool.length) return;

  bookGroup.updateWorldMatrix(true, true);
  const inv = new THREE.Matrix4().copy(bookGroup.matrixWorld).invert();
  const bb = new THREE.Box3().setFromObject(bookGroup);
  const loc = bb.clone().applyMatrix4(inv);
  const midX = (loc.min.x + loc.max.x) * 0.5;
  const midZ = (loc.min.z + loc.max.z) * 0.5;
  const pageW = Math.max(0.09, (loc.max.x - loc.min.x) * 0.46);
  const pageD = Math.max(0.12, (loc.max.z - loc.min.z) * 0.80);
  const baseY = loc.max.y + 0.001;

  const spread = new THREE.Group();
  spread.name = 'bookOpenSpread';

  const cream = new THREE.MeshStandardMaterial({
    color: 0xF7F2E8, roughness: 0.9, metalness: 0.0,
  });
  const spineMat = new THREE.MeshStandardMaterial({
    color: 0x5A4E42, roughness: 0.78, metalness: 0.04,
  });

  // Cream cover bed (NOT black card) under pages
  const cover = new THREE.Mesh(
    new THREE.BoxGeometry(pageW * 2.12, 0.010, pageD * 1.05),
    cream
  );
  cover.position.set(midX, baseY + 0.005, midZ);
  cover.castShadow = true; cover.receiveShadow = true;

  // Dark spine only
  const spine = new THREE.Mesh(
    new THREE.BoxGeometry(Math.max(0.018, pageW * 0.12), 0.022, pageD * 0.94),
    spineMat
  );
  spine.position.set(midX, baseY + 0.014, midZ);
  spine.castShadow = true;

  const pageT = 0.0038;
  const leftPage = new THREE.Mesh(new THREE.BoxGeometry(pageW, pageT, pageD), cream.clone());
  const rightPage = new THREE.Mesh(new THREE.BoxGeometry(pageW, pageT, pageD), cream.clone());
  leftPage.position.set(midX - pageW * 0.54, baseY + 0.016, midZ);
  rightPage.position.set(midX + pageW * 0.54, baseY + 0.016, midZ);
  leftPage.rotation.z = 0.05;
  rightPage.rotation.z = -0.05;
  leftPage.castShadow = true; rightPage.castShadow = true;
  leftPage.receiveShadow = true; rightPage.receiveShadow = true;

  const pageBlobL = makeBlobShadow(pageW * 0.95);
  pageBlobL.position.set(midX - pageW * 0.5, baseY + 0.011, midZ + 0.006);
  pageBlobL.material.opacity = 0.16;
  const pageBlobR = makeBlobShadow(pageW * 0.95);
  pageBlobR.position.set(midX + pageW * 0.5, baseY + 0.011, midZ + 0.006);
  pageBlobR.material.opacity = 0.16;

  spread.add(cover, spine, leftPage, rightPage, pageBlobL, pageBlobR);

  const stickY = baseY + 0.022;
  const slots = [
    [midX - pageW * 0.70, stickY, midZ - pageD * 0.20],
    [midX - pageW * 0.50, stickY, midZ + pageD * 0.08],
    [midX - pageW * 0.66, stickY, midZ + pageD * 0.28],
    [midX + pageW * 0.46, stickY, midZ - pageD * 0.16],
    [midX + pageW * 0.66, stickY, midZ + pageD * 0.02],
    [midX + pageW * 0.50, stickY, midZ + pageD * 0.26],
  ];
  for (let i = 0; i < slots.length; i++){
    const pick = pool[i % pool.length];
    const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
    const h = Math.min(pageD, pageW) * 0.26;
    const w = h * Math.min(1.15, Math.max(0.75, aspect));
    const slab = createFlatThickSticker(w, h, pick.tex, 0.004);
    slab.rotation.set(-Math.PI / 2, (i % 2 ? 0.06 : -0.05), 0);
    slab.position.set(slots[i][0], slots[i][1], slots[i][2]);
    const blob = makeBlobShadow(Math.max(w,h) * 0.85);
    blob.position.set(slots[i][0] + 0.004, baseY + 0.013, slots[i][2] + 0.003);
    blob.material.opacity = 0.14;
    spread.add(slab, blob);
  }
  bookGroup.add(spread);
}

const stickerTexList = [];

async function resolveStickerFileList(){
  try {
    const r = await fetch(STICKER_API, { cache: 'no-store' });
    if (r.ok){
      const j = await r.json();
      if (Array.isArray(j.items) && j.items.length){
        return j.items.map((it) => ({ file: it.file, url: it.url }));
      }
      if (Array.isArray(j.files) && j.files.length){
        return j.files.map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
      }
    }
  } catch (e) { console.warn('sticker API', e); }
  try {
    const r = await fetch(STICKER_MANIFEST, { cache: 'no-store' });
    if (r.ok){
      const j = await r.json();
      const excl = new Set(j.exclude || []);
      const re = new RegExp(j.pattern || '^sticker-.*\\.png$', 'i');
      return (j.include || []).filter((f) => !excl.has(f) && re.test(f))
        .map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
    }
  } catch (e) { console.warn('sticker manifest', e); }
  return ['sticker-strawberry.png','sticker-cat.png','sticker-lemon.png','sticker-peach.png','sticker-vibe.png','sticker-msb.png','sticker-blossom.png']
    .map((f) => ({ file: f, url: `${ASSET}/stickers/${f}` }));
}

async function loadStickerTextures(){
  const entries = await resolveStickerFileList();
  const loads = entries.map(({ file, url }) => new Promise((resolve) => {
    texLoader.load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const img = tex.image;
      resolve({ tex, w: img?.width || 512, h: img?.height || 512, file,
        primary: !/-(b|c|d|peel)\.png$/i.test(file) });
    }, undefined, () => resolve(null));
  }));
  const got = (await Promise.all(loads)).filter(Boolean);
  for (const g of got){
    stickerTexList.push(g);
    if (g.primary) stickerTexList.push(g, g);
  }
  if (!stickerTexList.length) throw new Error('贴纸 PNG 加载失败');
  console.info('[studio] stickers hot-plug', got.map((g) => g.file));
}

function makeSoftBlobTex(){

/** Radial alpha silhouette → THREE.Shape (die-cut). Falls back to rounded rect. */
function shapeFromAlpha(img, wWorld, hWorld){
  const N = 64;
  const c = document.createElement('canvas');
  c.width = N; c.height = N;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0,0,N,N);
  if (img) ctx.drawImage(img, 0, 0, N, N);
  const data = ctx.getImageData(0,0,N,N).data;
  const solid = (x,y)=>{
    if (x<0||y<0||x>=N||y>=N) return false;
    return data[(y*N+x)*4+3] > 28;
  };
  let any=false;
  for (let i=3;i<data.length;i+=4){ if (data[i]>28){ any=true; break; } }
  const shape = new THREE.Shape();
  if (!any){
    const rx = wWorld*0.46, ry = hWorld*0.46, r = Math.min(rx,ry)*0.18;
    shape.moveTo(-rx+r, -ry);
    shape.lineTo(rx-r, -ry); shape.quadraticCurveTo(rx,-ry,rx,-ry+r);
    shape.lineTo(rx, ry-r); shape.quadraticCurveTo(rx,ry,rx-r,ry);
    shape.lineTo(-rx+r, ry); shape.quadraticCurveTo(-rx,ry,-rx,ry-r);
    shape.lineTo(-rx, -ry+r); shape.quadraticCurveTo(-rx,-ry,-rx+r,-ry);
    return shape;
  }
  const cx = N/2, cy = N/2, steps = 72;
  for (let i=0;i<steps;i++){
    const ang = (i/steps)*Math.PI*2;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let rMax = 1;
    for (let t=1; t<N*0.72; t+=0.35){
      const x = Math.round(cx + dx*t);
      const y = Math.round(cy + dy*t);
      if (x<0||y<0||x>=N||y>=N) break;
      if (solid(x,y)) rMax = t;
    }
    // slight pad so white PVC edge peeks
    rMax = Math.min(N*0.49, rMax + 0.6);
    const px = ((cx + dx*rMax)/N - 0.5) * wWorld;
    const py = (0.5 - (cy + dy*rMax)/N) * hWorld;
    if (i===0) shape.moveTo(px, py);
    else shape.lineTo(px, py);
  }
  shape.closePath();
  return shape;
}

/**
 * Die-cut flat-thick PVC from transparent PNG — NO white rectangle board.
 * Stack of alpha-tested planes (cream edge layers + full-color front) follows die-cut.
 */
const _pvcEdgeTexCache = new WeakMap();
function pvcEdgeTexFrom(tex){
  if (!tex || !tex.image) return tex;
  if (_pvcEdgeTexCache.has(tex)) return _pvcEdgeTexCache.get(tex);
  const img = tex.image;
  const w = img.width || img.videoWidth || 256;
  const h = img.height || img.videoHeight || 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  try { ctx.drawImage(img, 0, 0, w, h); } catch(e){ return tex; }
  const id = ctx.getImageData(0,0,w,h);
  const d = id.data;
  for (let i=0;i<d.length;i+=4){
    if (d[i+3] > 40){ d[i]=252; d[i+1]=250; d[i+2]=246; } // clean bright white edge, not grey
  }
  ctx.putImageData(id,0,0);
  const out = new THREE.CanvasTexture(c);
  out.colorSpace = THREE.SRGBColorSpace;
  out.flipY = tex.flipY;
  _pvcEdgeTexCache.set(tex, out);
  return out;
}

function createFlatThickSticker(w, h, tex, thickness = 0.004){
  const group = new THREE.Group();
  const edgeTex = pvcEdgeTexFrom(tex);
  const layers = Math.max(3, Math.min(5, Math.round(thickness / 0.0022)));
  let front = null;
  for (let i = 0; i < layers; i++){
    const isFront = (i === layers - 1);
    const mat = new THREE.MeshStandardMaterial({
      map: isFront ? tex : edgeTex,
      color: 0xffffff,
      roughness: isFront ? 0.58 : 0.86,
      metalness: 0.0,
      transparent: true,
      alphaTest: 0.42,
      depthWrite: true,
      side: THREE.DoubleSide,
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.z = -thickness * 0.5 + (i / Math.max(1, layers - 1)) * thickness;
    m.castShadow = true;
    m.receiveShadow = true;
    group.add(m);
    if (isFront) front = m;
  }
  // Die-cut local drop shade (alpha-shaped)
  const backMat = new THREE.MeshBasicMaterial({
    map: edgeTex,
    color: 0x1a1008,
    transparent: true,
    opacity: 0.48,
    alphaTest: 0.22,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const backShade = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.08, h * 1.08), backMat);
  backShade.position.set(0.014 * Math.max(w,h), -0.016 * Math.max(w,h), -(thickness * 0.5 + 0.0035));
  backShade.renderOrder = 0;
  group.add(backShade);
  group.userData.front = front;
  group.userData.backShade = backShade;
  group.userData.thickness = thickness;
  group.userData.footprint = Math.max(w, h);
  return group;
}

/** Short warm contact blobs under stickers (LOCK). */
function syncStickerShadow(s){
  const gp = s.group.position;
  const onDesk = Math.abs(gp.x) < 1.35 && Math.abs(gp.z) < 1.45 && gp.y > topY - 0.08;
  const planeY = onDesk ? (topY + 0.0028) : 0.008;
  const height = Math.max(0.004, gp.y - planeY);
  const foot = s.group.userData.footprint || s.size || 0.3;
  const prox = THREE.MathUtils.clamp(1 - height / 0.85, 0, 1);
  const op = THREE.MathUtils.clamp(0.18 + prox * 0.32, 0.16, 0.46);
  const sc = foot * (0.78 + height * 0.10);
  const ox = SHADOW_LIGHT_DIR.x * (0.01 + height * 0.03);
  const oz = SHADOW_LIGHT_DIR.z * (0.01 + height * 0.03);
  if (s.shadow){
    s.shadow.position.set(gp.x + ox, planeY, gp.z + oz);
    s.shadow.scale.set(sc * 1.05, sc * 0.92, 1);
    s.shadow.material.opacity = op;
    s.shadow.visible = true;
  }
  if (s.shadowSoft){
    s.shadowSoft.position.set(gp.x + ox * 1.25, planeY + 0.0008, gp.z + oz * 1.25);
    s.shadowSoft.scale.set(sc * 1.35, sc * 1.15, 1);
    s.shadowSoft.material.opacity = Math.max(0.08, op * 0.42);
    s.shadowSoft.visible = true;
  }
  const bs = s.group.userData.backShade;
  if (bs && bs.material){
    bs.material.opacity = 0.36 + (1 - prox) * 0.22;
  }
}


let _lastPickFile = '';
function pickFloatTex(){
  const pool = [];
  // flat-thick hotplug + LOCK hero set (strawberry/cat/lemon/vibe/…)
  for (const g of stickerTexList) pool.push(g);
  for (const g of lockScatterTexList) pool.push(g);
  if (!pool.length) return null;
  // avoid consecutive same file
  let pick = null;
  for (let tries = 0; tries < 8; tries++){
    pick = pool[(Math.random() * pool.length) | 0];
    if (pick.file !== _lastPickFile) break;
  }
  _lastPickFile = pick.file || '';
  return pick;
}

/** Tòpas-style continuous float layer: far=small/slow, near=large/faster. */
function spawnFloatSticker(layer){
  // layer: 0 far, 1 mid, 2 near
  if (stickers.filter(s => s.state === 'float').length >= FLOAT_CAP) return null;
  const pick = pickFloatTex();
  if (!pick) return null;
  const aspect = (pick.w && pick.h) ? (pick.w / pick.h) : 1;
  const sizeByLayer = [
    0.11 + Math.random() * 0.06, // far small
    0.18 + Math.random() * 0.08, // mid
    0.28 + Math.random() * 0.10, // near large
  ];
  const size = sizeByLayer[layer] || sizeByLayer[1];
  const w = size * Math.min(1.35, Math.max(0.7, aspect));
  const h = size;
  const thickness = 0.004 + (layer === 2 ? 0.002 : 0.001);
  const group = createFlatThickSticker(w, h, pick.tex, thickness);
  const front = group.userData.front;

  // Home anchors: leave mid-right desk + foreground L/R gaps for props / LOCK row
  // Avoid x≈0.35..0.95 & z≈-0.15..0.25 (lamp/plant/book) and desk apron corners
  let hx, hy, hz;
  for (let tries = 0; tries < 12; tries++){
    hx = (Math.random() - 0.5) * 1.7;
    hz = -0.05 + (Math.random() - 0.25) * 1.15; // bias toward camera, avoid deep back
    hy = topY + (layer === 0 ? 0.55 + Math.random()*0.35
      : layer === 1 ? 0.32 + Math.random()*0.28
      : 0.18 + Math.random()*0.22);
    const midRightDesk = (hx > 0.25 && hx < 1.05 && hz > -0.35 && hz < 0.35 && hy < topY + 0.55);
    const fgLeft = (hx < -0.55 && hz > 0.35 && hy < topY + 0.45);
    const fgRight = (hx > 0.45 && hz > 0.35 && hy < topY + 0.45);
    if (!midRightDesk && !fgLeft && !fgRight) break;
  }

  group.position.set(hx, hy, hz);
  // Face camera-ish with micro tilt (die-cut plane readable)
  const basePitch = -0.25 + (Math.random() - 0.5) * 0.2;
  const baseYaw = (Math.random() - 0.5) * 0.5;
  const baseRoll = (Math.random() - 0.5) * 0.25;
  group.rotation.set(basePitch, baseYaw, baseRoll);

  const sh = makeBlobShadow(size * 1.15);
  const shSoft = makeBlobShadow(size * 1.5);
  // far softer / nearer stronger shadow
  sh.material.opacity = layer === 0 ? 0.10 : layer === 1 ? 0.16 : 0.22;
  shSoft.material.opacity = layer === 0 ? 0.06 : layer === 1 ? 0.10 : 0.14;
  scene.add(sh); scene.add(shSoft); scene.add(group);

  const period = 6 + Math.random() * 6; // 6–12s
  const phase = Math.random() * Math.PI * 2;
  const ampY = (layer === 0 ? 0.04 : layer === 1 ? 0.055 : 0.07) * (0.85 + Math.random()*0.3);
  const ampX = (layer === 0 ? 0.03 : 0.045) * (0.8 + Math.random()*0.4);
  const ampZ = 0.025 + Math.random() * 0.03;
  // micro yaw/roll ±3–8° in radians
  const yawAmp = (3 + Math.random() * 5) * Math.PI / 180;
  const rollAmp = (3 + Math.random() * 5) * Math.PI / 180;
  // flee radius px: far 80, mid 110, near 140
  const fleePx = layer === 0 ? 80 + Math.random()*10 : layer === 1 ? 100 + Math.random()*20 : 120 + Math.random()*20;
  const returnSec = 0.6 + Math.random() * 0.6; // 0.6–1.2s

  const s = {
    group, front, shadow: sh, shadowSoft: shSoft,
    state: 'float', age: 0, t: 0, size, thickness, layer,
    spin: new THREE.Vector3(0,0,0),
    willLand: false, floatDur: period,
    origin: group.position.clone(),
    home: group.position.clone(),
    homeBase: new THREE.Vector3(hx, hy, hz),
    baseRot: new THREE.Vector3(basePitch, baseYaw, baseRoll),
    vel: new THREE.Vector3(),
    landPos: group.position.clone(),
    peakY: ampY, driftX: ampX, driftZ: ampZ,
    bounce: 0, ejectT: 0, pathT: 0,
    push: new THREE.Vector3(),
    pushVel: new THREE.Vector3(),
    breathe: phase,
    period, phase, yawAmp, rollAmp, fleePx, returnSec,
    file: pick.file || '',
  };
  stickers.push(s);
  syncStickerShadow(s);
  return s;
}

/* ========== pointer / scroll ========== */
function onPointer(e){
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(x, y);
  pointerActive = true;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(pointer, camera);
  const hPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(topY + 0.9));
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(hPlane, hit)) pointerWorld.copy(hit);
  else pointerWorld.set(9999, 9999, 9999);
}
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerleave', () => { pointerActive = false; });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches[0]) onPointer(e.touches[0]);
}, { passive: true });

function onWheel(e){
  e.preventDefault();
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + e.deltaY * 0.00115, 0, 1);
}
canvas.addEventListener('wheel', onWheel, { passive: false });

let touchY0 = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches[0]) touchY0 = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { touchY0 = null; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!e.touches[0] || touchY0 == null) return;
  const dy = touchY0 - e.touches[0].clientY;
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + dy * 0.0025, 0, 1);
  touchY0 = e.touches[0].clientY;
}, { passive: true });

/* ========== animate ========== */
const clock = new THREE.Clock();
const _tmp = new THREE.Vector3();
const _push = new THREE.Vector3();
const _ndc = new THREE.Vector3();
const _camRight = new THREE.Vector3();
const _camUp = new THREE.Vector3();
let spawnAcc = 0;
let SPAWN_EVERY = 0.85;

function updateSticker(s, dt){
  s.age += dt;
  s.t += dt;
  s.breathe += dt * ((Math.PI * 2) / Math.max(4, s.period || 8));

  if (s.state === 'float'){
    // Continuous slow bob (water) — never lands
    const ph = s.breathe + (s.phase || 0);
    const base = s.homeBase || s.home;
    const target = _tmp.set(
      base.x + Math.sin(ph * 0.85) * (s.driftX || 0.04),
      base.y + Math.sin(ph) * (s.peakY || 0.05),
      base.z + Math.cos(ph * 0.7) * (s.driftZ || 0.025)
    );
    s.home.copy(target);

    // Micro yaw/roll ±3–8°
    const br = s.baseRot || new THREE.Vector3(s.group.rotation.x, s.group.rotation.y, s.group.rotation.z);
    s.group.rotation.x = br.x + Math.sin(ph * 0.6) * (s.yawAmp || 0.06) * 0.35;
    s.group.rotation.y = br.y + Math.sin(ph * 0.9) * (s.yawAmp || 0.06);
    s.group.rotation.z = br.z + Math.cos(ph * 0.75) * (s.rollAmp || 0.06);

    // Tòpas flee: screen-space soft push, ease-out, slow return (watery, not explode)
    const halfW = canvas.clientWidth * 0.5;
    const halfH = canvas.clientHeight * 0.5;
    s.pushVel.multiplyScalar(0.90);
    if (pointerActive && !reduceMotion){
      _ndc.copy(s.group.position).project(camera);
      const dx = (_ndc.x - pointer.x) * halfW;
      const dy = (_ndc.y - pointer.y) * halfH;
      const distPx = Math.hypot(dx, dy);
      const radius = s.fleePx || 110;
      if (distPx < radius && distPx > 0.5){
        const u = 1 - distPx / radius;
        const ease = u * u * (3 - 2 * u); // smoothstep ease-out feel
        // Push direction in world from camera plane
        _push.set(dx, dy, 0).normalize();
        // Convert screen push to world approx via camera right/up
        const right = _camRight.set(1,0,0).applyQuaternion(camera.quaternion);
        const up = _camUp.set(0,1,0).applyQuaternion(camera.quaternion);
        const worldPush = right.multiplyScalar(_push.x).addScaledVector(up, _push.y);
        worldPush.y *= 0.45;
        worldPush.normalize().multiplyScalar(ease * ease * 0.85); // soft Tòpas push, capped
        // return spring strength from returnSec
        const k = 1 / Math.max(0.45, s.returnSec || 0.9);
        s.pushVel.addScaledVector(worldPush, dt * (10 + k * 4));
        // hard cap velocity so stickers never explode across screen
        if (s.pushVel.length() > 1.35) s.pushVel.setLength(1.35);
      }
    }
    // Spring back to home (water settle) — returnSec governs feel
    const returnK = 2.2 / Math.max(0.5, s.returnSec || 0.9);
    _push.copy(s.home).sub(s.group.position).sub(s.push);
    s.pushVel.addScaledVector(_push, dt * returnK);
    s.push.addScaledVector(s.pushVel, dt);
    s.push.multiplyScalar(0.94);
    if (s.push.length() > 0.95) s.push.setLength(0.95); // soft clamp displacement
    s.group.position.copy(s.home).add(s.push);

    syncStickerShadow(s);
  } else if (s.state === 'landed'){
    // Soft desk contact only — gentle nudge, no launch
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y = 0;
      const dist = _push.length();
      if (dist < 0.55 && dist > 0.001){
        _push.normalize().multiplyScalar((1 - dist / 0.55) * 0.01);
        s.group.position.add(_push);
        s.group.position.y = s.landPos.y;
        syncStickerShadow(s);
      }
    } else {
      syncStickerShadow(s);
    }
  } else if (s.state === 'fade'){
    s.fadeT = (s.fadeT || 0) + dt;
    s.group.position.y += dt * 0.25;
    const op = 1 - s.fadeT / 0.8;
    s.front.material.opacity = Math.max(0, op);
    s.group.traverse((o)=>{ if(o.isMesh && o.material && o.material.transparent) o.material.opacity = Math.max(0, op); });
    if (s.shadow) s.shadow.material.opacity *= 0.88;
    if (s.shadowSoft) s.shadowSoft.material.opacity *= 0.88;
    if (s.fadeT > 0.8){
      scene.remove(s.group);
      if (s.shadow) scene.remove(s.shadow);
      if (s.shadowSoft) scene.remove(s.shadowSoft);
      stickers.splice(stickers.indexOf(s), 1);
    }
  }
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.033, clock.getDelta());

  scrollProg += (scrollTarget - scrollProg) * (reduceMotion ? 1 : 0.08);
  applyCamera();
  if (tempDesk && tempDesk.userData.lightingProbe && !loadedProps.desk){
    tempDesk.visible = scrollProg > 0.35 || viewMode === 'desk' || viewMode === 'workbench';
  }
  if (!hideHud){
    scrollCueEl.style.opacity = String(1 - Math.min(1, scrollProg * 2.2));
    if (scrollProg > 0.55){
      hintEl.innerHTML = loadedProps.desk
        ? '工作台 · 电脑本 / 打印机 / 速写本 / 台灯 · <em>滚轮</em>可回到首屏'
        : '工作台精模待接入 · <em>滚轮</em>可回到首屏';
    } else {
      hintEl.innerHTML = '贴纸在空中慢漂 · <em>鼠标靠近</em>会柔和躲开';
    }
  }

  spawnAcc += dt;
  // Cake-stand / Tòpas: keep float pool topped up even in desk/clean review
  const floatCount = stickers.filter(s => s.state === 'float').length;
  if (floatCount < FLOAT_CAP && spawnAcc >= SPAWN_EVERY){
    spawnAcc = 0;
    const layer = floatCount < 5 ? 0 : floatCount < 11 ? 1 : 2;
    spawnFloatSticker(layer);
  }

  if (printerGroup && viewMode !== 'desk' && viewMode !== 'workbench' && !qaLight){
    printerGroup.position.y = Math.sin(clock.elapsedTime * 1.2) * 0.004;
  } else if (printerGroup && (viewMode === 'desk' || viewMode === 'workbench' || qaLight)){
    printerGroup.position.y = 0;
  }
  if (lampGroup && lampGroup.userData.light){
    // Soft breathe around whisper baseline (no hard burn)
    const pulse = 0.20 + Math.sin(clock.elapsedTime * 1.2) * 0.03;
    lampGroup.userData.light.intensity = pulse;
    if (lampGroup.userData.fill) lampGroup.userData.fill.intensity = 0.08 + Math.sin(clock.elapsedTime * 1.2) * 0.015;
  }
  if (loadedProps.plant){
    loadedProps.plant.rotation.z = Math.sin(clock.elapsedTime * 0.8) * 0.02;
  }

  for (let i = stickers.length - 1; i >= 0; i--){
    updateSticker(stickers[i], dt);
  }

  composer.render();
}
