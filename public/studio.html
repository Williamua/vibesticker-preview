<style>
  :root{
    --cream:#F7F3EC; --apricot:#E8D9C8; --oak:#C4A882;
    --coral:#E87A6B; --ink:#2A221C; --mint:#7CB8A0; --lemon:#F0C94A; --berry:#D94A3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
    font-family:"DM Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none}
  .brand{position:absolute;top:22px;left:28px;display:flex;align-items:baseline;gap:10px}
  .brand .vibe{font-family:"Caveat",cursive;font-size:42px;line-height:1;color:var(--coral);
    font-weight:700;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
  .brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(42,34,28,.55);font-weight:600}
  .tag{position:absolute;top:28px;right:28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(42,34,28,.45);font-weight:600}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:13px;
    color:rgba(42,34,28,.55);letter-spacing:.04em;transition:opacity .35s ease}
  .hint em{font-style:normal;color:var(--coral);font-weight:600}
  .scroll-cue{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(42,34,28,.4);font-weight:600;
    transition:opacity .35s ease}
  .scroll-cue span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  #err{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    padding:24px;background:rgba(247,243,236,.95);color:var(--ink);font-size:15px;line-height:1.6;text-align:center}
  #err.show{display:flex}
  @media (max-width:640px){
    .brand .vibe{font-size:32px}
    .tag{font-size:9px;top:20px;right:16px}
    .brand{top:16px;left:16px}
    .hint{font-size:12px;bottom:16px;padding:0 16px}
    .scroll-cue{bottom:44px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    .scroll-cue span{animation:none}
  }

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const COLORS = {
  cream: 0xF7F3EC, apricot: 0xE8D9C8, oak: 0xC4A882,
  coral: 0xE87A6B, ink: 0x2A221C, mint: 0x7CB8A0,
  lemon: 0xF0C94A, berry: 0xD94A3D, white: 0xFFF8F0,
  brass: 0xC9A56B,
};

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const errEl = document.getElementById('err');
const hintEl = document.getElementById('hint');
const scrollCueEl = document.getElementById('scrollCue');
function showErr(msg){
  console.error(msg);
  errEl.textContent = '加载失败\n' + msg;
  errEl.classList.add('show');
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: !isMobile, alpha: false,
  powerPreference: 'high-performance',
});
if (!renderer.getContext()) throw new Error('WebGL 不可用');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(COLORS.cream, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.cream);
scene.fog = new THREE.Fog(COLORS.cream, 16, 32);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);

/* scroll progress 0 = hero float, 1 = workbench */
let scrollTarget = 0;
let scrollProg = 0;

const camHero = {
  pos: new THREE.Vector3(0.55, 2.35, 5.8),
  look: new THREE.Vector3(-0.8, 1.35, 0.2),
};
const camDesk = {
  pos: new THREE.Vector3(0.15, 3.55, 5.2),
  look: new THREE.Vector3(0.05, 1.15, 0.05),
};
const _camPos = new THREE.Vector3();
const _camLook = new THREE.Vector3();

function applyCamera(){
  _camPos.lerpVectors(camHero.pos, camDesk.pos, scrollProg);
  _camLook.lerpVectors(camHero.look, camDesk.look, scrollProg);
  camera.position.copy(_camPos);
  camera.lookAt(_camLook);
}
applyCamera();

/* —— lights —— */
const amb = new THREE.AmbientLight(0xFFF4E8, 0.7);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xFFF8F0, 0xE8D9C8, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xFFF6EA, 1.05);
key.position.set(-2.8, 8.5, 5.2);
key.castShadow = !isMobile;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 28;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.00035;
key.shadow.radius = 3.5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xFFE8D8, 0.32);
fill.position.set(5, 4, 2.5);
scene.add(fill);

/* soft void ground (studio seamless) */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({
    color: COLORS.cream, roughness: 0.95, metalness: 0.0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ========== procedural textures ========== */
function makeOakTexture(){
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,S,0);
  g.addColorStop(0,'#D4B896');
  g.addColorStop(0.35,'#C4A882');
  g.addColorStop(0.55,'#B8956C');
  g.addColorStop(0.8,'#C9AD88');
  g.addColorStop(1,'#D0B490');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,S,S);
  // grain lines
  for (let i=0;i<70;i++){
    const y = (i/70)*S + Math.sin(i*1.7)*4;
    ctx.strokeStyle = `rgba(90,60,30,${0.035 + (i%5)*0.01})`;
    ctx.lineWidth = 1 + (i%3)*0.6;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x=0;x<=S;x+=16){
      ctx.lineTo(x, y + Math.sin(x*0.02 + i)*3 + Math.sin(x*0.07)*1.5);
    }
    ctx.stroke();
  }
  // subtle pores
  ctx.fillStyle = 'rgba(80,50,25,0.06)';
  for (let i=0;i<180;i++){
    ctx.fillRect(Math.random()*S, Math.random()*S, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}
const oakTex = makeOakTexture();
oakTex.repeat.set(2.2, 1.1);

function makePaperTex(tint='#FFFDF8'){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = tint;
  ctx.fillRect(0,0,S,S);
  ctx.fillStyle = 'rgba(196,168,130,0.12)';
  for (let i=0;i<30;i++) ctx.fillRect(Math.random()*S, Math.random()*S, 2, 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ========== sticker textures (canvas) ========== */
function makeStickerTexture(kind){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const pad = 18;
  const r = 36;
  ctx.clearRect(0,0,S,S);
  ctx.save();
  ctx.shadowColor = 'rgba(42,34,28,0.18)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  roundRect(ctx, pad, pad, S-pad*2, S-pad*2, r);
  ctx.fillStyle = '#FFFDF8';
  ctx.fill();
  ctx.restore();
  roundRect(ctx, pad, pad, S-pad*2, S-pad*2, r);
  ctx.fillStyle = '#FFFDF8';
  ctx.fill();
  ctx.strokeStyle = 'rgba(42,34,28,0.08)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const cx = S/2, cy = S/2;
  if (kind === 'cat') drawCat(ctx, cx, cy-6, 78);
  else if (kind === 'berry') drawBerry(ctx, cx, cy-4, 70);
  else if (kind === 'peach') drawPeach(ctx, cx, cy-2, 72);
  else if (kind === 'lemon') drawLemon(ctx, cx, cy, 74);
  else if (kind === 'blossom') drawBlossom(ctx, cx, cy, 68);
  else if (kind === 'vibe') drawVibe(ctx, cx, cy);
  else if (kind === 'mint') drawMintLeaf(ctx, cx, cy, 70);
  else if (kind === 'make') drawMake(ctx, cx, cy);
  else drawStar(ctx, cx, cy, 60);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCat(ctx,cx,cy,s){
  ctx.fillStyle = '#C9A88A';
  ctx.beginPath(); ctx.ellipse(cx, cy+4, s*0.55, s*0.48, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx-s*0.42, cy-s*0.15); ctx.lineTo(cx-s*0.55, cy-s*0.62); ctx.lineTo(cx-s*0.12, cy-s*0.32); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+s*0.42, cy-s*0.15); ctx.lineTo(cx+s*0.55, cy-s*0.62); ctx.lineTo(cx+s*0.12, cy-s*0.32); ctx.fill();
  ctx.fillStyle = '#E8C4A8';
  ctx.beginPath();
  ctx.moveTo(cx-s*0.38, cy-s*0.18); ctx.lineTo(cx-s*0.48, cy-s*0.48); ctx.lineTo(cx-s*0.18, cy-s*0.28); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+s*0.38, cy-s*0.18); ctx.lineTo(cx+s*0.48, cy-s*0.48); ctx.lineTo(cx+s*0.18, cy-s*0.28); ctx.fill();
  // tabby stripes
  ctx.strokeStyle = 'rgba(90,60,40,0.35)'; ctx.lineWidth = 3;
  for (let i=-1;i<=1;i++){
    ctx.beginPath(); ctx.moveTo(cx+i*s*0.18, cy-s*0.25); ctx.quadraticCurveTo(cx+i*s*0.1, cy, cx+i*s*0.22, cy+s*0.25); ctx.stroke();
  }
  ctx.fillStyle = '#5A9A88';
  ctx.beginPath(); ctx.ellipse(cx-s*0.2, cy-s*0.02, s*0.11, s*0.14, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+s*0.2, cy-s*0.02, s*0.11, s*0.14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2A221C';
  ctx.beginPath(); ctx.arc(cx-s*0.2, cy-s*0.02, s*0.045, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+s*0.2, cy-s*0.02, s*0.045, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#E87A6B';
  ctx.beginPath();
  ctx.moveTo(cx, cy+s*0.12); ctx.lineTo(cx-s*0.06, cy+s*0.2); ctx.lineTo(cx+s*0.06, cy+s*0.2); ctx.fill();
  ctx.strokeStyle = '#2A221C'; ctx.lineWidth = 2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx, cy+s*0.2); ctx.quadraticCurveTo(cx-s*0.12, cy+s*0.3, cx-s*0.18, cy+s*0.22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy+s*0.2); ctx.quadraticCurveTo(cx+s*0.12, cy+s*0.3, cx+s*0.18, cy+s*0.22); ctx.stroke();
}
function drawBerry(ctx,cx,cy,s){
  ctx.fillStyle = '#D94A3D';
  ctx.beginPath();
  ctx.moveTo(cx, cy+s*0.55);
  ctx.bezierCurveTo(cx+s*0.55, cy+s*0.2, cx+s*0.45, cy-s*0.35, cx, cy-s*0.25);
  ctx.bezierCurveTo(cx-s*0.45, cy-s*0.35, cx-s*0.55, cy+s*0.2, cx, cy+s*0.55);
  ctx.fill();
  ctx.fillStyle = '#F7F3EC';
  for (let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2 + 0.4;
    const r = s*0.22;
    ctx.beginPath(); ctx.ellipse(cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.7, 3, 5, a, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#7CB8A0';
  ctx.beginPath(); ctx.ellipse(cx-s*0.12, cy-s*0.38, s*0.18, s*0.1, -0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+s*0.12, cy-s*0.38, s*0.18, s*0.1, 0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy-s*0.48, s*0.12, s*0.08, 0, 0, Math.PI*2); ctx.fill();
}
function drawPeach(ctx,cx,cy,s){
  ctx.fillStyle = '#F0A878';
  ctx.beginPath(); ctx.ellipse(cx-s*0.08, cy+s*0.05, s*0.42, s*0.48, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#E87A6B';
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.ellipse(cx+s*0.12, cy+s*0.08, s*0.32, s*0.4, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(217,74,61,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy-s*0.35); ctx.quadraticCurveTo(cx-s*0.05, cy, cx, cy+s*0.4); ctx.stroke();
  ctx.fillStyle = '#7CB8A0';
  ctx.beginPath(); ctx.ellipse(cx+s*0.1, cy-s*0.42, s*0.2, s*0.1, 0.5, 0, Math.PI*2); ctx.fill();
}
function drawLemon(ctx,cx,cy,s){
  ctx.fillStyle = '#F0C94A';
  ctx.beginPath(); ctx.ellipse(cx, cy, s*0.55, s*0.55, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFF8DC';
  ctx.beginPath(); ctx.arc(cx, cy, s*0.38, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#E8B84A'; ctx.lineWidth = 2;
  for (let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+Math.cos(a)*s*0.38, cy+Math.sin(a)*s*0.38); ctx.stroke();
  }
  ctx.fillStyle = '#F0C94A';
  ctx.beginPath(); ctx.arc(cx, cy, s*0.08, 0, Math.PI*2); ctx.fill();
}
function drawBlossom(ctx,cx,cy,s){
  const petals = 5;
  for (let i=0;i<petals;i++){
    const a = (i/petals)*Math.PI*2 - Math.PI/2;
    ctx.fillStyle = i%2 ? '#F5B0A8' : '#E87A6B';
    ctx.beginPath();
    ctx.ellipse(cx+Math.cos(a)*s*0.28, cy+Math.sin(a)*s*0.28, s*0.22, s*0.14, a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#F0C94A';
  ctx.beginPath(); ctx.arc(cx, cy, s*0.12, 0, Math.PI*2); ctx.fill();
}
function drawVibe(ctx,cx,cy){
  ctx.font = 'bold 72px Caveat, cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#FFFDF8';
  ctx.lineWidth = 14;
  ctx.lineJoin = 'round';
  ctx.strokeText('VIBE', cx, cy+4);
  ctx.fillStyle = '#E87A6B';
  ctx.fillText('VIBE', cx, cy+4);
}
function drawMake(ctx,cx,cy){
  ctx.fillStyle = '#FFFDF8';
  roundRect(ctx, 28, 70, 200, 116, 18);
  ctx.fill();
  ctx.fillStyle = '#E87A6B';
  ctx.font = '600 22px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = '0.08em';
  ctx.fillText('MAKE', cx, cy-22);
  ctx.fillText('SOMETHING', cx, cy+6);
  ctx.fillText('BEAUTIFUL', cx, cy+34);
}
function drawMintLeaf(ctx,cx,cy,s){
  ctx.fillStyle = '#7CB8A0';
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*0.35, s*0.55, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5A9A80'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx-s*0.05, cy+s*0.5); ctx.quadraticCurveTo(cx+s*0.05, cy, cx-s*0.02, cy-s*0.5); ctx.stroke();
}
function drawStar(ctx,cx,cy,s){
  ctx.fillStyle = '#F0C94A';
  ctx.beginPath();
  for (let i=0;i<5;i++){
    const a = (i*2/5)*Math.PI*2 - Math.PI/2;
    const b = ((i*2+1)/5)*Math.PI*2 - Math.PI/2;
    const x1 = cx+Math.cos(a)*s*0.55, y1 = cy+Math.sin(a)*s*0.55;
    const x2 = cx+Math.cos(b)*s*0.22, y2 = cy+Math.sin(b)*s*0.22;
    if (i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
  }
  ctx.closePath(); ctx.fill();
}

const STICKER_KINDS = ['cat','berry','peach','lemon','blossom','vibe','mint','star','make'];
const stickerTextures = STICKER_KINDS.map(makeStickerTexture);
function makeBackTexture(){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F3E6D4';
  ctx.fillRect(0,0,S,S);
  ctx.fillStyle = 'rgba(196,168,130,0.25)';
  for (let i=0;i<40;i++) ctx.fillRect(Math.random()*S, Math.random()*S, 2, 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const backTex = makeBackTexture();

/* ========== WORKBENCH ========== */
const bench = new THREE.Group();
bench.position.set(0, 0, 0);
scene.add(bench);

const oakMat = new THREE.MeshStandardMaterial({
  map: oakTex, color: 0xffffff, roughness: 0.62, metalness: 0.04,
});
const creamMat = new THREE.MeshStandardMaterial({
  color: 0xF5EEE4, roughness: 0.48, metalness: 0.04,
});
const coralMat = new THREE.MeshStandardMaterial({
  color: COLORS.coral, roughness: 0.38, metalness: 0.1,
});
const coralSoftMat = new THREE.MeshStandardMaterial({
  color: 0xF0A898, roughness: 0.45, metalness: 0.06,
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x3A322C, roughness: 0.85, metalness: 0.05,
});
const brassMat = new THREE.MeshStandardMaterial({
  color: COLORS.brass, roughness: 0.28, metalness: 0.75,
});
const potMat = new THREE.MeshStandardMaterial({
  color: 0x9A9A98, roughness: 0.7, metalness: 0.05,
});
const leafMat = new THREE.MeshStandardMaterial({
  color: COLORS.mint, roughness: 0.55, metalness: 0.0,
});
const leafDarkMat = new THREE.MeshStandardMaterial({
  color: 0x5A9A80, roughness: 0.6, metalness: 0.0,
});

/* floating desk */
const DESK_Y = 0.92;
const desk = new THREE.Mesh(new RoundedBoxGeometry(4.6, 0.2, 2.35, 6, 0.1), oakMat);
desk.position.set(0, DESK_Y, 0);
desk.castShadow = true;
desk.receiveShadow = true;
bench.add(desk);

/* underside rim for thickness */
const deskRim = new THREE.Mesh(

/* ========== soft paper sticker system ========== */
const stickers = [];
const MAX_STICKERS = isMobile ? 20 : 32;
const pointer = new THREE.Vector2(9999, 9999);
const pointerWorld = new THREE.Vector3(9999, 9999, 9999);
let pointerActive = false;

function createPaperGeo(w, h, segX=10, segY=12){
  const geo = new THREE.PlaneGeometry(w, h, segX, segY);
  const pos = geo.attributes.position;
  const rest = new Float32Array(pos.count * 3);
  for (let i=0;i<pos.count;i++){
    rest[i*3] = pos.getX(i);
    rest[i*3+1] = pos.getY(i);
    rest[i*3+2] = pos.getZ(i);
  }
  geo.userData.rest = rest;
  geo.userData.w = w;
  geo.userData.h = h;
  return geo;
}

function bendPaper(geo, curlAmt, rollAmt, twist, time){
  const pos = geo.attributes.position;
  const rest = geo.userData.rest;
  const w = geo.userData.w, h = geo.userData.h;
  for (let i=0;i<pos.count;i++){
    const x = rest[i*3], y = rest[i*3+1];
    const u = x / (w*0.5);
    const v = y / (h*0.5);
    const wave = Math.sin(v * Math.PI * 0.85 + time) * curlAmt;
    const edgeRoll = (u*u) * rollAmt * (0.55 + 0.45*Math.sin(time*0.7 + v));
    const twistZ = twist * u * v * 0.15;
    pos.setXYZ(i, x, y, wave + edgeRoll + twistZ);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

function spawnSticker(forceLanded=false){
  if (stickers.length >= MAX_STICKERS){
    let victim = stickers.find(s => s.state === 'landed' && s.age > 4);
    if (!victim) victim = stickers[0];
    if (victim){
      scene.remove(victim.group);
      scene.remove(victim.shadow);
      stickers.splice(stickers.indexOf(victim), 1);
    }
  }
  const kindIdx = (Math.random()*STICKER_KINDS.length)|0;
  const tex = stickerTextures[kindIdx];
  const size = 0.38 + Math.random()*0.2;
  const geo = createPaperGeo(size, size * (0.95 + Math.random()*0.15), 10, 12);
  const frontMat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.72, metalness: 0.0,
    side: THREE.FrontSide, transparent: true, alphaTest: 0.05,
  });
  const backMat = new THREE.MeshStandardMaterial({
    map: backTex, color: 0xF0E4D4, roughness: 0.85, metalness: 0.0,
    side: THREE.BackSide,
  });
  const front = new THREE.Mesh(geo, frontMat);
  const back = new THREE.Mesh(geo.clone(), backMat);
  back.position.z = -0.012;
  front.castShadow = true;
  back.castShadow = true;

  const edgeGeo = new THREE.PlaneGeometry(size, 0.014, 1, 1);
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xE8D9C8, roughness: 0.8, side: THREE.DoubleSide });
  const edgeTop = new THREE.Mesh(edgeGeo, edgeMat);
  edgeTop.rotation.x = Math.PI/2;
  edgeTop.position.y = size*0.48;
  const edgeBot = edgeTop.clone();
  edgeBot.position.y = -size*0.48;

  const group = new THREE.Group();
  group.add(front, back, edgeTop, edgeBot);

  const slot = getSlotWorld();
  group.position.copy(slot);
  group.position.x += (Math.random()-0.5)*0.08;
  group.position.y += (Math.random()-0.5)*0.04;
  group.rotation.set(
    (Math.random()-0.5)*0.3,
    (Math.random()-0.5)*0.4,
    (Math.random()-0.5)*0.5
  );

  const sh = new THREE.Mesh(
    new THREE.CircleGeometry(size*0.45, 20),
    new THREE.MeshBasicMaterial({ color: 0x2A221C, transparent: true, opacity: 0, depthWrite: false })
  );
  sh.rotation.x = -Math.PI/2;
  sh.position.y = topY + 0.014;
  scene.add(sh);
  scene.add(group);

  const willLand = forceLanded || Math.random() < 0.42;
  const floatDur = 2.8 + Math.random()*2.4;
  const driftX = 0.6 + Math.random()*2.8;
  const driftZ = (Math.random()-0.5)*1.4;
  const peakY = 1.6 + Math.random()*2.0;

  const s = {
    group, front, back, geo, edgeTop, edgeBot, shadow: sh,
    state: forceLanded ? 'landed' : 'eject',
    age: 0, t: 0, size,
    curl: 0.07 + Math.random()*0.10,
    roll: 0.035 + Math.random()*0.06,
    twist: (Math.random()-0.5)*0.8,
    spin: new THREE.Vector3(
      (Math.random()-0.5)*0.6,
      (Math.random()-0.5)*1.2,
      (Math.random()-0.5)*0.8
    ),
    willLand, floatDur,
    origin: group.position.clone(),
    home: null,
    vel: new THREE.Vector3(0.7 + Math.random()*0.55, 0.85 + Math.random()*0.45, (Math.random()-0.5)*0.28),
    landPos: new THREE.Vector3(
      slot.x + driftX * (0.4 + Math.random()*0.5),
      topY + 0.02,
      slot.z + driftZ + 0.5 + Math.random()*0.9
    ),
    peakY, driftX, driftZ,
    bounce: 0, ejectT: 0, pathT: 0,
    push: new THREE.Vector3(),
    pushVel: new THREE.Vector3(),
    breathe: Math.random()*Math.PI*2,
  };
  // clamp land onto desk roughly
  s.landPos.x = THREE.MathUtils.clamp(s.landPos.x, -2.0, 2.0);
  s.landPos.z = THREE.MathUtils.clamp(s.landPos.z, -0.9, 1.05);

  if (forceLanded){
    group.position.copy(s.landPos);
    group.position.x += (Math.random()-0.5)*0.8;
    group.position.z += (Math.random()-0.5)*0.5;
    group.position.x = THREE.MathUtils.clamp(group.position.x, -2.0, 1.9);
    group.position.z = THREE.MathUtils.clamp(group.position.z, -0.85, 1.0);
    group.rotation.set(-Math.PI/2 + (Math.random()-0.5)*0.2, Math.random()*Math.PI, (Math.random()-0.5)*0.15);
    bendPaper(geo, s.curl*0.4, s.roll*0.5, s.twist*0.3, Math.random()*10);
    if (back.geometry !== geo) bendPaper(back.geometry, s.curl*0.4, s.roll*0.5, s.twist*0.3, Math.random()*10);
    sh.position.set(group.position.x, topY + 0.014, group.position.z);
    sh.material.opacity = 0.12;
    s.home = group.position.clone();
    s.landPos.copy(group.position);
  }
  stickers.push(s);
  return s;
}

let spawnAcc = 0;
const SPAWN_EVERY = reduceMotion ? 1.15 : 0.45;

/* ========== pointer / repulsion ========== */
function onPointer(e){
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(x, y);
  pointerActive = true;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(pointer, camera);
  const hPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(topY + 0.9));
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(hPlane, hit)){
    pointerWorld.copy(hit);
  } else {
    pointerWorld.set(9999,9999,9999);
  }
}
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerleave', () => { pointerActive = false; });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches[0]) onPointer(e.touches[0]);
}, { passive: true });

/* ========== scroll → workbench ========== */
function onWheel(e){
  e.preventDefault();
  const delta = e.deltaY;
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + delta * 0.00115, 0, 1);
}
canvas.addEventListener('wheel', onWheel, { passive: false });

let touchY0 = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches[0]) touchY0 = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', () => { touchY0 = null; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!e.touches[0] || touchY0 == null) return;
  const dy = touchY0 - e.touches[0].clientY;
  scrollTarget = THREE.MathUtils.clamp(scrollTarget + dy * 0.0025, 0, 1);
  touchY0 = e.touches[0].clientY;
}, { passive: true });

/* ========== animate ========== */
const clock = new THREE.Clock();
const _tmp = new THREE.Vector3();
const _push = new THREE.Vector3();

function updateSticker(s, dt){
  s.age += dt;
  s.t += dt;
  s.breathe += dt * 1.4;

  const curlPulse = s.curl * (0.85 + 0.15*Math.sin(s.breathe));
  bendPaper(s.geo, curlPulse, s.roll, s.twist, s.t * 1.6);
  if (s.back.geometry !== s.geo){
    bendPaper(s.back.geometry, curlPulse, s.roll, s.twist, s.t * 1.6);
  }

  if (s.state === 'eject'){
    s.ejectT += dt;
    s.group.position.addScaledVector(s.vel, dt);
    s.vel.y += dt * 0.75;
    s.vel.x += dt * 0.35;
    s.group.rotation.x += s.spin.x * dt;
    s.group.rotation.y += s.spin.y * dt;
    s.group.rotation.z += s.spin.z * dt;
    if (s.ejectT > 0.35){
      s.state = 'float';
      s.pathT = 0;
      s.origin.copy(s.group.position);
      s.home = s.group.position.clone();
    }
  } else if (s.state === 'float'){
    s.pathT += dt / s.floatDur;
    const u = Math.min(1, s.pathT);
    const ease = 1 - Math.pow(1-u, 2.2);
    const slotish = s.origin;
    const target = _tmp.set(
      slotish.x + s.driftX * ease,
      slotish.y + Math.sin(ease * Math.PI) * s.peakY * 0.9 + ease * 0.15,
      slotish.z + s.driftZ * ease + ease * 0.55
    );
    target.y += Math.sin(s.breathe) * 0.06;
    target.x += Math.sin(s.breathe * 0.7) * 0.04;
    s.home.copy(target);

    s.pushVel.multiplyScalar(0.88);
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y *= 0.35;
      const dist = _push.length();
      const radius = 1.35;
      if (dist < radius && dist > 0.001){
        const f = (1 - dist/radius);
        const force = f * f * 5.5;
        _push.normalize().multiplyScalar(force);
        s.pushVel.addScaledVector(_push, dt * 18);
      }
    }
    _push.copy(s.home).sub(s.group.position).sub(s.push);
    s.pushVel.addScaledVector(_push, dt * 3.2);
    s.push.addScaledVector(s.pushVel, dt);
    s.push.multiplyScalar(0.96);
    s.group.position.copy(s.home).add(s.push);

    s.group.rotation.x += s.spin.x * dt * 0.45;
    s.group.rotation.y += s.spin.y * dt * 0.55;
    s.group.rotation.z += s.spin.z * dt * 0.4;
    s.group.rotation.x += Math.sin(s.breathe*0.5)*0.002;

    s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
    s.shadow.material.opacity = THREE.MathUtils.clamp(0.04 + (2.2 - (s.group.position.y-topY))*0.02, 0.02, 0.08);

    if (u >= 1){
      if (s.willLand){
        s.state = 'falling';
        s.fallT = 0;
        s.fallFrom = s.group.position.clone();
      } else {
        s.state = 'fade';
        s.fadeT = 0;
      }
    }
  } else if (s.state === 'falling'){
    s.fallT = (s.fallT || 0) + dt;
    const dur = 0.85;
    const u = Math.min(1, s.fallT / dur);
    const ease = u*u*(3-2*u);
    s.group.position.lerpVectors(s.fallFrom, s.landPos, ease);
    const flatX = -Math.PI/2 + Math.sin(s.breathe)*0.05;
    s.group.rotation.x += (flatX - s.group.rotation.x) * ease * 0.2;
    s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
    s.shadow.material.opacity = 0.04 + ease * 0.1;
    if (u >= 1){
      s.state = 'landed';
      s.bounce = 1;
      s.group.position.copy(s.landPos);
      s.home = s.landPos.clone();
    }
  } else if (s.state === 'landed'){
    if (s.bounce > 0){
      s.bounce -= dt * 2.2;
      const b = Math.max(0, s.bounce);
      s.group.position.y = s.landPos.y + Math.sin((1-b)*Math.PI) * 0.08 * b;
      s.shadow.material.opacity = 0.14 - b*0.04;
      s.shadow.scale.setScalar(1 + (1-b)*0.15);
    } else {
      s.group.position.y = s.landPos.y;
      s.shadow.material.opacity = 0.12;
    }
    if (pointerActive && !reduceMotion){
      _push.copy(s.group.position).sub(pointerWorld);
      _push.y = 0;
      const dist = _push.length();
      if (dist < 0.9 && dist > 0.001){
        _push.normalize().multiplyScalar((1-dist/0.9)*0.015);
        s.group.position.add(_push);
        s.group.position.y = s.landPos.y;
        s.shadow.position.set(s.group.position.x, topY + 0.014, s.group.position.z);
      }
    }
  } else if (s.state === 'fade'){
    s.fadeT = (s.fadeT||0) + dt;
    s.group.position.y += dt * 0.4;
    s.group.position.x += dt * 0.5;
    const op = 1 - s.fadeT/0.8;
    s.front.material.opacity = Math.max(0, op);
    s.back.material.opacity = Math.max(0, op);
    s.shadow.material.opacity *= 0.9;
    if (s.fadeT > 0.8){
      scene.remove(s.group);
      scene.remove(s.shadow);
      stickers.splice(stickers.indexOf(s), 1);
    }
  }
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.033, clock.getDelta());

  // smooth scroll camera
  scrollProg += (scrollTarget - scrollProg) * (reduceMotion ? 1 : 0.08);
  applyCamera();
  const cueOp = 1 - Math.min(1, scrollProg * 2.2);
  scrollCueEl.style.opacity = String(cueOp);
  if (scrollProg > 0.55){
    hintEl.innerHTML = '工作台 · 切割机 / 打印机 / 贴纸本 / 台灯 · <em>滚轮</em>可回到首屏';
  } else {
    hintEl.innerHTML = '打印机持续吐贴纸 · <em>鼠标靠近</em>贴纸会躲开';
  }

  spawnAcc += dt;
  if (spawnAcc >= SPAWN_EVERY){
    spawnAcc = 0;
    spawnSticker(false);
  }

  // subtle idle
  printerGroup.position.y = topY + Math.sin(clock.elapsedTime * 1.2) * 0.006;
  // lamp pulse
  if (lamp.userData.light){
    const pulse = 2.2 + Math.sin(clock.elapsedTime * 1.5) * 0.25;
    lamp.userData.light.intensity = pulse;
    if (lamp.userData.fill) lamp.userData.fill.intensity = 0.45 + Math.sin(clock.elapsedTime * 1.5) * 0.08;
  }
  // plant gentle sway
  plant.rotation.z = Math.sin(clock.elapsedTime * 0.8) * 0.02;

  for (let i=stickers.length-1;i>=0;i--){
    updateSticker(stickers[i], dt);
  }

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 1.75));
  renderer.setSize(innerWidth, innerHeight, false);
});

} catch (e) {
  showErr(e && e.message ? e.message : String(e));
}
</script>
</body>
</html>
