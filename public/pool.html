<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VibeSticker · 室内泳池预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a2332;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 18px;text-align:center;color:#f5faf8;font-size:14px;letter-spacing:.04em;background:linear-gradient(180deg,rgba(20,30,42,.78),rgba(20,30,42,0));pointer-events:none;user-select:none}
  #hint{position:fixed;bottom:16px;left:0;right:0;z-index:10;text-align:center;color:rgba(245,250,248,.68);font-size:12px;pointer-events:none;user-select:none;letter-spacing:.06em}
  #c{display:block;width:100%;height:100%;touch-action:none}
  #err{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;padding:24px;background:rgba(20,30,42,.94);color:#f5faf8;font-size:15px;line-height:1.6;text-align:center;white-space:pre-wrap}
  #err.show{display:flex}
  #panel{
    display:none;position:fixed;z-index:20;right:max(18px,4vw);top:50%;transform:translateY(-50%);
    width:min(320px,86vw);padding:22px 22px 18px;border-radius:16px;
    background:rgba(18,26,36,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:#f5faf8;box-shadow:0 16px 48px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);
  }
  #panel.show{display:block}
  #panel h2{font-size:20px;font-weight:650;margin-bottom:8px;letter-spacing:.02em}
  #panel p{font-size:13.5px;line-height:1.55;color:rgba(245,250,248,.82);margin-bottom:16px}
  #panel button{appearance:none;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;background:#7ec8c4;color:#102028;font-weight:600;font-size:13px}
  #panel button:hover{filter:brightness(1.06)}
  #loading{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:#1a2332;color:#cfe8e4;font-size:14px;letter-spacing:.08em}
  #loading.hide{opacity:0;pointer-events:none;transition:opacity .35s}
  #orientBtn{display:none;position:fixed;z-index:18;left:50%;bottom:52px;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(126,200,196,.95);color:#102028;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #orientBtn.show{display:block}
</style>
</head>
<body>
<div id="loading">加载泳池场景…</div>
<div id="hud">拖动环视 · 滚轮缩放 · 点击躺椅靠近 · 水面滑动推浪</div>
<div id="hint">果冻水体 · 窗外日照循环 · VibeSticker</div>
<button type="button" id="orientBtn">开启陀螺仪控水</button>
<div id="err" role="alert"></div>
<aside id="panel" aria-live="polite">
  <h2>VibeSticker</h2>
  <p>欢迎来到室内泳池场景。这是交互入口占位——之后可换成贴纸定制、下单或品牌故事。</p>
  <button type="button" id="panelClose">关闭 · 退回远景</button>
</aside>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const errEl = document.getElementById('err');
const loadingEl = document.getElementById('loading');
const panelEl = document.getElementById('panel');
const panelClose = document.getElementById('panelClose');
const orientBtn = document.getElementById('orientBtn');
const hudEl = document.getElementById('hud');

function showErr(msg) {
  console.error(msg);
  errEl.textContent = '泳池场景加载失败\n' + msg + '\n\n可刷新重试；请确认 /models/pool/Swiming%20Pool.gltf 可访问。';
  errEl.classList.add('show');
  loadingEl.classList.add('hide');
}

try {

const canvas = document.getElementById('c');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const hasFinePointer = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
const desktopWater = hasFinePointer || !isMobile;
if (isMobile) hudEl.textContent = '拖动环视 · 双指缩放 · 点躺椅靠近 · 倾斜手机涌浪';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: !isMobile, alpha: false,
    powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false,
  });
} catch (e1) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'default' });
}
if (!renderer.getContext()) throw new Error('WebGL 不可用（当前设备/浏览器不支持）');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x87a8c4, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9eb8d0);
scene.fog = new THREE.Fog(0x9eb8d0, 18, 55);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.08, 120);
camera.position.set(1.2, 3.4, 7.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.enablePan = false;
controls.target.set(0.4, 1.2, 0);
controls.minDistance = 2.2;
controls.maxDistance = 14;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = Math.PI * 0.48;
const AZ_MIN = -0.72;
const AZ_MAX = 0.72;
controls.minAzimuthAngle = AZ_MIN;
controls.maxAzimuthAngle = AZ_MAX;
controls.update();

const ambient = new THREE.AmbientLight(0xfff2dd, 0.22);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xdfefff, 0x6a5a48, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2e0, 1.55);
sun.position.set(2, 12, -14);
sun.target.position.set(0, 1.0, 0);
sun.castShadow = !isMobile;
if (sun.castShadow) {
  const res = 2048;
  sun.shadow.mapSize.set(res, res);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
  sun.shadow.bias = -0.00025; sun.shadow.normalBias = 0.035;
  sun.shadow.radius = 2.5;
}
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xb8d4ff, 0.28);
fill.position.set(6, 5, 8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe8c8, 0.25);
rim.position.set(-4, 4, 3);
scene.add(rim);
// sunlight pouring in through the big window (-Z)
const windowSun = new THREE.DirectionalLight(0xfff0d8, 1.1);
windowSun.position.set(0, 6, -10);
windowSun.target.position.set(0, 0.8, 1.5);
scene.add(windowSun); scene.add(windowSun.target);
const bounce = new THREE.PointLight(0xffd2a0, 0.45, 16, 1.6);
bounce.position.set(0, 2.2, -2.2);
scene.add(bounce);

const outdoor = new THREE.Group(); scene.add(outdoor);
const buildingMats = [
  new THREE.MeshStandardMaterial({ color: 0x6d7f92, roughness: 0.85, metalness: 0.05 }),
  new THREE.MeshStandardMaterial({ color: 0x8a7b6a, roughness: 0.9, metalness: 0 }),
  new THREE.MeshStandardMaterial({ color: 0x5a6a78, roughness: 0.8, metalness: 0.08 }),
  new THREE.MeshStandardMaterial({ color: 0x9aa8b5, roughness: 0.75, metalness: 0.05 }),
];
const cityWinMats = [];
function makeBuilding(x, z, w, d, h, mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, h * 0.5 - 0.2, z); outdoor.add(mesh);
  const winMat = new THREE.MeshStandardMaterial({ color: 0xcfe6ff, emissive: 0xffe6a0, emissiveIntensity: 0.08, roughness: 0.35 });
  cityWinMats.push(winMat);
  const win = new THREE.Mesh(new THREE.BoxGeometry(w * 0.72, h * 0.55, 0.05), winMat);
  win.position.set(x, h * 0.42, z + d * 0.5 + 0.02); outdoor.add(win);
}
const rnd = (() => { let a = 42; return () => { a = (a * 16807) % 2147483647; return (a - 1) / 2147483646; }; })();
for (let i = 0; i < 10; i++) makeBuilding(-8 + i * 2.1 + (rnd() - 0.5) * 0.6, -6.5 - rnd() * 4.5, 1.1 + rnd() * 1.4, 1.0 + rnd() * 1.2, 2.5 + rnd() * 6.5, buildingMats[i % buildingMats.length]);
for (let i = 0; i < 5; i++) makeBuilding(-8.5 - rnd() * 3, -2 + i * 1.8 + (rnd() - 0.5), 1.2 + rnd(), 1.1 + rnd(), 3 + rnd() * 5, buildingMats[(i + 2) % buildingMats.length]);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshStandardMaterial({ color: 0x4a5560, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(-2, -0.25, -10); outdoor.add(ground);

const cars = [];
const carColors = [0xe85d4c, 0xf0c14a, 0x4aa3e0, 0x3d3d3d, 0xffffff];
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.32, 0.42), new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2 }));
  body.position.y = 0.22; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.24, 0.38), new THREE.MeshStandardMaterial({ color: 0xa8c8e8, roughness: 0.3 }));
  cabin.position.set(-0.05, 0.42, 0); g.add(cabin);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.28), new THREE.MeshStandardMaterial({ color: 0xfff2cc, emissive: 0xfff0c0, emissiveIntensity: 0.2 }));
  head.position.set(0.42, 0.22, 0); g.add(head); g.userData.head = head.material;
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.28), new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff2200, emissiveIntensity: 0.15 }));
  tail.position.set(-0.42, 0.22, 0); g.add(tail); g.userData.tail = tail.material;
  return g;
}
for (let i = 0; i < 4; i++) {
  const car = makeCar(carColors[i % carColors.length]);
  car.position.set(-10 + i * 4.5, 0, -5.2 - (i % 2) * 1.1);
  car.userData.speed = 1.4 + (i % 3) * 0.55;
  car.userData.laneZ = car.position.z;
  outdoor.add(car); cars.push(car);
}

/* ========== Procedural sky dome (real-time, no bake) ========== */
const skyUniforms = {
  uSunDir: { value: new THREE.Vector3(0.2, 0.8, -0.5).normalize() },
  uZenith: { value: new THREE.Color(0x4a90d9) },
  uHorizon: { value: new THREE.Color(0xc8dff0) },
  uGround: { value: new THREE.Color(0x3a4038) },
  uSunColor: { value: new THREE.Color(0xfff2dd) },
  uSunSize: { value: 0.035 },
  uSunIntensity: { value: 1.2 },
  uNightGlow: { value: 0.0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vDir = normalize(wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uSunDir, uZenith, uHorizon, uGround, uSunColor;
    uniform float uSunSize, uSunIntensity, uNightGlow;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = d.y;
      // atmosphere gradient
      vec3 col = mix(uHorizon, uZenith, smoothstep(-0.05, 0.65, h));
      col = mix(uGround, col, smoothstep(-0.35, 0.02, h));
      // horizon warm haze
      float haze = exp(-abs(h) * 6.0) * 0.25;
      col += uHorizon * haze;
      // sun disc + bloom
      float sunDot = max(dot(d, normalize(uSunDir)), 0.0);
      float disc = smoothstep(1.0 - uSunSize, 1.0, sunDot);
      float glow = pow(sunDot, 32.0) * 0.55 + pow(sunDot, 8.0) * 0.2;
      col += uSunColor * (disc * 2.2 + glow) * uSunIntensity;
      // night stars sprinkle
      float stars = step(0.997, fract(sin(dot(d.xy, vec2(12.9898,78.233))) * 43758.5453));
      col += vec3(0.85, 0.9, 1.0) * stars * uNightGlow;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 16), skyMat);
skyDome.renderOrder = -10;
scene.add(skyDome);

/* ========== Daylight cycle through the window (slow loop) ========== */
// timeOfDay 0–24; one full day ≈ 210s (偏慢、一直循环)
const DAY_CYCLE_MS = 240000;
const DAY_START_H = 7.5; // start mid-morning
const DAY_KEYS = [
  { h: 0,  name: '深夜', amb: [0x6a7f9e, 0.10], sunCol: 0x8ba3c7, sunInt: 0.04,
    sunPos: [-6, 10, -12], winInt: 0.05, bounceInt: 0.05, fillInt: 0.08, hemiInt: 0.12, rimInt: 0.05,
    sky: 0x0c1220, fog: 0x0a1018, hemiSky: 0x4a5a78, hemiGround: 0x1a1520, exposure: 0.88 },
  { h: 5.5, name: '黎明', amb: [0xffb08a, 0.16], sunCol: 0xffb08a, sunInt: 0.85,
    sunPos: [-14, 4.5, -16], winInt: 0.7, bounceInt: 0.35, fillInt: 0.12, hemiInt: 0.28, rimInt: 0.15,
    sky: 0xc8a0d0, fog: 0x3a2848, hemiSky: 0xffc8b0, hemiGround: 0x4a3028, exposure: 0.98 },
  { h: 8.5, name: '上午', amb: [0xfff2dd, 0.24], sunCol: 0xfff4e6, sunInt: 1.55,
    sunPos: [-8, 11, -15], winInt: 1.15, bounceInt: 0.5, fillInt: 0.22, hemiInt: 0.5, rimInt: 0.22,
    sky: 0x8ec8e8, fog: 0x7aa0b8, hemiSky: 0xdfefff, hemiGround: 0x6a5a48, exposure: 1.08 },
  { h: 12.5, name: '正午', amb: [0xfff8f0, 0.30], sunCol: 0xfff2dd, sunInt: 2.05,
    sunPos: [1, 16, -12], winInt: 1.55, bounceInt: 0.65, fillInt: 0.28, hemiInt: 0.62, rimInt: 0.2,
    sky: 0x6eb8e0, fog: 0x6a98b0, hemiSky: 0xe8f4ff, hemiGround: 0x7a6a58, exposure: 1.14 },
  { h: 16.5, name: '下午', amb: [0xffe8c8, 0.24], sunCol: 0xffd8a8, sunInt: 1.7,
    sunPos: [9, 10, -14], winInt: 1.25, bounceInt: 0.55, fillInt: 0.2, hemiInt: 0.48, rimInt: 0.28,
    sky: 0x9ec0d8, fog: 0x7a98a8, hemiSky: 0xffe8d0, hemiGround: 0x6a5848, exposure: 1.08 },
  { h: 18.5, name: '黄昏', amb: [0xff8a4c, 0.18], sunCol: 0xff8a4c, sunInt: 1.85,
    sunPos: [13, 5.5, -15], winInt: 1.6, bounceInt: 0.7, fillInt: 0.14, hemiInt: 0.32, rimInt: 0.35,
    sky: 0xe89bb5, fog: 0x6b4c7a, hemiSky: 0xffb090, hemiGround: 0x4a2830, exposure: 1.05 },
  { h: 20.5, name: '夜晚', amb: [0x8ba3c7, 0.11], sunCol: 0x8ba3c7, sunInt: 0.06,
    sunPos: [4, 12, -12], winInt: 0.06, bounceInt: 0.08, fillInt: 0.08, hemiInt: 0.14, rimInt: 0.08,
    sky: 0x12182a, fog: 0x0c101c, hemiSky: 0x4a5a78, hemiGround: 0x1a1520, exposure: 0.9 },
  { h: 24, name: '深夜', amb: [0x6a7f9e, 0.10], sunCol: 0x8ba3c7, sunInt: 0.04,
    sunPos: [-6, 10, -12], winInt: 0.05, bounceInt: 0.05, fillInt: 0.08, hemiInt: 0.12, rimInt: 0.05,
    sky: 0x0c1220, fog: 0x0a1018, hemiSky: 0x4a5a78, hemiGround: 0x1a1520, exposure: 0.88 },
];
const _cA = new THREE.Color(), _cB = new THREE.Color(), _cOut = new THREE.Color();
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3();
const phaseEl = document.getElementById('hint');
const SUN_PEAK = Math.max(...DAY_KEYS.map((k) => k.sunInt)) || 1;

function lerpDayKeys(hour) {
  const h = ((hour % 24) + 24) % 24;
  let i = 0;
  while (i < DAY_KEYS.length - 1 && DAY_KEYS[i + 1].h < h) i++;
  const a = DAY_KEYS[i], b = DAY_KEYS[Math.min(i + 1, DAY_KEYS.length - 1)];
  const span = (b.h - a.h) || 1;
  const u = Math.min(1, Math.max(0, (h - a.h) / span));
  const e = u * u * (3 - 2 * u);
  return { a, b, e, name: e < 0.5 ? a.name : b.name, hour: h };
}

function applyDayCycle(hour) {
  const { a, b, e, name, hour: h } = lerpDayKeys(hour);
  ambient.color.set(a.amb[0]).lerp(_cA.set(b.amb[0]), e);
  ambient.intensity = a.amb[1] + (b.amb[1] - a.amb[1]) * e;
  sun.color.set(a.sunCol).lerp(_cA.set(b.sunCol), e);
  sun.intensity = a.sunInt + (b.sunInt - a.sunInt) * e;
  _vA.set(...a.sunPos); _vB.set(...b.sunPos);
  sun.position.copy(_vA).lerp(_vB, e);
  sun.target.updateMatrixWorld();

  windowSun.color.copy(sun.color);
  windowSun.intensity = a.winInt + (b.winInt - a.winInt) * e;
  windowSun.position.set(sun.position.x * 0.35, Math.max(3.5, sun.position.y * 0.45), -10);
  windowSun.target.updateMatrixWorld();
  bounce.color.copy(sun.color);
  bounce.intensity = a.bounceInt + (b.bounceInt - a.bounceInt) * e;

  fill.intensity = a.fillInt + (b.fillInt - a.fillInt) * e;
  rim.intensity = a.rimInt + (b.rimInt - a.rimInt) * e;
  rim.color.copy(sun.color);
  hemi.intensity = a.hemiInt + (b.hemiInt - a.hemiInt) * e;
  hemi.color.set(a.hemiSky).lerp(_cA.set(b.hemiSky), e);
  hemi.groundColor.set(a.hemiGround).lerp(_cA.set(b.hemiGround), e);

  const skyC = _cOut.set(a.sky).lerp(_cA.set(b.sky), e);
  scene.background = null; // sky dome provides background
  scene.fog.color.set(a.fog).lerp(_cA.set(b.fog), e);
  renderer.toneMappingExposure = a.exposure + (b.exposure - a.exposure) * e;
  renderer.setClearColor(skyC.getHex(), 1);

  const sunDir = sun.position.clone().normalize();
  skyUniforms.uSunDir.value.copy(sunDir);
  skyUniforms.uZenith.value.copy(skyC);
  skyUniforms.uHorizon.value.set(a.hemiSky).lerp(_cA.set(b.hemiSky), e);
  skyUniforms.uGround.value.set(a.hemiGround).lerp(_cA.set(b.hemiGround), e);
  skyUniforms.uSunColor.value.copy(sun.color);
  skyUniforms.uSunIntensity.value = Math.max(0.05, sun.intensity / SUN_PEAK);
  // wider softer sun near horizon
  const elev = Math.max(0, sunDir.y);
  skyUniforms.uSunSize.value = 0.018 + (1 - elev) * 0.04;

  // drive jelly light / env from sun + sky
  waterUniforms.uLightDir.value.copy(sunDir);
  waterUniforms.uSunColor.value.copy(sun.color);
  waterUniforms.uSunIntensity.value = sun.intensity;
  waterUniforms.uSkyZenith.value.copy(skyC);
  waterUniforms.uSkyHorizon.value.copy(skyUniforms.uHorizon.value);
  waterUniforms.uGroundColor.value.copy(skyUniforms.uGround.value);

  const sunK = Math.min(1, Math.max(0, sun.intensity / SUN_PEAK));
  const nightK = Math.pow(1 - sunK, 1.35);
  skyUniforms.uNightGlow.value = nightK * 0.85;
  cityWinMats.forEach((wm, i) => {
    wm.emissiveIntensity = 0.05 + nightK * (0.55 + 0.7 * Math.abs(Math.sin(performance.now() * 0.0007 + i * 0.37)));
  });
  for (const car of cars) {
    if (car.userData.head) car.userData.head.emissiveIntensity = 0.15 + nightK * 1.7;
    if (car.userData.tail) car.userData.tail.emissiveIntensity = 0.1 + nightK * 1.3;
  }

  const hh = Math.floor(h);
  const mm = Math.floor((h - hh) * 60);
  phaseEl.textContent = `果冻水体 · ${name} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · 窗外日照循环`;
  return { sunK, nightK, name, hour: h };
}

const dayT0 = performance.now() - (DAY_START_H / 24) * DAY_CYCLE_MS;

/* ========== Jelly water: custom grid + shader (replace glTF water) ========== */
const MAX_WAKES = 12;
const wakeData = [];
for (let i = 0; i < MAX_WAKES; i++) wakeData.push({ x: 0, z: 0, dirX: 1, dirZ: 0, amp: 0, born: 0, life: 2.2 });

const waterUniforms = {
  uTime: { value: 0 },
  uWakes: { value: new Array(MAX_WAKES).fill(0).map(() => new THREE.Vector4()) },
  uWakeDir: { value: new Array(MAX_WAKES).fill(0).map(() => new THREE.Vector2()) },
  uFlow: { value: new THREE.Vector2(0.18, 0.07) },
  uSurge: { value: new THREE.Vector2(0, 0) },
  uFlowAmp: { value: 0.04 },
  uJellyColor: { value: new THREE.Color(0x4eb8c4) },
  uJellyDeep: { value: new THREE.Color(0x0e4f5c) },
  uJellyScatter: { value: new THREE.Color(0xc8fff4) },
  uLightDir: { value: new THREE.Vector3(0.35, 0.85, 0.4).normalize() },
  uSunColor: { value: new THREE.Color(0xfff2dd) },
  uSunIntensity: { value: 1.5 },
  uSkyZenith: { value: new THREE.Color(0x4a90d9) },
  uSkyHorizon: { value: new THREE.Color(0xc8dff0) },
  uGroundColor: { value: new THREE.Color(0x3a4038) },
  uCamPos: { value: new THREE.Vector3() },
};

const jellyVert = `
uniform float uTime;
uniform vec4 uWakes[${MAX_WAKES}];
uniform vec2 uWakeDir[${MAX_WAKES}];
uniform vec2 uFlow;
uniform vec2 uSurge;
uniform float uFlowAmp;
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying float vThick;
varying vec2 vLocal;

float wakeH(vec2 p) {
  float h = 0.0;
  for (int i = 0; i < ${MAX_WAKES}; i++) {
    vec4 w = uWakes[i];
    if (w.z <= 0.001) continue;
    vec2 dlt = p - w.xy;
    float dist = length(dlt);
    float age = w.w;
    float fade = 1.0 - clamp(age / 2.2, 0.0, 1.0);
    fade = fade * fade * (0.6 + 0.4 * fade); // viscous settle
    vec2 dir = uWakeDir[i];
    float along = dist > 1e-4 ? dot(normalize(dlt), dir) : 0.0;
    float direct = 0.5 + 0.5 * along;
    // jelly shove mound + trailing ripple
    float mound = exp(-dist * dist * 7.5) * direct;
    float rip = sin(dist * 11.0 - age * 7.5) * exp(-dist * dist * 2.6) * 0.65;
    h += (mound * 1.15 + rip) * w.z * fade * 0.28;
  }
  return h;
}

float ambientH(vec2 p) {
  vec2 f = p * 2.2 - uFlow * uTime;
  float h = sin(f.x * 2.8 + f.y * 1.6) * uFlowAmp;
  h += sin(f.y * 3.6 - uTime * 1.15 + f.x * 0.7) * uFlowAmp * 0.75;
  h += sin((p.x + p.y) * 5.5 + uTime * 2.1) * uFlowAmp * 0.28;
  float surgeDot = p.x * uSurge.x + p.y * uSurge.y;
  h += surgeDot * 0.055;
  h += sin(surgeDot * 4.5 - uTime * 2.8) * length(uSurge) * 0.05;
  return h;
}

void main() {
  vLocal = position.xy;
  vec2 p = position.xy;
  float h = ambientH(p) + wakeH(p);
  // soft jelly thickness puff
  float thick = 0.045 + abs(h) * 0.55 + length(uSurge) * 0.02;
  vec3 pos = position;
  pos.z += h;

  // finite-diff normals in local plane
  float e = 0.045;
  float hx = ambientH(p + vec2(e,0.0)) + wakeH(p + vec2(e,0.0));
  float hz = ambientH(p + vec2(0.0,e)) + wakeH(p + vec2(0.0,e));
  vec3 nLocal = normalize(vec3(-(hx - h) / e, -(hz - h) / e, 1.0));

  vec4 world = modelMatrix * vec4(pos, 1.0);
  vWorldPos = world.xyz;
  vNormalW = normalize(mat3(modelMatrix) * nLocal);
  vThick = thick;
  gl_Position = projectionMatrix * viewMatrix * world;
}
`;

const jellyFrag = `
uniform vec3 uJellyColor;
uniform vec3 uJellyDeep;
uniform vec3 uJellyScatter;
uniform vec3 uLightDir;
uniform vec3 uSunColor;
uniform float uSunIntensity;
uniform vec3 uSkyZenith;
uniform vec3 uSkyHorizon;
uniform vec3 uGroundColor;
uniform vec3 uCamPos;
uniform float uTime;
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying float vThick;
varying vec2 vLocal;

vec3 sampleSky(vec3 rd) {
  float h = rd.y;
  vec3 col = mix(uSkyHorizon, uSkyZenith, smoothstep(-0.05, 0.7, h));
  col = mix(uGroundColor, col, smoothstep(-0.4, 0.02, h));
  // sun reflection disc
  vec3 L = normalize(uLightDir);
  float sd = max(dot(rd, L), 0.0);
  float disc = smoothstep(0.997, 1.0, sd);
  float glow = pow(sd, 48.0) * 0.7 + pow(sd, 12.0) * 0.25;
  col += uSunColor * (disc * 2.5 + glow) * max(uSunIntensity * 0.35, 0.02);
  return col;
}

// GGX helpers
float D_GGX(float NoH, float rough) {
  float a = rough * rough;
  float a2 = a * a;
  float d = (NoH * a2 - NoH) * NoH + 1.0;
  return a2 / (3.14159265 * d * d + 1e-5);
}
float G_Schlick(float NoV, float NoL, float rough) {
  float k = (rough + 1.0);
  k = (k * k) / 8.0;
  float gV = NoV / (NoV * (1.0 - k) + k);
  float gL = NoL / (NoL * (1.0 - k) + k);
  return gV * gL;
}

void main() {
  vec3 N = normalize(vNormalW);
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uLightDir);
  float NoV = max(dot(N, V), 0.001);
  float NoL = max(dot(N, L), 0.0);

  // Schlick fresnel (F0 ~ 0.02 water / jelly ~0.04)
  vec3 F0 = vec3(0.045);
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - NoV, 5.0);

  // analytical environment reflection (synced with sky dome / sun)
  vec3 R = reflect(-V, N);
  // ripple-warped reflection for jelly
  R = normalize(R + N * 0.08);
  vec3 env = sampleSky(R);

  // jelly body / transmission look
  float warp = N.x * 0.3 + N.z * 0.2;
  float depthMix = clamp(vThick * 5.0 + warp * 0.35 + (1.0 - NoV) * 0.3, 0.0, 1.0);
  vec3 body = mix(uJellyColor, uJellyDeep, depthMix);

  // subsurface wrap
  float wrap = max(dot(N, L) * 0.5 + 0.5, 0.0);
  float sss = pow(wrap, 1.35) * (0.4 + vThick * 3.2);
  body += uJellyScatter * sss * 0.4;
  body += uSunColor * NoL * 0.08 * max(uSunIntensity * 0.25, 0.0);

  // GGX sun specular — follows sun tightly
  vec3 H = normalize(L + V);
  float NoH = max(dot(N, H), 0.0);
  float rough = 0.085 + vThick * 0.15;
  float D = D_GGX(NoH, rough);
  float G = G_Schlick(NoV, max(NoL, 0.001), rough);
  vec3 spec = (D * G * F) / max(4.0 * NoV * max(NoL, 0.001), 1e-4);
  spec *= uSunColor * max(uSunIntensity * 0.55, 0.02) * NoL;

  // soft wide lobe for jelly gloss
  float soft = pow(NoH, 28.0) * 0.22 * max(uSunIntensity * 0.4, 0.05);

  // caustic shimmer inside body
  float cau = sin(vLocal.x * 10.0 + uTime * 1.6 + N.x * 5.0)
            * sin(vLocal.y * 8.0 - uTime * 1.25);
  body += uJellyScatter * cau * 0.035 * NoV;

  // compose: body * (1-F) + env * F + specular
  vec3 col = body * (1.0 - F) + env * F + spec + uSunColor * soft;
  // rim boost
  col += env * pow(1.0 - NoV, 3.0) * 0.15;

  float alpha = clamp(0.52 + vThick * 2.6 + F.x * 0.35, 0.45, 0.92);
  gl_FragColor = vec4(col, alpha);
}

`;

const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  vertexShader: jellyVert,
  fragmentShader: jellyFrag,
});

let waterMesh = null;
let waterHit = null;
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let prevWaterHit = null;
let wakeWrite = 0;
let focused = false;
let focusT = 0;
const camFar = new THREE.Vector3();
const tgtFar = new THREE.Vector3();
const camNear = new THREE.Vector3();
const tgtNear = new THREE.Vector3();

function pushWake(x, z, dirX, dirZ, speed) {
  const w = wakeData[wakeWrite % MAX_WAKES];
  wakeWrite++;
  const len = Math.hypot(dirX, dirZ) || 1;
  w.x = x; w.z = z;
  w.dirX = dirX / len; w.dirZ = dirZ / len;
  w.amp = Math.min(1.5, 0.3 + speed * 1.9);
  w.born = clock.getElapsedTime();
  w.life = 1.8 + Math.min(0.8, speed * 0.45);
}

function syncWakeUniforms(t) {
  for (let i = 0; i < MAX_WAKES; i++) {
    const w = wakeData[i];
    const age = t - w.born;
    const live = w.amp > 0 && age < w.life;
    waterUniforms.uWakes.value[i].set(live ? w.x : 0, live ? w.z : 0, live ? w.amp : 0, live ? age : 0);
    waterUniforms.uWakeDir.value[i].set(w.dirX, w.dirZ);
  }
}

const hotspotGroup = new THREE.Group(); scene.add(hotspotGroup);
const hotspotMeshes = [];
function addHotspot(x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshBasicMaterial({ color: 0x7ec8c4, transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(x, y, z); hotspotGroup.add(m); hotspotMeshes.push(m);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.36, 32),
    new THREE.MeshBasicMaterial({ color: 0x7ec8c4, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, 0.14, z); ring.userData.pulse = true;
  hotspotGroup.add(ring);
}

function setFocus(on) {
  focused = on; focusT = 0;
  panelEl.classList.toggle('show', on);
  controls.enabled = !on;
  if (on) { camFar.copy(camera.position); tgtFar.copy(controls.target); }
}
panelClose.addEventListener('click', () => setFocus(false));

function onPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
}

canvas.addEventListener('pointermove', (e) => {
  onPointer(e);
  if (!desktopWater || focused || !waterHit || !waterMesh) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(waterHit, false);
  if (!hits.length) { prevWaterHit = null; return; }
  const local = waterMesh.worldToLocal(hits[0].point.clone());
  const lx = local.x, ly = local.y;
  const now = clock.getElapsedTime();
  if (prevWaterHit) {
    const dx = lx - prevWaterHit.x, dy = ly - prevWaterHit.y;
    const dt = Math.max(0.008, now - prevWaterHit.t);
    const speed = Math.hypot(dx, dy) / dt;
    if (speed > 0.28) pushWake(lx, ly, dx, dy, Math.min(speed, 4.5));
  }
  prevWaterHit = { x: lx, y: ly, t: now };
});
canvas.addEventListener('pointerleave', () => { prevWaterHit = null; });
canvas.addEventListener('pointerup', (e) => {
  if (focused) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  onPointer(e);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.intersectObjects(hotspotMeshes, false).length) setFocus(true);
});

let orientEnabled = false;
let orientSupported = typeof window.DeviceOrientationEvent !== 'undefined';
let surgeTarget = new THREE.Vector2(0, 0);
let surgeSmooth = new THREE.Vector2(0, 0);
let autoSurgePhase = 0;

function onDeviceOrient(ev) {
  if (!orientEnabled) return;
  const beta = ev.beta || 0, gamma = ev.gamma || 0;
  surgeTarget.set(
    THREE.MathUtils.clamp(gamma / 28, -1.25, 1.25),
    THREE.MathUtils.clamp((beta - 45) / 35, -1.25, 1.25)
  );
}

async function enableOrientation() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const state = await DeviceOrientationEvent.requestPermission();
      if (state !== 'granted') {
        orientBtn.textContent = '已拒绝 · 使用自动涌浪';
        orientBtn.classList.add('show');
        orientEnabled = false;
        return;
      }
    }
    window.addEventListener('deviceorientation', onDeviceOrient, true);
    orientEnabled = true;
    orientBtn.classList.remove('show');
    hudEl.textContent = '拖动环视 · 点躺椅靠近 · 倾斜手机涌浪';
  } catch (err) {
    console.warn('orientation permission', err);
    orientBtn.textContent = '陀螺仪不可用 · 自动涌浪';
    orientBtn.classList.add('show');
    orientEnabled = false;
  }
}

if (isMobile || !desktopWater) {
  waterUniforms.uFlowAmp.value = 0.065;
  waterUniforms.uFlow.value.set(0.32, 0.14);
  if (orientSupported) {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      orientBtn.classList.add('show');
      orientBtn.addEventListener('click', () => { enableOrientation(); });
    } else enableOrientation();
  } else {
    orientBtn.textContent = '无陀螺仪 · 自动涌浪';
    orientBtn.classList.add('show');
  }
} else {
  waterUniforms.uFlowAmp.value = 0.028;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

function placeJellyWater(wbCenter, wbSize) {
  const segs = isMobile ? [56, 34] : [96, 56];
  const geo = new THREE.PlaneGeometry(wbSize.x * 0.985, wbSize.z * 0.985, segs[0], segs[1]);
  waterMesh = new THREE.Mesh(geo, waterMat);
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.set(wbCenter.x, wbCenter.y + 0.02, wbCenter.z);
  waterMesh.renderOrder = 2;
  scene.add(waterMesh);
  waterHit = new THREE.Mesh(
    new THREE.PlaneGeometry(wbSize.x * 0.985, wbSize.z * 0.985),
    new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
  );
  waterHit.rotation.copy(waterMesh.rotation);
  waterHit.position.copy(waterMesh.position);
  scene.add(waterHit);
}

const loader = new GLTFLoader();
loader.load(
  '/models/pool/Swiming%20Pool.gltf',
  (gltf) => {
    const root = gltf.scene;
    root.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = !isMobile;
      o.receiveShadow = !isMobile;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        // slightly bump env response on room materials for live light
        if ('envMapIntensity' in m) m.envMapIntensity = 0.35;
        if ('roughness' in m && m.roughness > 0.9) m.roughness = 0.85;
      });
    });
    scene.add(root);

    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    root.position.x += -center.x;
    root.position.z += -center.z;
    root.position.y += -box.min.y;
    root.updateMatrixWorld(true);

    const box2 = new THREE.Box3().setFromObject(root);
    const c2 = box2.getCenter(new THREE.Vector3());
    controls.target.set(c2.x, Math.min(1.35, c2.y * 0.55 + 0.4), c2.z * 0.15);
    camera.position.set(c2.x + 0.8, 3.2, box2.max.z + 4.6);
    controls.update();

    let mainWater = null;
    const loungeCenters = [];
    root.traverse((o) => {
      if (!o.isMesh) return;
      // hide original flat water planes — replaced by jelly shader mesh
      if (o.name === 'Cube.017' || o.name === 'Cube.018') {
        o.visible = false;
        if (o.name === 'Cube.017') mainWater = o;
      }
      if (/^Cube\.00([7-9]|1[0-2])$/.test(o.name)) {
        loungeCenters.push(new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()));
      }
    });

    if (mainWater) {
      const wb = new THREE.Box3().setFromObject(mainWater);
      placeJellyWater(wb.getCenter(new THREE.Vector3()), wb.getSize(new THREE.Vector3()));
    } else {
      placeJellyWater(new THREE.Vector3(c2.x, 0.14, c2.z), new THREE.Vector3(5.5, 0, 3.2));
    }

    if (loungeCenters.length) {
      const avg = loungeCenters.reduce((a, v) => a.add(v), new THREE.Vector3()).multiplyScalar(1 / loungeCenters.length);
      addHotspot(avg.x, avg.y + 0.15, avg.z, 2.2, 0.9, 2.8);
      camNear.set(avg.x + 1.6, avg.y + 1.1, avg.z + 2.0);
      tgtNear.set(avg.x, avg.y + 0.2, avg.z);
    } else {
      addHotspot(-3.5, 0.6, 0.4, 2.0, 0.9, 2.5);
      camNear.set(-2.1, 1.55, 2.4);
      tgtNear.set(-3.6, 0.55, 0.35);
    }

    loadingEl.classList.add('hide');
    console.info('[pool] jelly ready', { size: size.toArray(), az: [AZ_MIN, AZ_MAX], mobile: isMobile });
  },
  (ev) => { if (ev.total) loadingEl.textContent = '加载泳池场景… ' + Math.round((ev.loaded / ev.total) * 100) + '%'; },
  (err) => showErr(String(err && err.message ? err.message : err))
);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.getElapsedTime();
  const cycleT = ((performance.now() - dayT0) % DAY_CYCLE_MS) / DAY_CYCLE_MS;
  const timeOfDay = cycleT * 24;
  applyDayCycle(timeOfDay);

  waterUniforms.uTime.value = t;
  waterUniforms.uCamPos.value.copy(camera.position);
  syncWakeUniforms(t);

  if (!orientEnabled) {
    autoSurgePhase += dt;
    surgeTarget.set(Math.sin(autoSurgePhase * 0.55) * 0.35, Math.cos(autoSurgePhase * 0.37) * 0.22);
  }
  surgeSmooth.lerp(surgeTarget, 1 - Math.exp(-3.5 * dt));
  waterUniforms.uSurge.value.copy(surgeSmooth);
  if (isMobile || !desktopWater) {
    waterUniforms.uFlow.value.set(0.22 + surgeSmooth.x * 0.2, 0.1 + surgeSmooth.y * 0.15);
  }

  for (const car of cars) {
    car.position.x += car.userData.speed * dt;
    if (car.position.x > 12) car.position.x = -12;
    car.position.z = car.userData.laneZ + Math.sin(t * 0.7 + car.position.x) * 0.02;
  }
  hotspotGroup.children.forEach((ch) => {
    if (ch.userData.pulse) {
      const s = 1 + Math.sin(t * 2.4) * 0.08;
      ch.scale.set(s, s, s);
      ch.material.opacity = 0.35 + Math.sin(t * 2.4) * 0.2;
    }
  });

  if (focused) {
    focusT = Math.min(1, focusT + dt * 1.35);
    const k = focusT * focusT * (3 - 2 * focusT);
    camera.position.lerpVectors(camFar, camNear, k);
    controls.target.lerpVectors(tgtFar, tgtNear, k);
  } else if (focusT > 0) {
    focusT = Math.max(0, focusT - dt * 1.2);
    const k = focusT * focusT * (3 - 2 * focusT);
    camera.position.lerpVectors(camFar, camNear, k);
    controls.target.lerpVectors(tgtFar, tgtNear, k);
    if (focusT === 0) controls.enabled = true;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

} catch (e) {
  showErr(e && e.stack ? e.stack : String(e));
}
</script>
</body>
</html>
